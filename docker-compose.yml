# engtutor 개발 환경
#
#   docker compose up              -> ollama + api + ui  (로컬 GPU 모드)
#   docker compose up api ui       -> api + ui 만        (Claude API 모드)
#
# api 는 LLM_BACKEND 환경변수로 백엔드를 고르므로 ollama 에 구조적으로 의존하지 않는다.
# 그래서 depends_on 을 일부러 걸지 않았다. (걸면 Claude 모드에서도 9GB 모델이 딸려 올라온다)

services:
  ollama:
    image: ollama/ollama:latest
    container_name: engtutor-ollama
    gpus: all
    ports:
      - "11434:11434"          # 호스트에서 직접 디버깅할 때 사용
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m   # 턴마다 9GB 모델을 언로드/로드하지 않도록
      # 평가·배치는 처리량이 중요해서 동시 슬롯을 연다. 슬롯마다 KV 캐시가
      # 따로 잡히는데 qwen3:14b·num_ctx 4096 기준 슬롯당 약 0.64GB 라
      # 4슬롯이면 2.6GB — 모델 9.3GB 를 올리고도 16GB 안에 들어간다.
      #
      # 주의: scripts/bench_latency.py 는 이 값이 1이라는 전제로 지연을 잰다.
      # 지연을 잴 때는 다른 요청을 절대 겹치지 말 것 — 큐 대기가 측정에 섞이면
      # 2.39s 가 8.64s 로 보인다.
      OLLAMA_NUM_PARALLEL: 4
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    container_name: engtutor-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace           # 코드 수정 -> 재빌드 없이 즉시 반영
      # Whisper 모델(small, 약 500MB). 이미지에 굽지 않고 볼륨에 둔다 — 이미지를
      # 다시 만들 때마다 500MB 를 다시 받으면 빌드가 매번 느려진다. 여기 두면
      # 컨테이너를 지웠다 만들어도 살아남는다.
      #
      # NTFS 바인드 마운트가 아니라 named volume 인 이유는 ollama_models 와 같다:
      # 큰 모델 파일을 NTFS 경계 너머에서 읽으면 로딩이 느리다.
      # 처음 한 번은 받아야 한다(`docker compose exec api python -c
      # "from app.stt import get_stt_service; get_stt_service().load()"`).
      - whisper_models:/models/whisper
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # NTFS -> WSL2 경계에서는 inotify 이벤트가 컨테이너까지 넘어오지 않는다.
      # 폴링을 켜지 않으면 --reload 가 실제로 동작하지 않는다.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build: .
    container_name: engtutor-ui
    command: >
      streamlit run ui/chat_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.fileWatcherType poll
      --browser.gatherUsageStats false
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000   # localhost 가 아니라 compose 서비스명
    ports:
      - "8501:8501"
    restart: unless-stopped


  # 폰에서 쓰는 React 클라이언트의 개발 서버.
  #
  # 왜 컨테이너냐: 호스트에도 api 이미지에도 node 가 없다. 개발 도구 하나
  # 때문에 호스트에 런타임을 깔지 않는다 — 저장소를 받은 사람이
  # `docker compose up -d web` 한 줄로 같은 환경을 얻어야 한다.
  #
  # 이건 **개발용**이다. 운영에서는 FastAPI 가 `npm run build` 결과를 `/` 로
  # 서빙하므로 이 서비스가 필요 없다. 그래야 앱과 API 가 같은 출처가 되고,
  # 터널의 인증서 한 장으로 HTTPS 가 해결된다 —
  # **폰 브라우저는 HTTPS 가 아니면 마이크를 내주지 않는다.**
  # (그래서 http://localhost:5173 에서는 마이크가 되지만 http://<LAN IP>:5173 에서는 안 된다)
  web:
    image: node:22-alpine
    container_name: engtutor-web
    working_dir: /workspace/ui_web
    # npm install 을 명령에 넣어 둔다. 이미지를 따로 만들지 않으므로 컨테이너를
    # 새로 만들 때 의존성이 없을 수 있는데, node_modules 볼륨이 살아 있으면
    # npm 이 할 일이 없다고 판단하고 몇 초 만에 넘어간다.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/workspace           # 소스 수정 -> HMR 로 즉시 반영
      # node_modules 는 named volume 에 둔다. NTFS 바인드 위에서 수만 개의 작은
      # 파일을 만들면 설치도 기동도 몇 배 느리다 — ollama_models · whisper_models 를
      # 볼륨에 둔 것과 같은 이유다. 바인드 마운트 위에 겹쳐 덮어 호스트의
      # ui_web/node_modules 와 섞이지 않게 한다.
      - web_node_modules:/workspace/ui_web/node_modules
    environment:
      # dev 서버가 /scenarios 같은 요청을 넘길 곳. localhost 가 아니라 서비스명.
      VITE_API_PROXY_TARGET: http://api:8000
      # NTFS -> WSL2 경계에서는 inotify 가 안 넘어온다. api 의
      # WATCHFILES_FORCE_POLLING 과 같은 이유로 파일 감시를 폴링으로 돌린다.
      VITE_WATCH_POLLING: "true"
    ports:
      - "5173:5173"
    restart: unless-stopped
  # 단어 검수 UI. 필요할 때만 띄우면 되므로 profile 뒤에 둔다.
  #   docker compose --profile review up -d review
  review:
    build: .
    container_name: engtutor-review
    profiles: ["review"]
    command: >
      streamlit run content/review_app.py
      --server.port 8502
      --server.address 0.0.0.0
      --server.fileWatcherType poll
      --browser.gatherUsageStats false
    volumes:
      - .:/workspace
    env_file:
      - .env
    ports:
      - "8502:8502"
    restart: unless-stopped

  # 외부 노출용 SSH 리버스 터널. 시범 때만 띄운다.
  #   docker compose --profile expose up -d tunnel
  #
  # 클라우드는 진입점으로만 쓴다 — 연산은 전부 이 집 GPU 에서 돈다.
  # VM 은 요청을 받아 이 터널로 넘길 뿐이고, 모델은 VM 에 올라가지 않는다.
  tunnel:
    build:
      context: .
      dockerfile: deploy/tunnel.Dockerfile
    container_name: engtutor-tunnel
    profiles: ["expose"]
    depends_on:
      - ui
      - api
    env_file:
      - .env
    volumes:
      - ./deploy/keys:/keys:ro   # 개인키. .gitignore 에 있다
    # NTFS 에서 마운트한 키는 권한이 0777 로 보여 ssh 가 거부한다.
    # 컨테이너 안으로 복사해 600 으로 낮춘 뒤 쓴다.
    #
    # -R 127.0.0.1:PORT 로 **루프백에만** 묶는다. VM 바깥에서 이 포트로 직접
    # 들어올 수 없고, 반드시 nginx(암호 한 겹)를 거치게 된다.
    # $$ 로 이스케이프해 compose 가 아니라 **컨테이너 안의 sh** 가 값을 읽게 한다.
    # compose 단계에서 ${TUNNEL_HOST:?...} 로 검사하면 이 파일을 읽는 모든 명령이
    # (평소의 up · exec 까지) TUNNEL_HOST 없이는 전부 실패한다. 시범용 선택 기능이
    # 일상 작업을 막으면 안 된다.
    #
    # 줄 들여쓰기를 **전부 같게** 맞춘다. YAML 접힘(>)은 더 깊이 들여쓴 줄을
    # 접지 않고 개행을 그대로 남기는데, 그러면 `exec autossh -M 0 -N` 에서
    # 명령이 끊겨 autossh 가 사용법만 출력하고 끝난다.
    #
    # 터널이 무엇을 내보낼지는 TUNNEL_TARGET 으로 정한다. VM 쪽 nginx 는 손대지
    # 않는다 — 원격 포트(TUNNEL_REMOTE_PORT)는 그대로다.
    #   api:8000 (기본) FastAPI. `/` 로 React 빌드(ui_web/dist)를, 그 아래로 API 를 준다.
    #   ui:8501         Streamlit. 데스크톱·검수용으로 남아 있는 화면.
    #
    # **왜 api 가 기본인가.** 폰에서 쓰려고 만든 것이기 때문이다.
    #   - 앱과 API 가 같은 출처라 CORS 가 없다.
    #   - **폰 브라우저는 HTTPS 가 아니면 마이크를 안 내준다.** 같은 출처면
    #     터널이 씌워 주는 인증서 한 장으로 화면과 API 가 함께 HTTPS 가 된다.
    #   - Streamlit 은 폰에서 웹소켓이 끊기면 서버가 답을 다 만들어 놓고도
    #     화면이 멈춰 있었다. 그 증상을 고치려고 React 클라이언트를 만들었다.
    # Streamlit 을 다시 내보내려면 .env 에 TUNNEL_TARGET=ui:8501 한 줄이면 된다.
    command: >
      'set -e;
      : "$${TUNNEL_HOST:?.env 에 TUNNEL_HOST 를 넣으세요 (예: engtutor.duckdns.org)}";
      cp /keys/$${TUNNEL_KEY:-id_ed25519} /tmp/k; chmod 600 /tmp/k;
      exec autossh -M 0 -N
      -o ServerAliveInterval=15 -o ServerAliveCountMax=3
      -o ExitOnForwardFailure=yes
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile=/tmp/known_hosts
      -i /tmp/k
      -R 127.0.0.1:$${TUNNEL_REMOTE_PORT:-8501}:$${TUNNEL_TARGET:-api:8000}
      $${TUNNEL_USER:-ubuntu}@$${TUNNEL_HOST}'
    restart: unless-stopped

volumes:
  ollama_models:                # NTFS 바인드 마운트는 9GB 모델 로딩이 느려서 named volume 사용
  whisper_models:               # 같은 이유. faster-whisper small 약 500MB
  web_node_modules:             # 같은 이유. npm 의존성은 파일이 수만 개라 NTFS 에서 특히 느리다
