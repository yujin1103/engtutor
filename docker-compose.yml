# engtutor 개발 환경
#
#   docker compose up              -> ollama + api + ui  (로컬 GPU 모드)
#   docker compose up api ui       -> api + ui 만        (Claude API 모드)
#
# api 는 LLM_BACKEND 환경변수로 백엔드를 고르므로 ollama 에 구조적으로 의존하지 않는다.
# 그래서 depends_on 을 일부러 걸지 않았다. (걸면 Claude 모드에서도 9GB 모델이 딸려 올라온다)

services:
  ollama:
    image: ollama/ollama:latest
    container_name: engtutor-ollama
    gpus: all
    ports:
      - "11434:11434"          # 호스트에서 직접 디버깅할 때 사용
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m   # 턴마다 9GB 모델을 언로드/로드하지 않도록
      # 평가·배치는 처리량이 중요해서 동시 슬롯을 연다. 슬롯마다 KV 캐시가
      # 따로 잡히는데 qwen3:14b·num_ctx 4096 기준 슬롯당 약 0.64GB 라
      # 4슬롯이면 2.6GB — 모델 9.3GB 를 올리고도 16GB 안에 들어간다.
      #
      # 주의: scripts/bench_latency.py 는 이 값이 1이라는 전제로 지연을 잰다.
      # 지연을 잴 때는 다른 요청을 절대 겹치지 말 것 — 큐 대기가 측정에 섞이면
      # 2.39s 가 8.64s 로 보인다.
      OLLAMA_NUM_PARALLEL: 4
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    container_name: engtutor-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace           # 코드 수정 -> 재빌드 없이 즉시 반영
      # Whisper 모델(small, 약 500MB). 이미지에 굽지 않고 볼륨에 둔다 — 이미지를
      # 다시 만들 때마다 500MB 를 다시 받으면 빌드가 매번 느려진다. 여기 두면
      # 컨테이너를 지웠다 만들어도 살아남는다.
      #
      # NTFS 바인드 마운트가 아니라 named volume 인 이유는 ollama_models 와 같다:
      # 큰 모델 파일을 NTFS 경계 너머에서 읽으면 로딩이 느리다.
      # 처음 한 번은 받아야 한다(`docker compose exec api python -c
      # "from app.stt import get_stt_service; get_stt_service().load()"`).
      - whisper_models:/models/whisper
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # NTFS -> WSL2 경계에서는 inotify 이벤트가 컨테이너까지 넘어오지 않는다.
      # 폴링을 켜지 않으면 --reload 가 실제로 동작하지 않는다.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build: .
    container_name: engtutor-ui
    command: >
      streamlit run ui/chat_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.fileWatcherType poll
      --browser.gatherUsageStats false
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000   # localhost 가 아니라 compose 서비스명
    ports:
      - "8501:8501"
    restart: unless-stopped

  # 단어 검수 UI. 필요할 때만 띄우면 되므로 profile 뒤에 둔다.
  #   docker compose --profile review up -d review
  review:
    build: .
    container_name: engtutor-review
    profiles: ["review"]
    command: >
      streamlit run content/review_app.py
      --server.port 8502
      --server.address 0.0.0.0
      --server.fileWatcherType poll
      --browser.gatherUsageStats false
    volumes:
      - .:/workspace
    env_file:
      - .env
    ports:
      - "8502:8502"
    restart: unless-stopped

  # 외부 노출용 SSH 리버스 터널. 시범 때만 띄운다.
  #   docker compose --profile expose up -d tunnel
  #
  # 클라우드는 진입점으로만 쓴다 — 연산은 전부 이 집 GPU 에서 돈다.
  # VM 은 요청을 받아 이 터널로 넘길 뿐이고, 모델은 VM 에 올라가지 않는다.
  tunnel:
    build:
      context: .
      dockerfile: deploy/tunnel.Dockerfile
    container_name: engtutor-tunnel
    profiles: ["expose"]
    depends_on:
      - ui
    env_file:
      - .env
    volumes:
      - ./deploy/keys:/keys:ro   # 개인키. .gitignore 에 있다
    # NTFS 에서 마운트한 키는 권한이 0777 로 보여 ssh 가 거부한다.
    # 컨테이너 안으로 복사해 600 으로 낮춘 뒤 쓴다.
    #
    # -R 127.0.0.1:PORT 로 **루프백에만** 묶는다. VM 바깥에서 이 포트로 직접
    # 들어올 수 없고, 반드시 nginx(암호 한 겹)를 거치게 된다.
    # $$ 로 이스케이프해 compose 가 아니라 **컨테이너 안의 sh** 가 값을 읽게 한다.
    # compose 단계에서 ${TUNNEL_HOST:?...} 로 검사하면 이 파일을 읽는 모든 명령이
    # (평소의 up · exec 까지) TUNNEL_HOST 없이는 전부 실패한다. 시범용 선택 기능이
    # 일상 작업을 막으면 안 된다.
    #
    # 줄 들여쓰기를 **전부 같게** 맞춘다. YAML 접힘(>)은 더 깊이 들여쓴 줄을
    # 접지 않고 개행을 그대로 남기는데, 그러면 `exec autossh -M 0 -N` 에서
    # 명령이 끊겨 autossh 가 사용법만 출력하고 끝난다.
    command: >
      'set -e;
      : "$${TUNNEL_HOST:?.env 에 TUNNEL_HOST 를 넣으세요 (예: engtutor.duckdns.org)}";
      cp /keys/$${TUNNEL_KEY:-id_ed25519} /tmp/k; chmod 600 /tmp/k;
      exec autossh -M 0 -N
      -o ServerAliveInterval=15 -o ServerAliveCountMax=3
      -o ExitOnForwardFailure=yes
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile=/tmp/known_hosts
      -i /tmp/k
      -R 127.0.0.1:$${TUNNEL_REMOTE_PORT:-8501}:ui:8501
      $${TUNNEL_USER:-ubuntu}@$${TUNNEL_HOST}'
    restart: unless-stopped

volumes:
  ollama_models:                # NTFS 바인드 마운트는 9GB 모델 로딩이 느려서 named volume 사용
  whisper_models:               # 같은 이유. faster-whisper small 약 500MB
