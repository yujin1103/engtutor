# engtutor 외부 진입점 (Oracle Cloud VM).
#
# 이 서버는 연산을 하지 않는다. SSH 리버스 터널이 127.0.0.1 에 붙여 놓은
# 집 GPU 의 Streamlit 으로 요청을 넘길 뿐이다.
#
# 여기서 지키는 것 두 가지:
#   1. 암호 한 겹 (auth_basic)  — URL 만 아는 사람이 GPU 를 쓰지 못하게
#   2. 채팅 UI 하나만          — 검수 UI(8502)·API(8000)·Ollama(11434)는 터널에 없다
#
# vm_setup.sh 가 __DOMAIN__ 을 실제 호스트명으로 바꿔 설치한다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 주의: 이 제한은 **연결 시도**를 막을 뿐, 웹소켓 하나가 열린 뒤 그 안에서
# 오가는 대화 턴은 세지 못한다. GPU 를 지키는 실질적인 방어는 아래 암호다.
#
# 처음에 rate=2r/s burst=40 으로 뒀다가 화면이 하얗게 뜨는 고장을 냈다.
# Streamlit 첫 화면은 JS·CSS 를 **112개** 동시에 요청하는데, 그중 71개가 503 으로
# 잘려 나갔다. 사람이 브라우저로 열기 전에는 안 보이는 종류의 고장이라
# (스크립트로 /만 받아 보면 200 이다) 정적 자산은 아래에서 제한 밖으로 뺀다.
limit_req_zone $binary_remote_addr zone=engtutor:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 인증서 갱신 경로만 남기고 전부 HTTPS 로 보낸다.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    # http2 는 일부러 빼 뒀다. nginx 1.25 부터 `listen ... http2` 가 폐기되고
    # `http2 on;` 으로 바뀌는데, Ubuntu 22.04(1.18)·24.04(1.24)는 옛 문법만 안다.
    # 시범 페이지에서 얻을 게 크지 않아 버전 의존을 만들지 않는다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 암호 한 겹. HTTPS 위에서만 의미가 있다 — 평문 HTTP 로 열면 암호가 그대로 흐른다.
    auth_basic "engtutor demo";
    auth_basic_user_file /etc/nginx/engtutor.htpasswd;

    # 시범용이라 검색엔진에 잡힐 이유가 없다.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;

    # 정적 자산은 속도 제한에서 뺀다. 첫 화면 한 번에 112개가 몰려오는데,
    # 이걸 제한에 걸면 앱이 아예 뜨지 않는다. 암호는 그대로 걸려 있다.
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=engtutor burst=100 nodelay;

        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        # Streamlit 은 /_stcore/stream 에서 웹소켓을 연다. 이 두 줄이 없으면
        # 화면은 뜨지만 입력이 아무 반응도 하지 않는다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 로컬 GPU 가 답하는 데 몇 초 걸리고, 스트리밍은 그보다 오래 열려 있다.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;          # 스트리밍을 모아 두지 않는다

        proxy_intercept_errors on;
        error_page 502 504 = @tunnel_down;
    }

    # 터널이 끊겼을 때 nginx 기본 502 대신 무슨 일인지 알려 준다.
    # 시범 중에 집 PC 가 꺼지면 실제로 여기로 온다.
    location @tunnel_down {
        auth_basic off;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>engtutor</title><style>body{font-family:system-ui;margin:15vh auto;max-width:32rem;padding:0 1.5rem;line-height:1.7}</style><h2>지금은 연결되어 있지 않아요</h2><p>이 앱은 개발자의 로컬 GPU에서 돌아갑니다. 그 컴퓨터가 꺼져 있으면 접속할 수 없어요.</p><p>잠시 뒤 다시 시도해 주세요.</p>';
    }
}
