- word: populist
  example_ko: "우리 고객은 포퓰리스트 정치인이에요."
  reason: "해석이 '인기 있는 정치인' 이었다. populist 는 popular 가 아니다."

- word: pride
  example_ko: "저는 제 일이 자랑스러워요."
  reason: "'저는 제 일에 자랑스럽습니다' 는 조사가 틀렸고 문체도 어긋난다."

- word: pub
  example_ko: "제 집 근처에 펍이 있어요."
  reason: "'저 집 근처' 는 that house 로 읽힌다. 원문은 my house 다."

- word: unprecedented
  example_ko: "이건 전례 없는 상황이에요."
  reason: "'이례적인 상황입니다' 는 unusual 쪽 뜻이고 문체도 어긋난다."

- word: incumbent
  example_ko: "현직 관리자가 이 요청을 승인해야 해요."
  reason: "'현재 관리자는 … 합니다' 는 어색하고 문체도 어긋난다."

- word: outsider
  example_ko: "그는 우리 회사에서 외부인이에요."
  reason: "'~입니다' 는 이 앱의 문체가 아니다."

- word: opportunity
  example_ko: "이건 좋은 기회예요."
  reason: "'~입니다' 는 이 앱의 문체가 아니다."

- word: reluctance
  example_ko: "저는 새 프로젝트가 망설여져요."
  reason: "'망설입니다' 는 문체가 어긋나고 주어도 없다."

- word: steadily
  example_ko: "이 일을 꾸준히 해 주세요."
  reason: "'이 프로젝트에 대해 꾸준히 계속 일해 주세요' 는 번역투이고 겹말이다."

- word: scrutiny
  example_ko: "우리 계획은 지금 검토를 받고 있어요."
  reason: "'지금 현재' 는 겹말이다."

- word: pin
  example_ko: "여기에 카드 비밀번호를 눌러도 될까요?"
  reason: "money 묶음의 pin 인데 옷핀으로 풀이해 놓고, 예문도 'Can I use a pin to fix my card?' 라는 뜻이 통하지 않는 문장이었다. 해석만 고치면 빈칸이 더 망가져서 항목을 통째로 다시 만든다."

- word: takeoff
  example_ko: "이륙이 몇 시예요?"
  reason: "예문이 'When does the plane takeoff?' 로, 동사 자리에 명사형을 써서 틀린 영어였다. 해석의 '출발' 도 leave·depart 로 읽혀 이륙이라는 단서를 지웠다."

- word: december
  example_ko: "제 생일은 12월에 있어요."
  reason: "예문과 문형이 december 를 소문자로 썼다. 영어 월 이름은 늘 대문자로 시작한다."

- word: sneeze
  example_ko: "저는 꽃 때문에 재채기를 했어요."
  reason: "예문 'I sneezed at the flower.' 의 sneeze at 은 '우습게 보다' 라는 관용구다. 문형과 설명이 그것을 재채기의 대상으로 가르치고 있었고, 해석 '꽃을 보면 재채기했어요' 는 시제도 엇갈렸다."

- word: vacancy
  example_ko: "오늘 밤 빈방 있나요?"
  reason: "예문 'Is there a vacancy in this room?' 은 방 안에 빈방이 있냐는 말이 되어 뜻이 통하지 않았다. 해석의 '빈자리' 도 앉는 자리로 읽힌다."

- word: top-up
  example_ko: "카드에 충전이 필요해요."
  reason: "예문이 'I need to top-up my card.' 로, 동사 자리에 붙임표가 붙은 명사형을 썼다. 문형도 그 틀린 형태를 가르치고 있었다."

- word: jam
  example_ko: "지하철이 사람으로 꽉 찼어요."
  reason: "뜻을 '교통 체증; 꽉 막히다' 로 고치고 나니 옛 해석 '붐비네요' 가 그 뜻과 한 글자도 겹치지 않아 자동 검사에 걸렸다. 되짚기가 잡아 준 자리다."
