# 예문 해석(example_ko)을 사람이 읽고 고친 것.
#
# 왜 손으로 고치는가
# ------------------
# 해석의 거짓은 결정론적 검사로 못 잡는다. 지금 걸려 있는 네 검사
# (외국 문자 · 옮기다 만 로마자 · 수 · 표제어 뜻 흔적)는 전부 통과시키면서
# **뜻이 반대이거나 다른 물건을 가리키는** 해석이 그대로 남는다.
#
# 실측: 카페·패스트푸드·음식 팩 129개를 사람이 읽어 **22개(17%)** 가 명백히 틀렸다.
# 같은 129개에 검사기 4종을 돌리면 0건이다.
#
# 가장 나쁜 것은 `pork` 였다 — "I want a pork burger" 의 해석이 "소고기 버거" 였다.
# **정반대를 가르친다.** 왕초보는 해석을 보고 빈칸을 채우므로, 해석이 틀리면
# 학습자가 옳게 답하고도 오답 처리된다.
#
# 적용:  docker compose exec api python content/apply_fixes.py --glosses
# 확인만: docker compose exec api python content/apply_fixes.py --glosses --dry-run
#
# manual_fixes.yaml 과 나눠 둔 이유: 저쪽은 "실재하지 않는 영어 낱말"을 지우는 일이고
# (판정 근거 docs/hallucinations.md), 이쪽은 번역의 정확성이다. 판정 방법도 다르다 —
# 저쪽은 사전 조회로 좁히고, 이쪽은 사람이 영어와 한국어를 나란히 읽는 수밖에 없다.

# ── 뜻이 반대이거나 다른 물건을 가리킨다 ─────────────────────────
- word: pork
  example_ko: "돼지고기 버거 하나 주세요."
  reason: "'소고기 버거' 였다. pork 는 돼지고기다 — 정반대를 가르치고 있었다."

- word: ketchup
  example_ko: "감자튀김에 케첩 좀 주세요."
  reason: "'치킨소스' 는 케첩이 아니다."

- word: coleslaw
  example_ko: "버거에 코울슬로 곁들여 주세요."
  reason: "'라이스볼' 은 코울슬로(양배추 샐러드)가 아니다."

- word: outlet
  example_ko: "제 노트북 쓸 콘센트가 어디에 있나요?"
  reason: "'전원 어댑터' 였다. outlet 은 벽에 있는 콘센트다."

- word: sushi
  example_ko: "초밥을 한번 먹어보고 싶어요."
  reason: "'회' 는 sashimi 다. sushi 는 초밥."

- word: octopus
  example_ko: "저는 문어를 안 좋아해요."
  reason: "'우리가 먹는 게 조개, 게, 오징어 같은 거예요' — 원문(I don't like octopus)과 아무 상관이 없다."

- word: squid
  example_ko: "저는 오징어를 안 좋아해요."
  reason: "'우리가 먹는 게 조개예요' — 원문과 무관하고 조개는 clam 이다."

- word: milkshake
  example_ko: "초콜릿 밀크셰이크 하나 주세요."
  reason: "'마시멜로 쉐이크' 였다."

- word: pastry
  example_ko: "크루아상과 페이스트리 하나씩 주세요."
  reason: "'베이글' 이었다. pastry 는 베이글이 아니다."

- word: roast
  example_ko: "미디엄 로스트 커피로 주세요."
  reason: "'중불로' 는 요리 화력이다. medium roast 는 원두 볶음 정도."

- word: bean
  example_ko: "콩 수프 있나요?"
  reason: "'빈 수프' 는 empty soup 으로 읽힌다."

- word: chewy
  example_ko: "이 사탕은 쫄깃해요."
  reason: "'씹는 게 좋아요' 는 취향 진술이다. chewy 는 식감."

- word: salty
  example_ko: "이 수프는 너무 짜요."
  reason: "원문은 soup 인데 '라면' 이라고 옮겼다."

- word: broth
  example_ko: "이 수프는 닭 육수가 진해요."
  reason: "'브로스' 는 옮기다 만 말이다. 육수."

- word: bibimbap
  example_ko: "비빔밥 한번 먹어보고 싶어요."
  reason: "'시도해 보고 싶어요' 는 번역투다. try 는 먹어보다."

- word: matcha
  example_ko: "말차 라떼 하나 주세요."
  reason: "'매치라떼' 는 없는 말이다."

# ── 빈칸이 될 낱말이 해석에서 증발했다 ──────────────────────────
- word: mug
  example_ko: "머그잔에 커피 한 잔 주세요."
  reason: "'커피 한 잔 주세요' 라 mug 의 흔적이 없다. 해석이 빈칸의 단서인데 그 단서가 사라지면 문제가 성립하지 않는다."

# ── 없는 말·오타 ──────────────────────────────────────────
- word: cashier
  example_ko: "계산원이 저에게 거스름돈을 주었어요."
  reason: "'줄돈' 은 없는 말이다."

- word: straw
  example_ko: "주스에 빨대 하나 주세요."
  reason: "'스푸이' 는 없는 말이다."

- word: crispy
  example_ko: "바삭한 감자튀김으로 주세요."
  reason: "'크리스피한 프라이즈' — 프라이즈는 오타이고 crispy 도 옮기지 않았다."

- word: mushroom
  example_ko: "버섯 올린 감자튀김 주세요."
  reason: "'프라이스' 는 오타다."

- word: soup
  example_ko: "수프 한 그릇 주세요."
  reason: "'소프' 는 오타다."

- word: tuna
  example_ko: "참치 초밥 먹고 싶어요."
  reason: "'타우나' 는 없는 말이다."

- word: cookie
  example_ko: "커피에 곁들여 쿠키 하나 주세요."
  reason: "'곁들어' 는 오타다."

# ── 어색하거나 문체가 어긋난다 (뜻은 통한다) ─────────────────────
- word: cabbage
  example_ko: "저는 양배추를 안 좋아해요."
  reason: "'나는' 은 이 앱의 해요체와 어긋나고, cabbage 는 배추가 아니라 양배추다."

- word: chopsticks
  example_ko: "저는 면을 먹을 때 젓가락을 써요."
  reason: "'나는' 문체 어긋남."

- word: pickled
  example_ko: "저는 절인 무를 좋아해요."
  reason: "'나는' 문체 어긋남."

- word: steamed
  example_ko: "저는 흰쌀밥을 좋아해요."
  reason: "'증기로 데친 밥' — 밥은 데치는 것이 아니다. steamed rice 는 흰밥."

- word: stew
  example_ko: "이 소고기 스튜가 맛있어요."
  reason: "'찌개' 는 다른 음식이다."

- word: butter
  example_ko: "제 토스트에 버터 좀 발라 주시겠어요?"
  reason: "'내' 는 문체 어긋남. on my toast 는 얹는 것보다 바르는 것."

- word: dine-in
  example_ko: "매장에서 마실 커피로 주세요."
  reason: "'테이크아웃이 아니라 매장에서 마실 수 있는 커피를 주세요' 는 왕초보에게 너무 길다."

- word: strawberry
  example_ko: "딸기 우유 하나 주세요."
  reason: "'필요해요' 보다 주문 문장이 장면에 맞다."

# ── 장면 팩 299개를 읽고 고친 해석 (2026-08-27) ──────────────────
#
# 카페·패스트푸드·음식 129개에 이어 남은 장면 팩 아홉을 전부 읽었다.
# 299개 중 67개만 고칠 데가 없었다. 판정 근거는 항목마다 reason 에 있다.

- word: adapter
  example_ko: "제 휴대폰에 쓸 어댑터 있나요?"
  reason: "'있으십니까'는 해요체가 아니에요. '전화기용'도 딱딱하니 예문의 for my phone 을 '제 휴대폰에 쓸'로 풀어 주는 게 좋아요."

- word: airport
  example_ko: "저희는 공항에 도착했어요."
  reason: "'~했습니다'는 이 앱의 해요체가 아니에요."

- word: aisle
  example_ko: "빵은 3번 통로에 있어요."
  reason: "번호를 붙이면 'the'를 쓰지 않는데(예문도 'in aisle 3') pattern 이 'the + aisle + number'라 예문과 어긋나요. usage_note 의 \"'row'와 혼동하지만\"도 문장이 끊겨 뜻이 통하지 않아요. (검증: pattern·usage_note 교정은 맞지만 해석의 '3번 코너'는 학습자를 corner 라는 콩글리시로 이끄니 aisle 의 뜻인 '3번 통로'로 함께 고쳐야 해요.)"

- word: allergic
  example_ko: "저는 땅콩 알레르기가 있어요."
  reason: "peanut은 땅콩인데 콩(bean)으로 옮겼어요. 조사도 '콩이 알레르기'라 어색해요."

- word: allergy
  example_ko: "저는 견과류 알레르기가 있어요."
  reason: "'~입니다'는 이 앱의 해요체가 아니고, '견과류가 알레르기'라는 조사도 어색해요."

- word: ankle
  example_ko: "제 발목이 많이 아파요."
  reason: "meaning_ko가 '종아리'로 틀렸고 usage_note가 그 거짓을 두 번 반복해요. 해석의 '내'도 문체에 어긋나요."

- word: antibiotic
  example_ko: "이 증상에 항생제가 필요할까요?"
  reason: "'이거에 대해서'는 for this를 그대로 옮긴 번역투라 왕초보가 읽기 어색해요."

- word: atm
  example_ko: "ATM에서 잔돈으로 바꿀 수 있을까요?"
  reason: "'은행 자동기'는 한국어에 없는 말이에요(현금 자동 입출금기가 맞아요). pattern 자리에 ATM 의 문형이 아니라 다른 장소 표현이 들어가 있고, get change 는 '동전을 바꿔주다'가 아니라 잔돈으로 바꾸는 것이에요. (검증: '은행 자동기'와 pattern 지적은 옳지만, 은행 창구 직원은 cashier 가 아니라 teller 라서 제안한 usage_note 가 새 오류를 집어넣어요.)"

- word: attendant
  example_ko: "짐 맡아 주는 직원은 어디에 있어요?"
  reason: "usage_note 가 attendant 를 '짐 맡길 때 쓰는 직원'으로만 좁혀 사실과 달라요. 해석의 '짐을 맡기는 직원'도 맡기는 쪽이 손님이라 방향이 헷갈려요."

- word: bandage
  example_ko: "제 손에 붕대를 감아 주세요."
  reason: "예문은 'a bandage'라는 명사 용법인데 meaning_ko는 동사 뜻만 줘서 빈칸의 단서가 어긋나요."

- word: bathrobe
  example_ko: "목욕 가운 있나요?"
  reason: "'바스로브'는 한국어에 없는 말이에요. bathrobe 를 옮기다 만 로마자라 meaning_ko 대로 '목욕 가운'이라고 써야 해요."

- word: bathroom
  example_ko: "화장실이 어디예요?"
  reason: "usage_note 의 \"the 를 붙이면 욕실, 안 붙이면 화장실\"은 사실이 아니에요. 관사로 뜻이 갈리지 않아요. 해석의 '어디에요'는 '어디예요'가 맞는 표기이고, meaning_ko 도 예문 뜻(화장실)과 어긋나요."

- word: battery
  example_ko: "제 휴대폰 배터리가 다 됐어요."
  reason: "'다 쳐졌어요'는 없는 말이에요. usage_note 는 배터리가 없을 때 empty 를 쓰라는데 예문 자체가 dead 이고, 영어에서 배터리에는 empty 를 쓰지 않아요."

- word: bruise
  example_ko: "제 다리에 멍이 들었어요."
  reason: "meaning_ko가 '이끼'(moss)로 틀렸고 usage_note가 '이끼'를 두 번 더 말하며 '피부에 생긴 붉은 점'이라는 거짓까지 붙였어요."

- word: bulb
  example_ko: "전구가 나갔어요, 갈아 주시겠어요?"
  reason: "bulb 는 구슬이 아니에요(구슬은 marble). 해석의 '불'은 light 로 읽혀 표제어 뜻이 사라져요. pattern 의 'bulb + of + 색/물질(구슬의 경우)'도 없는 문형이에요."

- word: cab
  example_ko: "호텔까지 택시 타고 가요."
  reason: "'타자요'는 없는 말이에요. usage_note 의 \"한국어 '택시'는 택시 기사가 타는 차를 말하지만 cab 은 사람을 태우는 차\"라는 설명은 거짓이에요. 둘은 같은 것을 가리켜요."

- word: candy
  example_ko: "여기 사탕 있나요?"
  reason: "해석에서 candy(사탕)가 사라지고 '씹을 거'가 되어 빈칸을 채울 근거가 없어요(gum 으로 읽혀요). usage_note 의 '과자와 떠다란 뜻이 있어요'는 '떠다란'이라는 없는 낱말이고, meaning_ko 에도 사탕이 빠져 있어요. (검증: 해석·뜻·usage_note 교정은 옳지만 예문이 'any candy'인데 pattern 을 'a/the + candy'로 둔 채여서, cereal·spinach 와 같은 불가산 표시까지 함께 고쳐야 짝이 맞아요.)"

- word: carry-on
  example_ko: "이건 제 기내용 가방이에요."
  reason: "'~입니다'는 이 앱의 문체가 아니에요. '캐리온'은 옮기다 만 로마자이고, usage_note 의 '하수하물'은 한국어에 없는 말이에요. (검증: '~입니다'·'캐리온'·'하수하물' 지적은 옳지만, pattern 의 'carry-on + 목적어 (짐)'은 명사를 동사처럼 적은 거짓인데 비워 두고 지나갔어요.)"

- word: cereal
  example_ko: "아침으로 먹을 시리얼이 좀 필요해요."
  reason: "cereal 은 시리얼인데 뜻이 '즉석밥, 영양간'(없는 낱말)으로 적혔고 해석은 '죽'이라 표제어가 통째로 사라졌어요. usage_note 도 그 거짓을 되풀이하고, cereal 은 불가산인데 pattern 이 'a + cereal'로 되어 있어요."

- word: check-in
  example_ko: "체크인 카운터는 어디예요?"
  reason: "'어디에요'는 '어디예요'가 맞아요. meaning_ko 의 '짐을 내리고'는 짐을 부치는 절차를 잘못 적은 거예요."

- word: checkout
  example_ko: "계산대로 가요."
  reason: "'결제대'는 한국 마트에서 쓰지 않는 말이라 '계산대'로 통일해야 해요. usage_note 의 '곳이예요'도 '곳이에요'의 오타예요."

- word: chilly
  example_ko: "오늘은 쌀쌀해서 겉옷이 필요해요."
  reason: "'춥어서'는 없는 말이고 '추워서'가 맞다. chilly 는 촉감의 '차갑다'가 아니라 날씨의 '쌀쌀하다'다. usage_note 는 '~좋습니다'로 해요체를 벗어났고, pattern 'chilly + (인물/장소)'는 예문 It's chilly 와 맞지 않는다."

- word: clogged
  example_ko: "배수구가 머리카락으로 막혔어요."
  reason: "'헤어'는 hair 를 옮기다 만 말이에요. 한국어로는 머리카락이라고 해야 해요. usage_note 의 '쓰입니다'도 이 앱의 해요체가 아니고요."

- word: collar
  example_ko: "이 옷깃은 무슨 색이에요?"
  reason: "'~의 색은 무엇인가요'는 왕초보가 읽기 어려운 번역투예요. '깃'만 쓰면 새 깃털로도 읽혀서 '옷깃'이 분명해요."

- word: commute
  example_ko: "저는 기차로 출퇴근해요."
  reason: "\"한국어 '출퇴근하다'는 출퇴근하는 사람을 말한다\"가 거짓이다. '출퇴근하다'는 동사로 행위를 말하고, 사람은 '통근자'다. 없는 차이를 지어내 설명하고 있다. (검증: usage_note 지적은 옳지만 해석을 그냥 둔 것이 문제다 — '기차로 출근해요'는 I go to work by train 의 해석이라 confused_with 의 go 를 답으로 부르고 commute 의 '매일 오간다'가 빠지므로 '출퇴근해요'로 함께 고쳐야 한다.)"

- word: conductor
  example_ko: "차장이 표를 확인하고 있어요."
  reason: "example_ko 가 null 이라 해석이 아예 없어서 문제가 성립하지 않아요. meaning_ko 와 usage_note 는 conductor 를 '운전하는 사람'이라고 하는데 거짓이에요. 운전은 driver 가 하고 conductor 는 표를 확인하는 차장이에요."

- word: convenience
  example_ko: "이 폰에는 편리한 기능이 많아요."
  reason: "pattern 이 '불가산명사 (a convenience X)' 처럼 앞뒤가 맞지 않아요. usage_note 는 셀 수 없다고 하는데 정작 예문이 conveniences 라는 복수를 쓰고 있어 서로 어긋나요."

- word: crosswalk
  example_ko: "횡단보도에서 기다려 주세요."
