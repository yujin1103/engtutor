  reason: "'데우다'는 뜨겁게 만드는 동작이라 상태를 말하는 hot 으로 새지 않는다. 저장된 뜻과 설명은 예문의 쓰임과 맞다. (검증: 해석은 맞고 뜻·예문도 그대로 두면 된다. 놓친 것은 usage_note 다 — 'hot이예요', ''This pot is hot.'이예요' 두 군데가 '이에요' 오타인데 usage_fix 를 비워 뒀다. 이 글도 학습자 화면에 뜬다. 이렇게 고쳐라: \"heat는 무언가를 뜨겁게 만드는 동작이에요. 뜨거운 상태를 말할 때는 hot을 써요. '이 냄비는 뜨거워요'는 'This pot is hot.'이에요.\" 참고로 '데워 주세요' 는 warm 으로도 옮길 수 있지만 confused_with 에 없어 시연에서는 문제되지 않는다.)"

- word: "holder"
  example_ko: "컵 홀더가 고장 났어요."
  reason: "'컵 받침대' 는 곧 cup holder 라서 빈칸이 하나로 정해져요. 저장된 설명은 keep 과 헷갈린다고 했는데 실제로 헷갈릴 자리가 아니라, 쓸모 있는 짝(cup holder, card holder) 으로 바꿔 썼어요. (검증: '컵 받침대' 는 잘못 골랐어요. 한국어에서 '컵 받침' 은 잔 밑에 까는 코스터를 가리키고, 코스터는 고장 나지도 않습니다. 차나 책상에 붙은 cup holder 는 한국에서도 '컵 홀더' 라고 그대로 부르니 그 말을 해석에 남기면 빈칸이 holder 하나로 정해져요. 저장된 뜻 '물건을 잡고 있는 사람 또는 물건' 도 번역투라 다듬었습니다. keep 과는 헷갈릴 자리가 아니라는 앞사람 지적에는 동의해요.)"

- word: "identity"
  example_ko: "경찰이 그 사람의 신분을 확인했어요."
  reason: "원 예문 'What is your national identity?'는 사람에게 대놓고 묻는 말로 어색해서(보통 nationality 를 묻는다) 바꿨다. '신분'은 명사 자리라 identify(확인하다)·identical(똑같은)로 새지 않는다."

- word: "improvement"
  example_ko: "그 서비스는 개선이 좀 필요해요."
  reason: "원 예문 'There is improvement in your English.'는 관사가 빠져 어색하고, 그 해석을 쓰면 '좋아졌다'가 progress 로도 읽혀 답이 둘이 된다. '개선'이 붙는 자리로 예문을 바꿔 progress·development 를 밀어냈다. '동사형은 부자연스럽다'는 설명도 거짓이라 고쳤다."

- word: "involvement"
  example_ko: "그 프로젝트에 어떻게 관여하고 계세요?"
  reason: "'관여'가 interest(관심)·participation 과 갈리는 말이다. your 뒤 명사 자리라 동사 involve 로도 새지 않는다. (검증: 해석은 자연스럽고, 빈칸이 'your ___ in' 명사 자리라 동사 involve 로 새지 않는다는 판단도 맞다. 놓친 것이 둘 있다. 첫째, usage_note 의 '말이예요' 는 '말이에요' 오타다. 둘째, meaning_ko 의 '참여' 는 confused_with 의 participation 과 그대로 겹쳐 답을 흐린다. 뜻은 위와 같이 고치고, usage_note 는 \"어떤 일에 얼마나 관여하는지를 말할 때 써요. 관심만 있는 건 interest고, 직접 나서서 하는 건 participation이에요.\" 로 고쳐라.)"

- word: "latte"
  example_ko: "라떼 한 잔 주세요."
  reason: "저장된 뜻의 '따뜻한' 은 틀려요. 아이스 라떼도 latte 예요. 해석에 '라떼' 를 그대로 남겨 coffee(그냥 커피), cappuccino 와 갈랐어요. 설명의 '우유가 없는 커피는 coffee' 도 틀린 말이라 고쳤어요."

- word: "merely"
  example_ko: "그건 제안에 불과해요."
  reason: "'그냥'으로 쓰면 just 로 새서 '~에 불과하다'로 썼다. usage_note 의 '그저와 바로를 혼동한다', 'merely 는 강조할 때 쓴다'는 둘 다 사실과 다르다(merely 는 오히려 별것 아니라고 낮추는 말)."

- word: "mother"
  example_ko: "이분이 저희 어머니예요."
  reason: "사람을 소개하는 장면이라 '이분이' 로 열었어요. father(아버지)·parent(부모) 와 갈려서 답이 하나예요."

- word: "muffin"
  example_ko: "블루베리 머핀 하나 주시겠어요?"
  reason: "저장된 뜻과 설명의 '마핀' 은 틀린 적기라 '머핀' 으로 고쳤어요. 해석에 '머핀' 을 남겨 bread, cake 와 갈랐어요."

- word: "necessary"
  example_ko: "예약이 꼭 필요한가요?"
  reason: "원래 예문은 문법은 맞지만 교과서 냄새가 심하고 해석이 번역투가 될 수밖에 없어서, 식당·숙소에서 그대로 쓰는 짧은 문장으로 바꿨어요. need 는 동사라 'Is a reservation ___?' 자리에 그대로는 못 들어오고, important(중요한) 와도 갈려요."

- word: "nugget"
  example_ko: "저는 치킨 너깃으로 할게요."
  reason: "저장된 뜻의 '윙' 은 wings 여서 틀렸어요. 해석에 '너깃' 을 남겨 chicken, wings 와 갈랐어요."

- word: "oat"
  example_ko: "귀리 우유로 만든 라떼 한 잔 주시겠어요?"
  reason: "'귀리 우유' 가 곧 oat milk 라서 빈칸 답이 정해져요. oatmeal(오트밀 죽), oats(귀리 알갱이) 는 해석에 나오지 않게 했어요."

- word: "occasion"
  example_ko: "저는 특별한 날에만 와인을 마셔요."
  reason: "'특별한 날'이 special occasion 에 바로 붙는 말이고, opportunity·chance(기회)로는 읽히지 않는다."

- word: "pace"
  example_ko: "저희는 느린 걸음으로 걸었어요."
  reason: "'걸음'을 넣어 speed(빠르기)·rate 로 새지 않게 했다. 'speed 보다 pace 가 더 자연스럽다'는 설명은 너무 넓어(차 속도는 speed) 갈리는 자리를 적어 고쳤다."

- word: "part"
  example_ko: "이건 계획의 일부예요."
  reason: "'일부' 는 part 만 받는 말이에요. piece 는 '조각', section 은 '구역', role 은 '역할' 이라 그쪽으로 새지 않아요."

- word: "participate"
  example_ko: "저는 그 회의에 참여할 거예요."
  reason: "'참여하다'는 join(합류하다)과 결이 다르고, 빈칸 뒤의 in 도 단서가 된다. 35번 engage 예문을 다른 뜻으로 바꿔 두 문제가 겹치지 않게 했다."

- word: "paste"
  example_ko: "이 찌개에는 고추장이 들어가야 해요."
  reason: "원래 예문 'Can I paste some sauce on my plate?' 는 영어로 말이 되지 않아요. paste 는 소스를 바르는 동작에 쓰지 않아요. 음식 갈래에 맞게 고추장 문장으로 바꿨고, '고추장' 이 곧 red pepper paste 라 빈칸 답이 하나예요."

- word: "pen"
  example_ko: "펜이 하나 필요해요."
  reason: "'펜'은 한국어에 그대로 있는 말이라 pencil(연필)·marker 와 헷갈릴 여지가 없다. (검증: 해석과 빈칸은 문제없다 — '펜' 이 한국어에 그대로 있어 pencil·marker 와 헷갈릴 여지가 없다. 놓친 것은 usage_note 다. 'take a pen 이예요' 는 '이에요' 오타이고 앞 띄어쓰기도 어긋나 있는데 usage_fix 를 비워 뒀다. \"펜을 빌릴 때는 borrow a pen, 가져올 때는 bring a pen, 가져갈 때는 take a pen이에요.\" 로 고쳐라.)"

- word: "pepper"
  example_ko: "국수에 후추를 뿌려 먹어요?"
  reason: "예문의 pepper 는 국수에 뿌리는 후추라서, 저장된 뜻 '고추, 고춧가루' 로는 빈칸을 못 채워요. 해석에 '후추' 를 써야 salt(소금), chili(매운 고추) 와 갈립니다."

- word: "period"
  example_ko: "저는 짧은 기간 동안 일본에 살았어요."
  reason: "원래 예문(르네상스와 위대한 예술)은 해석하면 '시대' 가 되는데 그건 era 도 똑같이 받는 말이라 답이 둘이 돼요. 게다가 왕초보 예문으로 너무 무거워서, '기간' 으로 답이 하나로 굳는 짧은 문장으로 바꿨어요."

- word: "play"
  example_ko: "우리 같이 축구해요."
  reason: "운동 이름 앞의 '하다' 가 곧 play 예요. confused_with 의 game·sport 는 명사라 이 빈칸에 못 들어와요. 원래 설명은 '놀다' 로 쓸 때 꼭 games 를 붙여야 한다고 했는데 사실이 아니라 고쳤어요. (검증: 내용은 다 맞아요 — 원래 usage_note 가 '놀다로 쓸 때 games 를 꼭 붙여야 한다' 고 한 것이 틀렸다는 지적도 옳고요(The kids are playing. 만으로 됩니다). 맞춤법만 고쳤어요: '축구하다' 가 한 낱말이라 '축구 해요' 가 아니라 '축구해요' 로 붙여 써요.)"

- word: "pump"
  example_ko: "자전거 타이어에 펌프로 바람을 넣어야 해요."
  reason: "'넣다' 만 쓰면 fill 로도 읽혀서 '펌프로' 를 함께 넣어 답을 하나로 묶었어요. push(밀다) 와도 갈립니다. 저장된 설명은 '물건을 펌프하다고 하지 않고 ~ 한다며 쓰세요' 처럼 문장이 깨져 있어 다시 썼어요."

- word: "put"
  example_ko: "그 책을 탁자 위에 놓으세요."
  reason: "'놓다' 가 put 의 기본 뜻이에요. place 는 '배치하다' 처럼 격식 있는 자리, set 은 '차리다·맞추다' 쪽이라 이 문장에는 안 붙어요."

- word: "quarter"
  example_ko: "피자의 4분의 1이 없어졌어요."
  reason: "'사분위' 는 통계에서 쓰는 다른 말이라 '4분의 1' 로 고쳤어요. 설명도 그 틀린 말 위에 얹혀 있어서 같이 다시 썼고요. fourth 도 4분의 1이지만 a ___ of the pizza 자리에는 quarter 가 굳어진 말이에요."

- word: "radish"
  example_ko: "저는 국에 무 들어간 걸 안 좋아해요."
  reason: "저장된 뜻의 '당근' 은 carrot 이라 틀렸어요. 설명의 '당근은 뿌리가 노란색' 도 틀려서 함께 고쳤어요. 해석에 '무' 를 쓰면 carrot 으로 샐 일이 없어요."

- word: "refuse"
  example_ko: "저는 그 질문에 답하기를 거절해요."
  reason: "'거절하다'를 그대로 남겼다. 빈칸 뒤가 to answer 라 reject·deny 는 문법상 들어갈 수 없어 답이 하나다. 'refuse 가 더 공손하다'는 설명은 거꾸로라서(딱 잘라 거절하는 쪽) 고쳤다."

- word: "remind"
  example_ko: "제가 잊지 않게 회의 시간 좀 알려 주시겠어요?"
  reason: "'잊지 않게'를 넣어 스스로 기억하는 remember 가 아니라 남이 상기시켜 주는 remind 로 좁혔다. 그냥 '알려 주세요'만 쓰면 tell 로 샌다."

- word: "repeat"
  example_ko: "질문을 다시 한 번 말해 주세요."
  reason: "'다시 한 번 말해 주세요'가 repeat 를 곧장 가리킨다. usage_note 의 'Please repeat this song.'은 영어로 쓰지 않는 말이라 실제로 쓰는 두 문장으로 바꿨다."

- word: "respond"
  example_ko: "그 이메일에 응답해 주세요."
  reason: "'답장해 주세요' 로 쓰면 reply 가 답이 되고 '대답' 은 answer 라서, respond 만 받는 '응답' 으로 썼어요. 원래 설명의 \"reply 가 더 구체적인 대답\" 은 갈래를 거꾸로 말한 거라 고쳤어요."

- word: "response"
  example_ko: "그 질문에 어떤 반응을 보였어요?"
  reason: "'대답' 이라고 쓰면 reply·answer 도 답이 되어 버려서, response 만 받는 '반응' 으로 썼어요."

- word: "restore"
  example_ko: "그 화가가 그림을 원래 모습대로 복원했어요."
  reason: "'복원하다'는 원래 상태로 되돌린다는 뜻이라 그냥 고치는 repair·fix 와 갈린다. 설명도 이 차이를 맞게 적고 있어 그대로 뒀다. (검증: 해석과 빈칸은 문제없다. '복원' 이 repair·fix 와 갈린다는 판단도 맞다. 그런데 '설명도 맞게 적고 있어 그대로 뒀다' 는 후하다 — 그 usage_note 는 영어 restore 를 한국어 '복구하다' 와 견주는 글이라 갈피가 잡히지 않고, 정작 confused_with 의 repair·fix 는 한 번도 다루지 않는다. 이렇게 고쳐라: \"망가진 것을 원래 모습 그대로 되돌릴 때 restore를 써요. 쓸 수 있게 고치기만 하는 건 repair나 fix예요.\")"

- word: "see"
  example_ko: "여기서 산이 보여요."
  reason: "원래 예문 'I see you at the store.' 는 영어가 깨진 문장이라(만나자는 뜻이면 See you at the store) 새로 썼어요. '보여요' 는 look·watch 로는 바꿔 놓을 수 없어서 답이 하나로 굳어요. 뜻의 '보기' 는 말이 안 돼서 고쳤고, 설명의 'I see the movie' 예시도 어색해서 갈래를 다시 썼어요."

- word: "slow"
  example_ko: "속도 좀 줄여 주세요."
  reason: "'천천히'라고 쓰면 slowly 로 샐 수 있어 '속도를 줄이다'로 썼다. 뒤에 down 이 남아 있어 답은 slow 하나로 정해진다. 저장된 뜻의 '느긋하다'는 relaxed 쪽이라 뺐고, usage_note 의 'slow + -ing' 은 없는 규칙이라 고쳤다. (검증: 해석과 usage 고침에는 동의한다. 'slow + -ing' 이 없는 규칙이라는 지적도 맞다. 다만 고쳐 쓴 뜻 '느린, 속도가 느린; 속도를 늦추다' 는 앞 두 개가 같은 말이라 '느린; 속도를 늦추다' 로 줄였다. 빈칸은 'Please ___ down.' 이라 뒤에 down 이 남아 slowly·late 가 들어갈 자리가 없고, 답은 하나로 정해진다.)"

- word: "smoke"
  example_ko: "여기서 담배 피우지 마세요."
  reason: "'담배를 피우다'는 fire(불)·burn(타다)과 겹치지 않는다. meaning_ko 의 '연기(물)가 나다'는 한국어로 말이 되지 않아 명사 '연기'로 고쳤다. (검증: 뜻을 '담배를 피우다; 연기' 로 고친 것과 해석은 맞다. 그런데 말이 되지 않는다며 뜻에서 걷어낸 바로 그 '연기(물)' 라는 표현이 usage_note 에 그대로 남아 있는데 usage_fix 를 비워 뒀다 — 같은 흠을 한쪽만 고친 셈이다. usage_note 도 이렇게 고쳐라: \"담배를 피운다고 할 때 동사로 써요. 불에서 나는 연기를 말할 때는 명사로 쓰고요. 'There is smoke from the fire.'처럼요.\")"

- word: "soda"
  example_ko: "저는 탄산음료로 할게요."
  reason: "'탄산음료' 는 단맛 나는 음료 전체를 가리켜 soda 와 딱 맞아요. 저장된 설명에 '하요' 라는 오타가 있어 다시 썼고, 탄산수와의 구별도 분명히 했어요."

- word: "sparkling"
  example_ko: "스파클링 워터 한 잔 주시겠어요?"
  reason: "카페에서 쓰는 뜻은 '번쩍이는' 이 아니라 '탄산이 든' 이라 뜻을 고쳤어요. '탄산수' 가 곧 sparkling water 여서 답이 하나예요. shiny(반짝이는) 쪽으로 새지 않습니다. (검증: 뜻을 '반짝이는' 에서 '탄산이 든' 으로 고친 판단은 맞아요. 그런데 해석을 '탄산수' 로 두면 빈칸 'Can I have a ______ water?' 의 답이 soda 도 됩니다. soda water 가 곧 탄산수이고, soda 는 바로 앞 항목이라 학습자가 그쪽을 씁니다. 카페 차림표에 그대로 쓰는 '스파클링 워터' 를 해석에 남겨 답을 하나로 묶었어요. '탄산' 은 뜻 칸에서 배우게 됩니다. 설명은 '물이나 음료 앞에 붙으면 탄산이 들었다는 뜻이에요. 탄산이 없는 그냥 물은 still water 예요.' 로 두면 맞아요.)"

- word: "speak"
  example_ko: "한국말 할 줄 아세요?"
  reason: "언어 이름 앞에는 speak 만 와요. talk 은 '이야기 나누다', say 는 '뭐라고 말하다' 라 '할 줄 아세요' 와 안 붙어요. 뜻이 괄호 안에서 같은 말을 세 번 되풀이해 읽기 힘들어서 간추렸어요."

- word: "stir"
  example_ko: "국을 살살 저어 주세요."
  reason: "저장된 뜻의 '휘저어 오다' 는 없는 말이라 '휘젓다' 로 고쳤어요. 해석에 '섞다' 를 쓰면 mix 가 답이 되므로 '젓다' 로만 썼어요. 설명에 있던 '와이프가' 는 끼어든 말이라 지웠어요. (검증: 해석은 'Stir the soup gently.' 와 정확히 맞고 '섞다' 를 피해 mix 를 막은 것도 옳아요. 다만 고쳐 쓴 뜻 '휘젓다, 저어 주다' 의 '저어 주다' 는 남에게 해 준다는 말이라 낱말 뜻 자리에 어울리지 않아 '휘젓다, 젓다' 로 다듬었어요. 설명은 '숟가락으로 빙빙 돌려 젓는 게 stir 예요. 여러 재료를 한데 합치는 건 mix 예요.' 가 맞고, 저장된 설명의 '와이프가' 를 지운 것도 옳습니다.)"

- word: "stirrer"
  example_ko: "커피 저을 막대 하나 주시겠어요?"
  reason: "저장된 뜻과 설명이 stirrer 를 '작은 스푼' 이라고 했는데 실제로는 막대예요. 해석에 '막대' 를 써야 spoon 이 답으로 읽히지 않아요. (검증: 저장된 뜻의 '혼합기' 와 '작은 스푼' 이 틀렸다는 지적은 맞아요. stirrer 는 얇은 막대입니다. 다만 앞사람이 쓴 '젓개' 는 왕초보가 읽을 일이 없는 낡은 말이라 뜻 칸에서 뺐어요. 한국 카페에서는 '커피 스틱' 이라고 부르니 그 말을 넣는 편이 낫습니다. 해석의 '저을 막대' 가 spoon 을 막아 주는 것도 맞아요.)"

- word: "strong"
  example_ko: "그 사람은 힘이 센 남자예요."
  reason: "'힘이 세다' 로 써야 hard(단단한·어려운) 쪽으로 안 새요. 원래 설명의 \"strong 이 powerful 보다 덜 강하다\" 는 세기 차이가 아니라 뜻 자체가 다른 거라 고쳤어요."

- word: "sundae"
  example_ko: "선데 하나 주세요."
  reason: "저장된 뜻의 '순대' 는 소리만 닮은 딴 말이라 고쳤어요. 설명의 '아이스크림 콘' 도 틀려요. 컵에 담아 시럽을 얹은 후식이에요. 햄버거 가게에서 파는 이름 그대로 '선데' 를 해석에 남겼어요. (검증: '순대' 가 소리만 닮은 딴 말이라는 지적은 맞아요. 그런데 해석을 '선데 아이스크림' 으로 쓰면 빈칸 'I'll have a ______, please.' 에 ice cream 이 그대로 들어맞아 답이 둘이 됩니다. 게다가 한국어에서 '선데 아이스크림' 의 머리말은 '아이스크림' 이라 학습자는 그쪽을 먼저 씁니다. '선데' 만 남겨 답을 하나로 묶었고, 무엇인지는 뜻 칸이 알려 줘요. 설명의 '아이스크림 콘' 이 틀렸다는 지적도 맞습니다.)"

- word: "throughout"
  example_ko: "축제는 일주일 내내 열려요."
  reason: "'내내' 가 throughout 을 그대로 가리켜요. during 은 '동안', through 는 '지나서' 라 갈려요. 원래 설명은 '전체에 걸쳐는 더 구체적인 상황에 쓴다' 는 뜻 모를 말이라 during 과의 차이로 바꿨어요."

- word: "touch"
  example_ko: "뜨거운 가스레인지에 손대지 마세요."
  reason: "'손대다' 로 써서 feel(느껴 보다) 과 갈리게 했어요. 뜻에 있던 '터치하다' 는 화면을 누를 때나 쓰는 말이라 빼고 '만지다, 손대다' 로 고쳤고, 설명도 한국어 낱말 이야기만 하고 있어서 영어 갈래로 다시 썼어요."

- word: "transfer"
  example_ko: "그 사람들이 제 계좌로 돈을 이체했어요."
  reason: "'보냈어요' 라고 쓰면 send 가 답이 되어 버려서, 계좌 사이에 옮길 때 쓰는 '이체하다' 로 썼어요. move(옮기다) 와도 갈려요. (검증: '보냈어요' 를 피하고 '이체했어요' 로 쓴 판단이 맞아요 — send·move 로 새지 않아요. 다만 저장된 뜻 '이동시키다, 이전하다' 는 예문의 쓰임(계좌 이체)을 가리키지 못하고 왕초보에게 딱딱하기도 해서 '옮기다, (돈을) 이체하다' 로 고쳤어요.)"

- word: "trouble"
  example_ko: "저는 영어로 말할 때 애를 먹어요."
  reason: "원래 예문은 한국인 학습자가 '한국말이 어렵다' 고 말하는 꼴이라 앱 안에서 어색해서 English 로 바꿨어요. '어려워요' 라고 쓰면 difficulty 도 답이 되니 have trouble 에 딱 붙는 '애를 먹어요' 로 썼고요. 원래 설명의 '목적어가 필요하다/아니다' 이야기는 사실이 아니라 관사 차이로 고쳤어요."

- word: "try"
  example_ko: "이따가 전화 한번 해 볼게요."
  reason: "'~해 볼게요' 가 try to 예요. attempt 는 '시도했어요' 쪽이라 겹치지 않고, test(시험해 보다) 와도 갈려요. 원래 설명의 \"'to do' 형식은 '시행하다'에 가깝다\" 는 말이 안 되는 소리라 다시 썼어요. (검증: 해석은 맞아요 — '해 볼게요' 가 try to 예요. 그런데 저장된 뜻 '시도하다, 시험하다' 를 안 고치고 지나갔어요. '시험하다' 는 confused_with 의 test 를 그대로 가리키는 말이고 예문(전화를 걸어 보다)의 쓰임과도 어긋나요. '해 보다, 시도하다' 로 고쳤어요. 고쳐 쓴 usage_note 는 맞지만 'try to = 하려고 애쓰다' 한 줄이 자기 해석('한번 해 볼게요')과 살짝 어긋나니 '하려고 하다' 쪽이 나아요.)"

- word: "twist"
  example_ko: "그분은 젖은 수건을 세게 비틀었어요."
  reason: "원래 예문 'Don't twist the bottle.' 은 병 자체를 비튼다는 말이라 어색하고, 뜻을 '망가지다' 로 적어 둔 것도 틀렸어요. 발목 삐는 문장은 turn 이나 bend 로 바꿔 쓸 수 없어서 답이 twisted 하나로 정해져요. (검증: 원 예문과 저장된 뜻('망가지다')이 틀렸다는 진단은 맞지만, 앞사람이 새로 쓴 'I twisted my ankle yesterday.' 는 빈칸 문제로 성립하지 않아요. 해석 '발목을 삐었어요' 를 읽은 왕초보가 떠올릴 낱말은 sprain 이지 twist 가 아니고, 영어에서도 turn one's ankle 이라고 씁니다. 뜻(비틀다)과 해석이 서로 닿지 않는 자리라 예문을 바꿨어요. 수건을 '비틀다' 는 turn·bend 로 못 바꿔 답이 twisted 하나로 정해집니다. 설명(usage_note)은 '손으로 돌려서 꼬거나 비트는 동작이에요. 발목을 삐었을 때도 I twisted my ankle 이라고 해요.' 로 쓰면 앞사람이 살리려던 쓰임도 남습니다.)"

- word: "undergo"
  example_ko: "저는 병원에서 검사를 받아야 했어요."
  reason: "'겪었어요' 로 쓰면 experience 나 suffer 가 답처럼 읽혀서, 검사·수술을 '받다' 라는 undergo 고유의 쓰임을 남겼어요. 저장된 뜻과 설명은 틀린 데가 없어 그대로 뒀어요."

- word: "vice"
  example_ko: "담배가 그 사람의 유일한 나쁜 버릇이에요."
  reason: "원 예문 'Smoking is a bad vice.'는 vice 에 이미 '나쁘다'가 들어 있어 겹말이 된다. 'his only vice'가 실제로 쓰는 말이다. '나쁜 버릇'이면 virtue(미덕)와 정반대라 답이 하나로 잡힌다."

- word: "want"
  example_ko: "커피 좀 마시고 싶어요."
  reason: "need 는 '필요해요', like 는 '좋아해요' 로 갈리니까 '~고 싶어요' 로 써서 want 만 답이 되게 했어요."

- word: "february"
  example_ko: "제 생일은 2월에 있어요."
  reason: "다른 달은 전부 '제 생일은' 인데 2월만 '저의' 였다."

- word: "half"
  example_ko: "이건 케이크의 반이에요."
  reason: "'~입니다' 는 이 앱의 해요체가 아니다."

- word: "hour"
  example_ko: "그 영화는 두 시간짜리예요."
  reason: "'두 시간 동안 지속됩니다' 는 번역투에 문체도 어긋난다."

- word: "week"
  example_ko: "저는 일주일에 닷새 일해요."
  reason: "'주 5일 일합니다' 는 문체가 어긋나고, 'a week' 는 '일주일에' 다."

- word: "year"
  example_ko: "저는 내년에 한국에 갈 거예요."
  reason: "예문 'How many years old are you?' 는 영어가 아니다(How old are you?). 예문을 바꾸면서 해석도 새로 썼다. 옛 해석의 '당신은' 도 번역투였다."

- word: "tonight"
  example_ko: "오늘 밤에 회의가 있어요."
  reason: "tonight 은 '오늘 밤' 인데 해석이 '오늘 저녁' 이라 evening 쪽으로 읽혔다."

- word: "would"
  example_ko: "커피 좀 마시고 싶어요."
  reason: "'커피 좀 드리고 싶어요' 였다. I would like some coffee 는 내가 마시고 싶다는 뜻이다 — 주는 쪽과 받는 쪽이 뒤바뀌어 정반대를 가르쳤다."

- word: "there"
  example_ko: "우리 집 근처에 공원이 있어요."
  reason: "'저 집 근처에' 였다. my house 는 '우리 집' 이다."

- word: "of"
  example_ko: "이건 제 가족 사진이에요."
  reason: "예문이 명사구(a photo of my family)인데 해석은 '제 가족의 사진입니다' 로 문장이었다. 예문을 문장으로 고치면서 해석도 맞춘다."

- word: "so"
  example_ko: "늦어서 집에 갔어요."
  reason: "예문을 앞 절이 있는 문장으로 고쳤다(So I went to the store → It was late, so I went home). 해석도 그에 맞춘다."

- word: "more"
  example_ko: "이 가방은 저것보다 더 비싸요."
  reason: "예문이 비문(more hot)이라 고쳤다. 해석도 새 예문에 맞춘다."

- word: "go"
  example_ko: "우리 공원에 가요."
  reason: "해석이 **비어 있었다**. 빈도 30위인데 연습장에서 단서 없이 나갔다."

- word: "a"
  example_ko: "저는 고양이를 한 마리 봤어요."
  reason: "'고양이 하나를 봤어요' 는 한국어에서 어색하다. 동물은 '한 마리' 로 센다."

- word: "for"
  example_ko: "이 선물은 당신 거예요."
  reason: "'이 선물은 당신에게요' 는 문장이 되다 만 말이다."

- word: "time"
  example_ko: "회의는 몇 시예요?"
  reason: "'미팅 시간은 언제인가요' 였다. What time 은 '몇 시' 이고, meeting 은 '회의' 로 적는다."

- word: "even"
  example_ko: "그녀가 시도까지 했다니 믿기지 않아요."
  reason: "'그녀가 시도했다고 믿을 수 없어요' 였다 — 배우는 낱말인 even 이 해석에서 사라져 빈칸의 단서가 되지 못했다."

- word: "how"
  example_ko: "잘 지내세요?"
  reason: "'잘 지내셨나요?' 는 과거를 묻는 말이라 How are you? 와 시제가 어긋난다."

- word: "then"
  example_ko: "가게에 갔다가 집으로 돌아왔어요."
  reason: "'쇼핑몰에 갔다가' 였다. the store 는 쇼핑몰이 아니라 가게다."

- word: "only"
  example_ko: "저는 채소만 먹어요."
  reason: "'오직 채식만 먹어요' 였다. vegetables 는 '채소' 이고, '채식' 은 먹는 방식을 가리키는 다른 말이다."

- word: "some"
  example_ko: "밥 좀 주세요."
  reason: "'쌀 좀 주세요' 였다. 식탁에서 rice 는 '밥' 이다 — 쌀을 달라고 하는 자리가 아니다."

- word: "well"
  example_ko: "그녀는 노래를 잘해요."
  reason: "'그녀는 잘 부릅니다' 는 무엇을 부르는지가 빠져 문장이 되다 말았다."

- word: "also"
  example_ko: "저는 오렌지도 좋아해요."
  reason: "예문을 자연스러운 말로 고쳤다(I like apples, also oranges → I also like oranges). 해석도 그에 맞춘다."

- word: "here"
  example_ko: "여기 앉으세요."
  reason: "예문을 고쳤다(Are we here yet? → Sit here, please). 영어에서는 그 자리에 there 를 쓴다."

- word: "call"
  example_ko: "나중에 전화해도 될까요?"
  reason: "'나중에 전화로 연락드릴 수 있을까요?' 는 Can I call you later? 한 마디에 견줘 지나치게 늘어졌다."

- word: "life"
  example_ko: "당신의 삶은 어떤가요?"
  reason: "'당신의 삶은 어떻게 되나요?' 는 앞으로 어찌 될지를 묻는 말로 읽힌다. What is your life like? 는 지금이 어떤지를 묻는다."

- word: "place"
  example_ko: "여기 밥 먹기 좋은 곳이에요."
  reason: "예문을 명사 place 로 바꿨다(Can I place my bag here? → This is a good place to eat). 뜻이 명사인데 예문만 동사였다."

- word: "still"
  example_ko: "저는 아직 배고파요."
  reason: "예문이 'Still hungry?' 라는 조각이라 문장으로 바꿨다(I am still hungry)."

- word: "write"
  example_ko: "여기에 이름을 써 주시겠어요?"
  reason: "'여기에 이름을 써 볼 수 있나요?' 는 부탁하는 말투가 되지 않는다."

- word: "leave"
  example_ko: "가방을 여기 두고 가지 마세요."
  reason: "'여기서 가방을 두지 마세요' 는 조사가 어긋나 뜻이 흐려졌다. leave 는 '두고 간다' 는 뜻이다."

- word: "own"
  example_ko: "이건 제 책이에요."
  reason: "'이것은 제가 직접 쓴 책이에요' 였다. my own book 은 내가 쓴 책이 아니라 내 것인 책이다."

- word: "point"
  example_ko: "지도에서 역을 가리켜 주시겠어요?"
  reason: "'가리쳐' 는 '가리켜' 의 잘못이고, 지도 위를 짚는 것이므로 '지도에' 가 아니라 '지도에서' 다."

- word: "old"
  example_ko: "이 집은 오래됐어요."
  reason: "'이 집은 오래되다 보니 좀 낡아요' 였다. 원문(This house is old)에 없는 말이 붙었다."

- word: "world"
