# ── 자동 검사가 못 잡은 충돌 셋. 사용자가 신고한 것과 그 이웃들이다 ──────
#
# postpone / reschedule 은 두 해석의 글자 겹침이 0.04 라 `gloss_collision` 에
# 안 걸린다. 학습자에게는 똑같이 '미루다' 하나로 읽히는데 기계에게는 다른
# 문장이다 — 이 부류는 사람이 읽어야 한다.

- word: postpone
  example_ko: "회의를 내일로 미뤄야 해요."
  reason: "reschedule 의 해석과 둘 다 '미루다' 여서 어느 낱말을 쓰라는 건지 알 수 없었다. 이쪽에 '미루다' 를 두고 reschedule 쪽을 '일정을 다시 잡다' 로 옮겼다. '우리는 … 미루어야' 의 번역투도 덜어 냈다."

- word: reschedule
  example_ko: "회의 일정을 내일로 다시 잡을 수 있을까요?"
  reason: "해석이 '미팅을 내일로 미룰 수 있을까요?' 여서 postpone 과 갈리지 않았다. reschedule 은 미루는 것이 아니라 **일정을 다시 잡는 것**이라 그 말을 넣었다. 사용자가 신고한 자리다."

- word: crucial
  example_ko: "이건 아주 중대한 회의예요."
  reason: "해석이 important 와 글자까지 똑같았다('이건 중요한 회의예요'). crucial 은 없으면 일이 안 되는 결정적인 쪽이라 '중대한' 으로 갈랐다."

- word: till
  example_ko: "계산원이 돈을 계산대 서랍에 넣었어요."
  reason: "예문을 계산대 서랍 뜻으로 옮겼는데 해석이 '8시까지 기다릴게요' 로 남아 있었다 — 예문과 해석이 아예 다른 문장이 될 뻔했다."


