# ── 토익 해석 보수 · 단서가 겹치던 쌍 가르기 (2026-08-27) ─────────
#
# 두 가지를 한꺼번에 고친다.
#
# 1. **해석이 아예 없던 토익 낱말 86개.** 백필이 장면 팩과 빈도 상위 일반
#    어휘만 채우고 토익 트랙을 안 채웠다. 배치를 다시 돌리니 92개가 검사에
#    걸렸는데 걸린 해석이 멀쩡했다 — `configuration` 의 해석 '서버 설정을
#    확인하세요' 가 저장된 뜻 '구성, 배열' 과 글자가 안 겹친다는 이유였다.
#    되짚기 검사는 구체 명사에서는 듣지만 추상 어휘에서는 헛짚는다. 그래서 손으로 썼다.
#
# 2. **같은 단서로 답이 둘이던 쌍.** 사용자가 신고했다 — postpone 과
#    reschedule 의 해석이 둘 다 '미루다' 여서 어느 낱말을 쓰라는 건지 알 수 없었다.
#    `confused_with` 를 잣대로 훑어 92쌍을 찾아 갈랐다. 그중 14쌍은 **한 문장에
#    둘 다 들어가서**(`The book is ___ the table.` 에는 on 도 over 도 된다)
#    해석으로는 갈 수 없어 예문을 옮겼다.

- word: about
  example_ko: "이 책은 한국 역사에 관한 내용이에요."
  reason: "'It costs ___ 10 dollars.' 에는 roughly 도 about 도 똑같이 들어간다 — 이 뜻에서 둘은 정말 바꿔 쓸 수 있어서 해석으로는 갈릴 수 없다. about 에만 있고 roughly 에는 없는 '~에 관한' 뜻으로 예문을 바꿨다. a 의 '~됩니다' 는 해요체로 고쳤다."

- word: accrue
  example_ko: "고객님 계좌에 매달 이자가 붙어요."
  reason: "'늘어나다'는 increase, '쌓이다'는 accumulate 로 읽히니 이자에만 쓰는 '붙다'로 갈랐고, 저장된 뜻 '적립되다'는 포인트 쪽 말이라 고쳤어요."

- word: activate
  example_ko: "먼저 계정을 활성화해 주세요."
  reason: "'활성화하다'는 계정을 쓸 수 있게 켜는 뜻이라 단순히 시작하는 start와 갈려요. (검증: 해석은 그대로 좋아요. 그런데 저장된 뜻 '시작시키다'가 confused_with의 start와 그대로 겹치고 우리말로도 어색한데 앞사람이 손대지 않았어요. usage_fix에서 start와 갈라 놓았으니 뜻에서도 그 말을 빼야 앞뒤가 맞아요.)"

- word: adequately
  example_ko: "그 보고서는 필요한 만큼 준비되지 않았어요."
  reason: "sufficiently 와 뜻이 가까워 '필요한 만큼'을 붙여 요구 수준을 채운다는 결을 살렸고, properly(제대로)와도 갈리게 했어요. 저장된 설명이 adequately 를 형용사라고 해서 고쳤어요. (검증: 저장된 설명이 adequately 를 형용사라 한 걸 고친 건 옳아요. 하지만 해석에 '충분히'를 남겨 두면 confused_with 의 sufficiently 가 그대로 답이 돼요 — '충분히'는 sufficiently 의 자리예요. '충분히'를 덜어 내고 '필요한 만큼'만 남겨 갈림을 살렸고, 저장된 뜻 '충분히, 충분하게'도 같은 이유로 옮겼어요.)"

- word: another
  example_ko: "질문 하나 더 있으신가요?"
  reason: "other 는 뒤에 복수(questions)가 오는 '나머지 여럿', another 는 '하나 더'다. a 는 '그 밖에'로 나머지를 가리키게 하고, b 는 '하나 더'로 수를 못박아 갈랐다. 원래 a 해석 '다른 질문 있으십니까?' 는 이 앱의 해요체가 아니라 함께 고쳤다."

- word: anybody
  example_ko: "혹시 답 아시는 분 있나요?"
  reason: "anybody 와 anyone 은 뜻이 완전히 같아서 어떤 예문을 써도 서로 들어간다 — 해석으로 갈릴 수 있는 쌍이 아니다. 다만 두 해석의 '누구나 ~ 아시나요?' 는 오역이라(anybody 는 '누구 한 사람이라도' 다) 그것만 바로잡았다. 연습장에서는 둘 중 하나를 빼야 한다."

- word: anyone
  example_ko: "혹시 길 아시는 분 있나요?"
  reason: "anybody 와 anyone 은 뜻이 완전히 같아서 어떤 예문을 써도 서로 들어간다 — 해석으로 갈릴 수 있는 쌍이 아니다. 다만 두 해석의 '누구나 ~ 아시나요?' 는 오역이라(anybody 는 '누구 한 사람이라도' 다) 그것만 바로잡았다. 연습장에서는 둘 중 하나를 빼야 한다."

- word: apart
  example_ko: "두 사람은 지금 따로 살아요."
  reason: "away 는 거리가 멀다는 쪽이고 apart 는 붙어 있지 않고 따로 있다는 쪽이에요. a 해석에 '따로'를 넣어 b 의 '멀리 떨어져'와 갈랐어요. 다만 'The hotel is apart from ~' 은 영어로 어색해요. apart from 은 보통 '~을 빼고'라는 뜻이라 예문 자체를 다시 쓰는 게 좋아요. (검증: 앞사람도 'The hotel is apart from the city center.' 가 틀린 영어라고 적어 놓고 해석만 고쳤어요. apart from 은 '~을 빼고'라서, 해석을 아무리 잘 붙여도 학습자에게 안 쓰는 표현을 외우게 해요. 예문 교체 제안: \"They live apart now.\" 위 해석은 그 새 예문 것이에요. b(away) 카드도 '멀리 떨어져'라 far 가 답으로 들어올 여지가 남아 있어요.)"

- word: appreciate
  example_ko: "도와주신 걸 정말 소중하게 생각해요."
  reason: "thank 는 사람에게 하는 인사, appreciate 는 상대가 해 준 일을 소중히 여긴다는 뜻이다. b 를 '소중하게 생각해요' 로 바꿔 인사말과 갈랐다. 앞 쌍의 grateful('고마운 마음이에요') 과도 겹치지 않는다."

- word: appropriate
  example_ko: "이 드레스는 파티에 입기 적절한 옷이에요."
  reason: "appropriate 는 자리와 예의에 맞는 쪽, suitable 은 목적과 조건에 맞는 쪽이다. 저장된 뜻에서도 '적절한' 은 appropriate 에만, '알맞은' 은 suitable 에만 있어 그 대응어로 갈랐다. 둘 다 '어울리는 옷' 이던 것을 각각의 대응어로 못박았다."

- word: approximate
  example_ko: "배송은 대략 이틀 뒤에 도착할 거예요."
  reason: "'대략'으로 어림수임을 남겼지만 about·roughly도 같은 자리에 들어가서 답이 하나로 갈리지 않으니 예문을 바꾸는 편이 좋겠고, 저장된 뜻의 '약간의'는 틀려서 고쳤어요."

- word: assess
  example_ko: "선생님이 우리 프로젝트의 수준을 가늠하셨어요."
  reason: "assess 는 수준·정도를 재서 값을 매기는 쪽, evaluate 는 좋은지 나쁜지 따져 판단하는 쪽이다. a 에 '수준을 가늠하다' 를 넣어 b 의 '평가하다' 와 갈랐다. b 의 '우리의 프로젝트' 는 번역투라 '우리 프로젝트' 로 다듬었다. (검증: assess/evaluate 쌍. '수준을 가늠하다' 와 '평가하다' 로 갈린 건 맞고 시제(과거/미래)도 예문과 맞아요. 다만 assess 의 저장된 뜻 '평가하다, 평가를 하다' 는 같은 말을 두 번 적은 것이라, 그대로 두면 해석만 갈리고 뜻은 evaluate 와 그대로 겹칩니다. 앞사람은 significant 의 같은 오류는 짚으면서 이건 놓쳤어요.)"

- word: assist
  example_ko: "이 일 좀 거들어 주시겠어요?"
  reason: "assist 는 help 의 격식형이라 어떤 예문을 써도 help 가 들어간다. 예문을 바꿔도 해결되지 않으므로 해석에서 '돕다'(help) 와 '지원하다'(assist) 로 대응어를 갈랐다. 다만 이 쌍은 한국어로 완전히는 갈리지 않는다 — 둘 중 하나를 연습장에서 빼는 편이 낫다. (검증: help/assist 쌍. '지원해 주시겠어요' 는 학습자가 support 를 먼저 떠올리는 말이고, assist me with this 는 자원을 대 주는 게 아니라 곁에서 일을 거드는 거라 뜻도 어긋나요. '거들다' 로 바꾸면 help='돕다' 와 대응어가 갈리고 번역도 정확해져요. 다만 끝내 완전히는 안 갈리니 둘 중 하나를 빼라는 결론에는 동의해요. help 쪽 '도와줄 수 있나요?' 는 그대로 두면 돼요.)"

- word: axis
  example_ko: "이 도표는 가로축과 세로축을 뚜렷하게 보여 줘요."
  reason: "'선'은 line, '막대'는 rod 가 되니 도표의 기준선을 뜻하는 '축'을 남겼고, 원문의 x 와 y 는 영어 글자라 '가로'와 '세로'로 옮겼어요."

- word: baby
  example_ko: "얘가 제 아기예요."
  reason: "baby 는 아직 걷지도 못하는 갓난쟁이고 child 는 그보다 자란 아이예요. '아기'와 '아이'가 그 차이를 담고 있어 답이 갈려요. 다만 두 해석 모두 사람을 '이건'이라고 불러 놓았는데 한국어로는 안 되는 말이라 '얘가'로 고쳤어요. (검증: 사람을 '이건'이라 부르던 걸 '얘가'로 고친 건 맞아요. 해석은 앞사람 것 그대로 두고, 겹치던 뜻만 채웠어요 — baby 의 뜻이 '아이, 신생아'로 시작해서 child 의 '아이'와 그대로 부딪혀요.)"

- word: booklet
  example_ko: "서비스 안내 소책자 하나 받을 수 있을까요?"
