  reason: "damn 은 거친 욕설성 강조라 '엄청' 쪽이고, really 는 점잖은 '정말' 이다. a 가 '정말로' 여서 really 와 그대로 겹쳤던 걸 갈랐다. 저장된 뜻 '비꼬는 말로 쓰임' 도 틀렸다 — 비꼼이 아니라 거친 강조다. 애초에 왕초보용 연습장에 넣을 낱말이 아니니 빼는 걸 권한다. (검증: damn/really 쌍. '엄청' 과 '정말' 로 갈리기는 하지만 거친 말투 자체는 해석에 남지 않아요 — 이 낱말은 해석으로 살릴 수 있는 낱말이 아니에요. 저장된 뜻이 '비꼬는 말' 이라 틀렸다고 지적만 하고 고쳐 놓지 않아서 채웠고, 왕초보 연습장에서 빼자는 데는 동의해요.)"

- word: "deductible"
