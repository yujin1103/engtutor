  pattern: "now + 문장 / 문장 + now"
  usage_note: "'지금' 이에요. 문장 앞에도 뒤에도 올 수 있어요 — Now I'm going home. / I'm going home now. right now 라고 하면 '당장' 이라는 뜻이 세져요."

- word: "then"
  reason: "'then 은 주로 문장 시작에 써요' 라고 못 박아 놓고, 같은 항목의 예문에서는 then 이 문장 중간에 있다. / '문장 앞에도 오고 쉼표 뒤에도 와요' 라 해 놓고 쉼표 쪽만, 그것도 예문을 글자 그대로 다시 적던 줄을 빼고 문장 맨 앞 자리를 실제로 보여 주는 Then we walked home. 을 넣었어요. pattern 이 '문장 맨 앞' 만 적어 예문(쉼표 뒤)과 어긋나 있어서 두 자리를 슬래시로 나눠 적었고, confused_with 의 after that·later 도 갈랐어요."
  pattern: "Then + 주어 + 동사 / 앞 문장, then + 주어 + 동사"
