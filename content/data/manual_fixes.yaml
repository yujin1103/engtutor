- word: "write"
  reason: "'한국어 작성하다보다 더 일반적으로 써요' 는 영어에 대해 아무것도 말하지 않는다. 과거형이 wrote 라는, 왕초보가 실제로 막히는 지점도 빠져 있었다."
  usage_note: "글자를 적는 것이에요 — write your name, write a letter. 손으로 쓰는 것이고 자판으로 치는 것은 type 이에요. 과거형은 wrote 로 모양이 바뀌어요."

- word: "same"
  reason: "''same' 은 명사나 형용사와 함께 쓰고, '같다' 는 동사로 쓰입니다' 는 성립하지 않는 대조이고, 붙은 예('I am the same' → '나는 변함없어')도 앞뒤가 맞지 않는다. 정작 same 앞에 the 를 반드시 붙인다는 것이 빠져 있었다. 혼동 목록의 'same as' 도 낱말이 아니라 구다."
  usage_note: "앞에 the 를 꼭 붙여요 — the same book. 'a same book' 이라고는 하지 않아요. 무엇과 같은지 말할 때는 as 를 붙여요: the same as that one."
  confused_with: ["different", "similar", "as"]

- word: "lot"
