  usage_note: "방향을 바꾼다는 뜻이에요 — Turn left. 뒤에 on/off 를 붙이면 전원을 켜고 끄는 다른 말이 돼요: turn on the light. 순서를 뜻하는 명사로도 써요: It's your turn."

- word: "few"
  reason: "''few people' 은 'not many people' 보다 훨씬 적은 수를 나타내는 경우가 많아요' 는 근거가 없다. 이 낱말의 요점은 few 와 a few 가 뜻이 뒤집힌다는 것인데 그것이 맨 끝에 곁다리로 붙어 있었다."
  usage_note: "'거의 없다' 는 뜻이에요 — There are few people here(사람이 거의 없어요). a 를 붙이면 뜻이 뒤집혀 '몇 명 있다' 가 돼요: a few people. 하나둘 세는 것에 쓰고, 물이나 시간에는 little 을 써요."
  confused_with: [little, many, several]

- word: "early"
  reason: "뜻 맨 앞의 '조기' 는 early 를 옮긴 말로 어색하고, 설명의 ''조기' 는 주로 비행기나 항공편에 쓰이고' 는 뜻을 알 수 없는 말이다. 혼동 목록의 'early bird'·'early on' 도 낱말이 아니라 구다."
  meaning_ko: "이른, 일찍"
  usage_note: "정해진 때보다 앞선다는 뜻이에요 — an early meeting, come early. 반대는 late 예요. '아침 일찍' 은 early in the morning 이라고 해요."
