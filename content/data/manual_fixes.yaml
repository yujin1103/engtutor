  example: "It was late, so I went home."
  usage_note: "앞말의 결과를 말해요. 보통 앞 문장 뒤에 쉼표와 함께 붙여요 — It was late, so I went home. 원인 쪽을 말하려면 because 로 뒤집어요: I went home because it was late."

- word: "all"
  reason: "'all 은 명사 앞에 쓰고, every 는 형용사처럼 쓰세요' 는 말이 안 된다. 실제 차이는 뒤에 오는 명사의 수다 — all + 복수/불가산, every + 단수."
  usage_note: "'모두' 예요. 뒤에 복수 명사가 와요 — all the apples, all my friends. 하나하나를 짚을 때는 every 를 쓰고, 그때는 단수 명사가 와요: every apple."

- word: "one"
  reason: "'하나의는 one 의 형용사 형태예요' 는 한국어를 영어 낱말의 형태라고 하는 말이라 성립하지 않는다. 'one book 은 하나의 책, a book 은 한 권의 책' 도 구분이 되지 않는다."
  usage_note: "숫자 하나예요. a book 은 그냥 책 한 권이고, one book 은 '두 권이 아니라 한 권' 처럼 개수를 짚어 말해요. 앞에 나온 명사를 대신하기도 해요 — Which one do you want?"

- word: "would"
  reason: "뜻이 동어반복이었다 — '했으면 좋겠다 또는 했으면 하는 것을 나타내는 표현'. 왕초보가 실제로 쓰는 would 는 거의 would like 하나인데 그게 뜻 칸에 없었다."
  meaning_ko: "~하고 싶다 (would like), ~할 텐데"
  pattern: "would + 동사원형"
  usage_note: "왕초보가 쓰는 would 는 거의 would like 예요 — I would like some coffee 는 I want some coffee 와 뜻이 같지만 훨씬 공손해요. 주문할 때 자주 써요. 줄여서 I'd like 라고 해요."

- word: "which"
  reason: "'쓰예요' 오타."
  usage_note: "여럿 중에서 고르라고 물을 때 써요 — Which color do you like? 범위가 정해지지 않았으면 what 을 써요: What is your name?"

- word: "there"
  reason: "문형이 'there + be + 목적어' 였는데 그건 주어다. 설명은 'There is 는 있습니다, There are 는 있습니다' 로 같은 말을 두 번 해서 정작 단수·복수 차이를 말하지 않았다."
  pattern: "there is/are + 주어"
  usage_note: "'~가 있어요' 라고 할 때 문장 앞에 놓는 there 예요. 뒤에 오는 것이 하나면 There is, 둘 이상이면 There are 로 바뀌어요. 장소를 가리키는 there(저기)와는 다른 쓰임이에요."

- word: "more"
  reason: "예문이 'This coffee is more hot than that one.' 이었다 — hot 은 짧은 형용사라 more 를 안 쓰고 hotter 가 맞다. **틀린 영어를 예문으로 가르치고 있었다.** 설명의 ''더' 는 형용사 뒤에 쓰는 경우도 있으니 주의하세요' 도 영어와 상관없는 말이다."
  pattern: "more + 긴 형용사/부사"
  example: "This bag is more expensive than that one."
  usage_note: "긴 형용사·부사 앞에 붙여 '더' 를 만들어요 — more expensive, more slowly. 짧은 형용사에는 more 를 안 쓰고 뒤에 -er 을 붙여요: hot → hotter, big → bigger."
  confused_with: ["most", "much", "many"]

- word: "who"
  reason: "문형이 'who + 목적어' 였는데 의문사 who 는 주어 자리라 뒤에 동사가 온다. ''who' 는 주로 'is' 와 함께 쓰인답니다' 도 근거가 없고 문체도 튄다."
  pattern: "who + 동사"
  usage_note: "사람을 물을 때 써요. 뒤에 바로 동사가 와요 — Who is that? Who made this? 물건은 what, 이유는 why 로 물어요."

- word: "like"
  reason: "''look like' 는 '보기처럼' 이라는 의미' — '보기처럼' 은 한국어가 아니다. '~처럼 보이다' 다."
  usage_note: "'좋아하다' 라는 동사예요 — I like apples. '~처럼' 이라는 뜻으로도 써요: She looks like her mother(엄마를 닮았어요), It tastes like chicken(닭고기 같은 맛이에요)."

- word: "when"
  reason: "설명 첫 문장이 동어반복이었다 — '한국어 언제는 시간을 물을 때 쓰지만, when 은 시간에 대해 물을 때 사용해요'."
  usage_note: "시간을 물을 때 써요 — When do you go to school? 몇 시인지 콕 집어 물을 때는 What time 을 써요. 물음이 아니라 '~할 때' 라는 뜻으로도 써요: When I was young."

- word: "think"
  reason: "뜻의 '생각하다고 말하다' 는 비문이다('생각한다고'). 그리고 think 의 가장 흔한 쓰임인 I think (that) ~ 이 문형에서 빠져 있었다."
  meaning_ko: "생각하다"
  pattern: "think about + 명사 / think (that) + 문장"
  usage_note: "'~라고 생각해요' 는 I think (that) ~ 처럼 뒤에 문장을 붙여요 — I think it's good. 무엇을 떠올린다고 할 때는 think about 을 써요: I think about my family."

- word: "time"
  reason: "설명이 ''What time?' 은 '언제?' 가 아니라 '언제 시간이야?' 처럼 쓰여요' 였다 — '언제 시간이야?' 는 한국어가 아니고, what time 은 '몇 시' 다. 같은 것을 what 항목에서 또 다르게 틀렸다."
  pattern: "What time ~? / at + 시각"
  usage_note: "What time is it? 은 '몇 시예요?' 예요. time 은 시각(세 시)과 걸리는 시간(두 시간)을 다 가리켜요. 횟수를 셀 때도 써요: three times(세 번)."

- word: "what"
  reason: "설명이 ''what time' 은 '언제' 가 아니라 '언제인가요?' 처럼 시간을 물을 때 써요' 였다 — 말이 되지 않고, 같은 것을 time 항목에서 또 다르게 틀렸다. what time 은 '몇 시' 다."
  pattern: "what + 동사 / what + 명사"
  usage_note: "무엇인지 물을 때 써요 — What is your name? 뒤에 명사를 붙여 what time(몇 시), what color(무슨 색)처럼도 써요. 정해진 것 중에서 고르라고 물을 때는 which 를 써요."

- word: "up"
  reason: "'up 은 방향을 나타내는 접속사예요' 가 거짓이다 — 접속사가 아니다. ''go up' 은 'go up to the store' 처럼 목적지가 필요해요' 도 거짓이다. go up 만으로 쓴다."
  meaning_ko: "위로, 위에"
  pattern: "up + 명사 / 동사 + up"
  usage_note: "위쪽을 가리켜요 — go up, look up. 뒤에 명사가 오기도 하고(up the stairs) 동사에 붙어 뜻을 바꾸기도 해요: stand up(일어서다), give up(포기하다). 반대는 down 이에요."

- word: "some"
  reason: "''any' 와는 다르게 문장 중간에 쓸 수 있어요' 는 뜻을 알 수 없는 말이고, some 과 any 의 진짜 차이(그렇다고 하는 문장 / 아니라고 하거나 묻는 문장)를 말하지 않았다."
  usage_note: "'조금·몇 개' 라는 뜻으로 명사 앞에 붙여요 — some water, some apples. 그렇다고 말하는 문장에 쓰고, 아니라고 하거나 물을 때는 any 로 바꿔요: I don't have any money. 다만 권할 때는 물음에도 some 을 써요: Would you like some coffee?"

- word: "out"
  reason: "''out' 은 방향이나 상태를 나타내는 접미사로 쓰일 수 있어요' 가 거짓이다 — 접미사가 아니다."
  usage_note: "'밖으로' 예요 — go out(나가다), take it out(꺼내다). 동사 뒤에 붙어 뜻을 바꾸기도 해요: run out of(다 떨어지다). 반대는 in 이에요."

- word: "good"
  reason: "뜻에 '잘 가는' 이 들어 있었는데 good 의 뜻이 아니다. ''good' 은 형용사로, '좋다' 는 동사예요' 도 성립하지 않는 대조다 — 한국어 '좋다' 는 형용사다. 혼동 목록의 'good at' 도 낱말이 아니라 구다."
  meaning_ko: "좋은, 잘하는"
  usage_note: "명사 앞에 붙여 '좋은' 이라는 뜻이에요 — a good book. 잘한다고 할 때는 good at 을 쓰고 뒤에 -ing 가 와요: I'm good at cooking. 동사를 꾸밀 때는 good 이 아니라 well 이에요: She sings well."
  confused_with: ["well", "better", "best"]

- word: "people"
  reason: "문형이 'a/the + people' 이었다. a people 은 '민족' 이라는 다른 뜻이라 왕초보 화면에 그대로 나가면 안 된다."
  pattern: "people + 복수 동사"
  usage_note: "'사람들' 이에요 — 이미 여럿이라 -s 를 붙이지 않아요. 한 사람은 person 이에요. 뒤에 오는 동사도 복수로 받아요: People are waiting."

- word: "take"
  reason: "문형 한 칸에 설명이 통째로 들어가 예순 자를 넘겼다. 설명의 '가져가다와 take 는 방향이 중요해요' 도 문장이 되지 않는다."
  pattern: "take + 목적어"
  usage_note: "손에 들고 가는 쪽이 take 예요. 이쪽으로 가져오는 것은 bring 이에요 — I'll take this to school(가져가다) / Bring it here(가져오다). 시간이 얼마나 걸리는지에도 써요: It takes ten minutes."

- word: "no"
  reason: "'영어에서는 문장의 맨 앞에만 쓰고, 뒤에 다른 말을 이어줘야 해요' 가 거짓이다 — No. 하나로 끝내는 말이다. 그리고 no + 명사(no money)라는 흔한 쓰임이 빠져 있었다."
  usage_note: "'아니요' 라는 대답이에요 — No, thank you. 혼자서도 쓰고, 명사 앞에 붙여 '하나도 없다' 는 뜻도 돼요: I have no money. 동사를 부정할 때는 no 가 아니라 not 을 써요."
  confused_with: ["not", "none", "yes"]

- word: "well"
  reason: "뜻에 '건강하다 (명사로 쓸 때)' 가 있었는데 그때 well 은 형용사다. 명사 well 은 '우물' 이라 아예 다른 말이다."
  meaning_ko: "잘, 건강한"
  usage_note: "동사를 꾸며 '잘' 이라는 뜻이에요 — She sings well. 명사를 꾸미는 '좋은' 은 good 이에요. 몸이 괜찮다고 할 때도 써요: I'm well, thank you."

- word: "because"
  reason: "설명이 'why 를 대답할 때는 because of + 명사가 자연스러워요' 라고 해서 because 와 because of 의 진짜 차이(뒤에 문장이 오는가 명사가 오는가)를 흐려 놓았다."
  usage_note: "이유를 말해요. 뒤에 문장이 통째로 와요 — I stayed home because it rained. 명사 하나만 올 때는 because of 로 바꿔요: because of the rain."

- word: "just"
  reason: "''I just ate' 는 '방금 먹었어요' 보다 더 강하게 '지금 먹었어요' 라는 뉘앙스' 는 근거가 없다. just 는 그냥 '방금' 이다."
  usage_note: "'방금' 이라는 뜻으로 제일 많이 써요 — I just arrived. '그냥·조금' 이라는 뜻도 있어요: Just a moment(잠깐만요), I just want water(그냥 물만 주세요)."

- word: "come"
  reason: "''come' 은 움직이는 주체가 말하는 사람일 때 쓰는 거예요' 가 거짓이고, 같은 항목의 예문이 그것을 반박한다 — When will you come to Korea? 에서 움직이는 사람은 you 다."
  usage_note: "듣는 사람이나 말하는 사람 쪽으로 오는 것이 come 이에요 — Come here! 그 자리에서 멀어지면 go 예요. 그래서 부르면 I'm coming 이라고 답해요."

- word: "could"
  reason: "'Could은' 은 조사가 틀렸고 '쓰죠' 는 다른 항목들과 말투가 어긋난다. can 의 과거라는, 왕초보가 실제로 막히는 지점도 빠져 있었다."
  usage_note: "can 의 과거예요 — When I was young, I could run fast. 부탁할 때도 써요: Could you help me? Can you 보다 부드럽고 공손해요."

- word: "than"
  reason: "설명이 '보다는 than 을 써야 해요. 보다와 혼동하지 말고' 로 동어반복이었다. 정보가 없다."
  usage_note: "둘을 견줄 때 뒤에 붙여요 — bigger than this, more expensive than that. 앞에는 -er 이 붙은 형용사나 more 가 와요. 소리가 비슷한 then(그 다음에)과 헷갈리지 마세요."

- word: "now"
  reason: "문형과 설명이 '문장 맨 앞' 으로 못 박혀 있었다. now 는 문장 끝에 더 자주 온다 — I'm going home now."
  pattern: "now + 문장 / 문장 + now"
  usage_note: "'지금' 이에요. 문장 앞에도 뒤에도 올 수 있어요 — Now I'm going home. / I'm going home now. right now 라고 하면 '당장' 이라는 뜻이 세져요."

- word: "then"
  reason: "'then 은 주로 문장 시작에 써요' 라고 못 박아 놓고, 같은 항목의 예문에서는 then 이 문장 중간에 있다."
  usage_note: "'그 다음에' 예요. 문장 앞에도 오고 쉼표 뒤에도 와요 — I went to the store, then I came home. 소리가 비슷한 than(~보다)과 헷갈리지 마세요."

- word: "also"
  reason: "예문이 'I like apples, also oranges.' 였는데 영어에서 그렇게 쓰지 않는다. also 는 보통 동사 앞에 들어간다."
  example: "I also like oranges."
  usage_note: "'~도' 예요. 보통 동사 앞에 넣어요 — I also like oranges. be 동사일 때는 뒤에 와요: She is also a student. 문장 끝에 붙일 때는 also 말고 too 를 써요."

- word: "only"
  reason: "뜻에 '다만만' 이라는 없는 말이 있었다. ''I eat only vegetables' 는 'I only eat vegetables' 보다 덜 자연스러워요' 도 근거가 없다 — only 는 꾸밀 말 바로 앞에 놓는 것이 원칙이다."
  meaning_ko: "오직, ~만"
  usage_note: "'~만' 이에요. 꾸미고 싶은 말 바로 앞에 놓는 게 원칙이에요 — I eat only vegetables(채소만 먹어요). 말할 때는 동사 앞에 놓는 일이 많아요: I only eat vegetables."

- word: "look"
  reason: "'보기만 하면 look, 실제로 사용하면 see 를 써요' 는 뜻을 알 수 없는 말이다. 둘의 차이는 일부러 보는가 저절로 보이는가다. / 문형 자리에 영어가 들어가 있었다: look + at + something"
  pattern: "look + at + 명사"
