- word: "move"
  reason: "'move 는 물건이나 사람을 움직이는 경우에 쓰고, go 는 사람이나 동물이 움직이는 경우' 는 둘을 가르지 못한다 — 사람이 양쪽에 다 들어가 있다."
  usage_note: "자리를 옮긴다는 뜻이에요 — Move your chair. 사는 곳을 옮길 때도 써요: We moved to Seoul. 어디로 '간다' 는 것은 go 예요."

- word: "money"
  reason: "'돈을 주다/받다에서 money 는 주는 쪽이 아니라 받는 쪽이에요' 는 뜻을 알 수 없는 말이다. 문형 'a/the + money' 도 틀렸다 — a money 라고 하지 않는다."
  pattern: "money (앞에 a 를 붙이지 않는다)"
  usage_note: "돈이에요. 앞에 a 를 붙이지 않고 -s 도 안 붙여요 — 'a money'·'moneys' 라고 하지 않아요. 얼마인지 물을 때는 How much 를 써요: How much money do you have?"

- word: "however"
  reason: "'but 처럼 문장 중간에 쓰면 안 돼요' 는 지나치다 — however 는 쉼표 사이에 넣어 문장 가운데에도 온다."
  usage_note: "'그렇지만' 이라는 뜻이에요. but 보다 딱딱해서 글에 더 많이 써요 — However, I can't go. 문장 가운데에 넣을 때는 쉼표로 감싸요: I, however, disagree."

- word: "area"
  reason: "설명이 '한국어 지역과 혼동할 수 있어요' 로 시작해 놓고 area 가 '더 넓은 범위를 가리킬 수 있다' 는 말만 하고 끝난다 — 무엇과 견주는지가 없다. 문형이 'area + of + 주제' 인데 예문(What area are you from?)에 of 가 없어 문형과 예문이 어긋나 있었다."
  pattern: "a/the + area"
  usage_note: "어떤 공간의 한 부분이에요 — a smoking area, this area of the city. 넓이를 뜻하기도 해요. 나라 안의 큰 구역은 region 이라고 해요."

- word: "name"
  reason: "''name' 은 명사로만 쓰이고, 동사 'to name' 과는 다릅니다' 가 자기모순이다 — 동사로도 쓴다고 말하면서 명사로만이라고 한다. 혼동 목록의 rename 도 왕초보가 볼 낱말이 아니다."
  usage_note: "이름이에요 — What is your name? 이름을 말할 때는 My name is ~ 라고 해요. 이름을 붙인다는 동사로도 써요: They named the baby Jun."
  confused_with: [call, title, sign]

- word: "friend"
  reason: "''friend' 은 불가산명사가 아니에요 (an friend X)' 는 두 가지가 틀렸다 — an friend 가 안 되는 것은 가산성이 아니라 모음 앞에서만 an 을 쓰기 때문이고, 그 문장은 앞뒤도 이어지지 않는다."
  usage_note: "친구예요 — a friend, two friends. 어디서 만난 친구인지 말할 때는 from 을 붙여요: a friend from Japan. 친하다고 말할 때는 a close friend 라고 해요."
  confused_with: [neighbor, classmate]

# ── 손으로 고쳤는데 출제 문 밖에 있던 다섯 ─────────────────────────
#
# 가산성 단정을 문에서 빼고 나니 다섯이 남았다. 이쪽은 진짜 지적이라 고친다 —
# 문형이 예문과 어긋나거나, 품사 단정이 사전보다 세거나, 한국어가 무너진 것이다.

- word: "hold"
  reason: "문형 한 칸에 세 가지를 넣어 예순 자를 넘겼고, 설명의 '기다르세요' 는 '기다리세요' 의 오타다. 그 문형 길이 하나로 빈도 221위가 연습장에 못 나가고 있었다."
  pattern: "hold + 목적어"
  usage_note: "손에 쥐고 있는 것이에요 — Please hold this. 전화나 말을 멈추라고 할 때는 Hold on(잠깐만요) 이라고 해요. 회의를 '열다' 라는 뜻으로도 써요: hold a meeting. 과거형은 held 예요."

- word: "result"
  reason: "문형이 'result + in + 결과' 인데 예문(The exam result was good)은 명사 result 라 in 이 없다 — 문형과 예문이 서로 다른 낱말을 보여준다. 설명도 '보통 result in 과 같이 쓰여요' 라고 해 놓고 바로 뒤에서 '문맥에 따라' 로 흐린다."
  pattern: "the + result"
  usage_note: "무엇을 하고 나서 나온 것이에요 — the exam result, the results of the test. 동사로 '~로 이어지다' 라는 뜻도 있는데 그때는 in 을 붙여요: The rain resulted in delays."

- word: "reason"
  reason: "''Reason' 은 명사로만 쓰이고' 가 사전보다 세다 — reason 에는 '판단하다' 라는 동사 뜻이 있다. 왕초보에게 '명사로만' 이라고 못 박으면 그대로 외운다."
  usage_note: "왜 그런지를 가리키는 말이에요 — the reason for the delay. 뒤에 for 를 붙여 무엇의 이유인지 말해요. 문장을 붙일 때는 why 를 써요: the reason why he left."

- word: "bad"
  reason: "문형이 'bad + about/with + something' 인데 예문(This food is bad)에 about 도 with 도 없다. 게다가 문형 자리에 영어 something 이 들어가 있었다. 설명도 '나쁘다는 안 좋다와 혼동할 수 있어요' 로 한국어끼리만 견준다."
  pattern: "be + bad"
  usage_note: "좋지 않다는 뜻이에요 — This food is bad. 음식에 쓰면 '상했다' 는 뜻이 돼요. 무엇을 잘 못한다고 할 때는 bad at 을 써요: I'm bad at math. 반대는 good 이에요."

- word: "process"
  reason: "설명이 무너져 있었다 — ''process' 는 명사로만 쓰고 동사로는 'process' 가 아니라 'process' 를 동사로 쓸 수 없어요' 는 같은 낱말을 세 번 말하며 아무 말도 하지 않고, 게다가 거짓이다(process 는 동사로도 쓴다)."
  usage_note: "일이 되어 가는 차례예요 — the process for getting a visa. 동사로 '처리하다' 라는 뜻도 있어요: process the order. 그때는 소리도 조금 달라져요."
