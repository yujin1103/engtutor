- word: "find"
  reason: "설명에 반말('친구를 찾아냈어')이 섞여 다른 항목들과 말투가 어긋났다. 그리고 과거형이 found 라는, 왕초보가 실제로 막히는 지점이 빠져 있었다. / 예문 'I found my keys.' 를 그대로 되풀이하던 줄과, 예문 칸이 이미 하는 일인 '과거형은 found' 를 뺐어요. 왕초보가 실제로 헷갈리는 find(찾아냄) 대 look for(찾는 중) 축을 세우고, 말로만 언급되던 meet 과 see 에 각각 영어 예를 붙였어요."
  usage_note: "무언가를 찾아낸 그 순간을 말해요. 아직 찾는 중일 때는 look for 를 써요 — I'm looking for my glasses. 사람을 만나기로 하고 보는 것은 meet 이에요 — I'll meet him at six. see 는 그냥 눈에 들어온다는 말이에요 — I see a bird."

- word: "any"
  reason: "'any 는 부정문이나 질문에서만 써요' 가 거짓이다 — Any color is fine 처럼 그렇다고 하는 문장에도 쓴다. / 설명이 예문을 그대로 옮겨 적고 있었다 — 부정문 예 'I don't have any money' 가 이미 있는데 예문 문장을 그대로 한 번 더 적어서, 의문문 예만 다른 문장으로 바꿨어요."
  usage_note: "아니라고 하거나 물어볼 때 some 대신 써요 — I don't have any money. Is there any milk? '아무거나' 라는 뜻으로 그렇다고 하는 문장에도 써요: Any color is fine."

- word: "day"
