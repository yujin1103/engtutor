  usage_note: "'많이' 라는 뜻으로 a lot of 를 통째로 외워 쓰면 돼요 — a lot of food, a lot of friends. 뒤에 무슨 명사가 와도 모양이 안 바뀌어서 many·much 보다 쉬워요. 동사 뒤에 a lot 만 붙이면 '많이' 예요: I eat a lot."

- word: "great"
  reason: "''Great' 은 명사 앞에 쓰고, '좋다' 는 동사로 쓰여요' 는 good 항목과 똑같이 성립하지 않는 대조다 — 한국어 '좋다' 는 형용사다."
  usage_note: "good 보다 센 말이에요 — a great restaurant. 맞장구칠 때도 자주 써요: That's great! 크기가 크다는 뜻으로는 요즘 잘 안 쓰고 big 을 써요."

- word: "leave"
  reason: "문형과 설명의 'leave somewhere' 는 없는 형태다 — leave 뒤에는 장소가 바로 온다(leave home). 과거형 left 도 빠져 있었다."
  pattern: "leave + 목적어 / leave + 장소"
  usage_note: "두고 가는 것이에요 — Don't leave your bag here. 그 자리를 떠난다는 뜻도 돼요: I leave home at eight. 과거형은 left 로 모양이 바뀌어요."

- word: "number"
  reason: "''number' 는 명사와 형용사 모두 쓸 수 있어요' 가 거짓이다 — number 는 명사다. 붙은 예 'a number of people (많은 사람들의)' 도 해석이 어긋난다."
  usage_note: "'번호' 예요 — a phone number, room number. 세어서 나온 '수' 라는 뜻도 있어요: the number of students(학생 수). 사람에게 물을 때는 What's your number? 라고 해요."
  confused_with: ["figure", "amount"]

- word: "both"
  reason: "''both' 는 명사 뒤에만 붙어요' 가 거짓이고, 바로 뒤에 붙은 예문(Both books are interesting)이 그것을 반박한다."
  usage_note: "둘 다라는 뜻으로 명사 앞에 놓아요 — Both books are interesting. both of them 처럼 of 를 붙이기도 해요. 셋 이상이면 all 을 써요."

- word: "own"
  reason: "설명 말투가 다른 항목들과 달리 반말이었다 — '가진다', '붙는다'."
  usage_note: "'자기 것' 이라는 뜻으로 my·your 뒤에 붙여요 — my own book(내 책), her own room. 갖고 있다는 동사로도 써요: I own a car."

- word: "point"
  reason: "'지수(point)는 수치나 의견을 말할 때 쓰는 거예요' 에서 '지수' 는 point 의 뜻이 아니다. 혼동 목록의 'point of view' 도 낱말이 아니라 구다."
  usage_note: "손가락으로 가리키는 것이에요 — point at the station. 명사로는 '점' 이나 '점수' 예요: five points. 말하려는 요지도 point 라고 해요: My point is..."
  confused_with: ["tip", "spot", "aim"]

- word: "little"
  reason: "''조금' 은 much 와 함께 쓰일 수 있지만, little 은 only 와 함께 쓰일 수 있어요' 는 문장이 되지 않는다. 정작 little 과 a little 이 뜻이 뒤집힌다는, 이 낱말에서 제일 중요한 것이 빠져 있었다."
  usage_note: "'거의 없다' 는 뜻이에요 — I have little time(시간이 거의 없어요). a 를 붙이면 뜻이 뒤집혀 '조금 있다' 가 돼요: I have a little time. 크기가 작다는 뜻으로도 써요: a little box."
  confused_with: ["few", "small", "less"]

- word: "help"
  reason: "'도와주는 사람을 나타낼 때 help 를 쓰고, 도움을 받는 사람은 help 와 함께 나타내야 해요' 는 같은 말을 두 번 하면서 아무것도 알려주지 않는다. / 문형 자리에 영어가 들어가 있었다: help + 목적어 (someone)"
  pattern: "help + 목적어 (사람)"
  usage_note: "도와준다는 뜻이에요 — Can you help me? 무엇을 도와주는지는 뒤에 동사를 붙여 말해요: help me carry this. 명사로 '도움' 도 돼요: I need help."

- word: "ask"
  reason: "문형에 영어 someone 이 한국어 자리에 들어가 있었다."
  pattern: "ask + 사람 + to + 동사원형"

- word: "something"
  reason: "'something 은 존재하는 것을, anything 은 존재하지 않는 것을 말할 때 쓰는 경우가 많아요' 가 거짓이다. 둘의 차이는 존재가 아니라 some 과 any 의 규칙과 같다."
  usage_note: "'무언가' 예요 — something to eat. 아니라고 하거나 물어볼 때는 anything 으로 바꿔요: I don't have anything. 다만 권할 때는 물음에도 something 을 써요: Would you like something to drink?"

- word: "become"
  reason: "''I became happy' 는 자연스럽지 않아요. 'I became a happy person' 처럼 명사로 표현해야 해요' 가 거짓이다 — become 뒤에는 형용사가 바로 온다(become cold, become famous). 같은 항목의 문형('become + 명사/형용사')이 그것을 반박한다."
  usage_note: "무엇이 되거나 어떤 상태로 바뀌는 것이에요 — I became a teacher. 뒤에 형용사도 바로 올 수 있어요: It became cold. 과거형은 became 이에요."

- word: "interest"
  reason: "뜻이 '관심이 되다' 였는데 한국어로 성립하지 않는 말이고, 설명도 그것을 그대로 되풀이했다. interest·interested·interesting 세 모양을 가르는 것이 이 낱말의 요점이다."
  meaning_ko: "관심, 흥미"
  pattern: "interest in + 명사"
  usage_note: "명사로 '관심' 이에요 — an interest in music. 사람이 관심 있다고 할 때는 interested 로 바꿔 써요: I'm interested in cooking. 무엇이 재미있다고 할 때는 interesting 이에요."
  confused_with: ["interested", "interesting", "hobby"]

- word: "country"
  reason: "''country' 는 'nation' 보다 더 넓은 의미로 쓰이기도 해요' 는 근거가 없다. countryside 와의 대조는 쓸모가 있어 살렸다."
  usage_note: "나라예요 — I'm from a small country. 도시 밖의 시골을 가리킬 때도 쓰는데, 그때는 the country 나 countryside 라고 해요."

- word: "old"
  reason: "뜻 칸 맨 앞에 '노래' 가 들어 있었다 — old 는 노래가 아니다. 설명도 '노래는 old 가 아니라 old song 처럼 명사와 함께 써야 해요' 라며 그 잘못 위에 다시 말을 얹었다."
  meaning_ko: "오래된, 나이 든"
  usage_note: "생긴 지 오래됐다는 뜻이에요 — an old house. 사람에게 쓰면 '나이 든' 이에요: an old man. 나이를 말할 때도 써요: I'm twenty years old. 반대는 물건이면 new, 사람이면 young 이에요."
  confused_with: ["new", "young", "ancient"]

- word: "school"
  reason: "문형이 'school +에서' 로 한글 조사가 영어 문형 자리에 들어가 있었다. 설명도 '학교에 다니는 곳은 school, 학교에 관련된 곳은 school 예요' 로 같은 말을 두 번 했다."
  pattern: "go to + school"
  usage_note: "학교예요 — I go to school every day. 건물이 아니라 '공부하러 간다' 는 뜻일 때는 the 를 붙이지 않아요: go to school. 대학은 university 나 college 라고 해요."

- word: "high"
  reason: "''high' 은' 은 조사가 틀렸다. tall 과의 차이도 더 또렷하게 적는다."
  usage_note: "위로 많이 올라간 것에 써요 — a high mountain, a high building. 사람이나 나무처럼 가늘고 긴 것에는 tall 을 써요. 수준이 높다는 뜻도 있어요: high quality."

- word: "different"
  reason: "''이건 다른 거야' 는 'This is different' 만으로 표현할 수 없어요' 가 거짓이다 — 그것만으로 완전한 문장이다."
  usage_note: "다르다는 뜻이에요 — This is different. 무엇과 다른지 말할 때는 from 을 붙여요: different from that one. 반대는 same 이고 그때는 as 를 붙여요."

- word: "off"
  reason: "'한국어 꺼다와 유사하지만' 의 '꺼다' 는 없는 말이다 — '끄다' 다."
  usage_note: "무언가에서 떨어진다는 느낌이에요 — turn off the light(끄다), take off your coat(벗다), get off the bus(내리다). 반대는 on 이에요."

- word: "next"
  reason: "설명이 '다음에 할 일은 next에요. 다음에는 next에, 다음은 next에 쓰지만' 으로 같은 말을 세 번 되풀이하다 무너졌고, 'next에요' 는 오타다."
  usage_note: "다음 차례라는 뜻이에요 — next week(다음 주), Who's next?(다음은 누구예요?) 지난 것은 last 예요. 바로 옆이라는 뜻으로는 next to 를 써요: next to the bank."

- word: "end"
  reason: "''end' 는 목적어가 사물일 때만 써요' 가 거짓이다. 같은 항목의 예문(The movie ends at 10 PM)부터 목적어가 없다."
  pattern: "end + at/in + 시간 / end up + -ing"
  usage_note: "끝난다는 뜻이에요 — The movie ends at 10. 명사로 '끝' 도 돼요: the end of the movie. 하다 보니 그렇게 됐다고 할 때는 end up 을 써요: I ended up crying."

- word: "live"
  reason: "'한국어 살다는 목적어가 필요하지만' 이 거짓이다 — 한국어 '살다' 도 목적어를 받지 않는다. 뒤에 붙은 지적(I live Seoul 은 틀렸다)은 맞아서 살렸다."
  usage_note: "어디에 산다고 할 때 in 이나 at 을 붙여요 — I live in Seoul. 'I live Seoul' 이라고는 하지 않아요. 사람이 살아 있다는 뜻으로도 써요."

- word: "why"
  reason: "문형이 'why + 목적어' 였는데 why 뒤에 오는 것은 목적어가 아니라 be 동사나 do 다."
  pattern: "why + be/do + 주어"
  usage_note: "이유를 물을 때 써요 — Why are you late? 뒤에 be 동사나 do 가 먼저 오고 그다음에 주어가 와요. 'Why you are late?' 라고 하지 않아요. 대답은 because 로 해요."

- word: "while"
  reason: "''while' 은 -ing 형식만 쓰고' 가 거짓이고, 같은 항목의 예문(I listened to music while I worked)이 그것을 반박한다."
  usage_note: "'~하는 동안' 이라는 뜻이에요. 뒤에 문장이 통째로 와요 — while I worked. -ing 를 바로 붙이기도 해요: while working. when 은 한 시점을, while 은 이어지는 동안을 가리켜요."

- word: "world"
  reason: "설명이 한국어 '세상' 과 '세계' 만 견주고 world 에 대해서는 아무것도 말하지 않았다. 예문 'What's the world like?' 도 왕초보가 쓸 말이 아니다."
  example: "I want to see the world."
  usage_note: "'세상·세계' 예요. 앞에 the 를 붙여 the world 로 써요 — the biggest city in the world. 지구라는 덩어리를 가리킬 때는 the earth 라고 해요."

- word: "might"
  reason: "설명 안에 '~게 좋을 거예요. 라는 뜻이에요' 처럼 마침표가 문장 가운데 끼어 문장이 끊겼다."
  usage_note: "아마 그럴 수도 있다는 뜻이에요 — I might come tomorrow. may 와 뜻이 거의 같은데 might 가 조금 더 자신 없는 느낌이에요. 뒤에는 동사원형이 와요."

- word: "must"
  reason: "'You must wear a helmet' 을 '보호대를 꼭 써야 해요' 라고 옮겼다. helmet 은 헬멧이지 보호대가 아니다."
  usage_note: "꼭 그래야 한다는 뜻이에요 — I must go now. should 보다 세고 규칙이나 명령에 가까워요: You must wear a helmet(헬멧을 꼭 써야 해요). 일상에서는 have to 를 더 많이 써요."

- word: "include"
  reason: "'한국어 포함하다와 비슷하지만, 영어에서는 include 가 더 자주 쓰여요' 는 무엇보다 더 자주 쓰인다는 것인지 알 수 없다."
  usage_note: "안에 들어 있다는 뜻이에요 — The price includes breakfast(가격에 아침이 들어 있어요). 상자나 그릇에 물건이 들어 있을 때는 contain 을 써요."

- word: "course"
  reason: "''course' 는 'meal' 과는 다르게 식사와는 관련이 없어요' 가 거짓이다 — 코스 요리의 그 코스가 course 다(the main course)."
  meaning_ko: "강좌, 과정"
  pattern: "a course in + 과목"
  usage_note: "배우는 강좌예요 — a course in English. 식사의 '코스' 도 course 라고 해요: the main course. of course 는 '물론이죠' 라는 다른 말이에요."
  confused_with: ["class", "subject", "lesson"]

- word: "house"
  reason: "'한국어 집은 복수형이 없지만' 은 영어를 배우는 데 쓸모가 없다. house 와 home 의 차이는 살렸다."
  usage_note: "사람이 사는 건물이에요 — This is my house. 건물 자체를 가리키고, '우리 집' 이라는 따뜻한 느낌은 home 이에요. 여럿이면 houses 예요."

- word: "group"
  reason: "'한국어 그룹은 ... 집단보다 더 구체적인 의미예요' 는 한국어 낱말끼리만 견주고 영어에 대해서는 말하지 않는다. 예문 'We are divided into groups.' 도 수동태라 왕초보가 읽을 문장이 아니다."
  pattern: "a group of + 명사"
  example: "A group of students is waiting."
  usage_note: "사람이나 물건이 모인 한 무리예요 — a group of students. 앞에 a, 뒤에 of 를 붙이는 꼴로 많이 써요. 함께 일하거나 겨루는 무리는 team 이라고 해요."

- word: "woman"
  reason: "예문이 'This is my mother, a woman.' 이었다 — 영어에서 사람을 소개하며 '여성입니다' 를 덧붙이지 않는다. 혼동 목록에 girl 하나뿐이라 man 과의 짝도 보이지 않았다."
  example: "That woman is my teacher."
  usage_note: "어른 여자예요 — That woman is my teacher. 어른 남자는 man 이에요. 여럿이면 women 으로 모양이 바뀌고 소리도 달라져요. 어린 여자아이는 girl 이에요."
  confused_with: ["man", "girl", "lady"]

- word: "around"
  reason: "''near' 보다 더 멀리 있지만, 'far away' 보다는 가까워요' 는 근거가 없다. 정작 around 가 '둘레를 돌아' 라는 뜻이라는 것과 '대략' 이라는 흔한 쓰임이 빠져 있었다."
  usage_note: "둘레나 근처를 가리켜요 — around the corner(모퉁이를 돌면), walk around the park(공원을 한 바퀴 돌다). 숫자 앞에 붙이면 '대략' 이라는 뜻이에요: around ten o'clock."

- word: "family"
  reason: "설명이 한국어 '가족' 의 범위만 말하고 family 를 쓰는 법에 대해서는 아무것도 말하지 않았다."
  usage_note: "가족이에요 — This is my family. 한 덩어리로 볼 때는 단수로 받아요. 친척까지 말하려면 relatives 라고 해요."

- word: "let"
  reason: "뜻에 '잠시 빌려주다' 가 있었는데 그건 lend 다. 혼동 목록의 let's 도 헷갈리는 다른 낱말이 아니라 let us 의 준말이다."
  meaning_ko: "~하게 해 주다, 허락하다"
  usage_note: "누가 무엇을 하게 해 준다는 뜻이에요 — Let me help you(제가 도울게요). 뒤에 사람과 동사원형이 차례로 와요: let him go. Let's 는 '~하자' 라는 다른 말이에요."
  confused_with: ["allow", "make", "permit"]

- word: "again"
  reason: "문형 'again + 문장 (문장 맨 앞 or 뒤)' 에 영어 or 가 한국어 자리에 들어가 있었고, again 은 보통 문장 끝에 온다. 설명도 ''다시' 는 주로 문장 중간에 쓰입니다' 로 한국어만 말했다."
  pattern: "문장 + again"
  usage_note: "한 번 더라는 뜻이에요. 보통 문장 끝에 붙여요 — Can we try again? Say it again, please. 두 번이라고 딱 짚어 말할 때는 twice 를 써요."

- word: "kind"
  reason: "설명이 'kind of' 를 '어느 정도' 라고 옮겼는데 한국어로 어색하다 — '좀·약간' 이다. 그리고 문형이 'kind + of + 명사' 뿐이라 예문(a kind person)이 문형을 보여주지 못했다."
  pattern: "kind + 명사 / kind of + 명사"
  usage_note: "마음이 따뜻하다는 뜻이에요 — She is a kind person. kind of 는 아주 다른 말이라 '좀·약간' 이라는 뜻이에요: This is kind of expensive(이거 좀 비싸요). '종류' 라는 뜻도 있어요: What kind of coffee?"

- word: "keep"
  reason: "문형 한 칸에 세 가지를 넣어 예순 자를 넘겼고, 그 안에 영어 someone 이 한국어 자리에 들어가 있었다."
  pattern: "keep + 목적어 / keep + -ing"
  usage_note: "그대로 두거나 계속한다는 뜻이에요 — Please keep the book on the table. 뒤에 -ing 를 붙이면 '계속 ~하다' 예요: keep going. 손에 쥐고 있는 것은 hold 예요."

- word: "hear"
  reason: "''I hear you' 는 '나는 당신의 말을 들었어' 가 아니라 '나는 당신이 말하고 있어' 라는 의미가 있어요' 는 문장이 되지 않는다. I hear you 는 '무슨 말인지 알겠다' 는 뜻이다."
  usage_note: "소리가 저절로 귀에 들어오는 것이에요 — I hear a dog barking. 일부러 귀 기울여 듣는 것은 listen 이에요: listen to music. I hear you 는 '무슨 말인지 알겠어요' 라는 뜻으로도 써요."

- word: "system"
