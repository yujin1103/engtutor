# 사람이 확인해 손으로 고친 항목. 배치 재생성이 덮어쓰면 안 되는 교정이다.
#
# 왜 손으로 고치는가
# ------------------
# 프롬프트를 고쳐도 환각은 확률적으로 다시 나온다. 이미 생성된 유한한 집합에서
# **확인된 거짓**을 지우는 일은 재생성(확률적)이 아니라 교정(결정적)으로 해야 한다.
#
# 선정 기준: WordNet 에 없고 사람이 확인한 결과 실재하지 않는 영어 단어를 언급한 항목.
# 판정 근거는 docs/hallucinations.md 에 있다.
#
# 적용:  docker compose exec api python content/apply_fixes.py
# 확인만: docker compose exec api python content/apply_fixes.py --dry-run

- word: "fact"
  reason: "'factful' 은 존재하지 않는다. 'fact 는 명사라서 동사로는 factful 처럼 쓰지 않는다'는 설명 자체가 성립하지 않는다."
  removed: ["factful"]
  meaning_ko: "사실 (실제로 있었던 일)"
  pattern: "a/the + fact"
  usage_note: "fact 는 명사예요. 'a fact', 'the facts' 처럼 셀 수 있어요. 말하다가 '사실은' 하고 덧붙일 때는 'in fact' 를 자주 써요."
  confused_with: ["truth", "reality"]

- word: "analysis"
  reason: "'analysist' 는 존재하지 않는다(분석하는 사람은 analyst). 또한 문형이 '불가산명사 (an analysis X)' 였는데 analysis 는 가산명사이고, 같은 항목의 예문이 'an analysis' 를 쓰고 있어 자기모순이었다."
  removed: ["analysist"]
  meaning_ko: "분석, 해석"
  pattern: "an/the + analysis"
  usage_note: "analysis 는 셀 수 있어요. 'an analysis' 가 맞고, 두 개 이상은 'analyses' 로 바뀌어요. 분석하는 사람은 'analyst' 예요."
  confused_with: ["analyst"]

- word: "restaurant"
  reason: "'restaurate' 는 존재하지 않는다. restaurant 의 동사형이라는 설명은 통째로 지어낸 것이다."
  removed: ["restaurate"]
  meaning_ko: "음식점"
  pattern: "a/the + restaurant"
  usage_note: "restaurant 은 명사예요. 식당에서 밥을 먹는다고 할 때는 'eat at a restaurant' 처럼 at 을 써요."
  confused_with: ["cafe", "bar"]

- word: "kitchen"
  reason: "'kitcheny' 는 존재하지 않는다. kitchen 의 형용사형이라는 설명은 지어낸 것이다."
  removed: ["kitcheny"]
  meaning_ko: "주방"
  pattern: "a/the + kitchen"
  usage_note: "kitchen 은 명사예요. 다른 명사 앞에 붙여서 'kitchen table'(부엌 식탁), 'kitchen knife'(부엌칼) 처럼 쓸 수 있어요."
  confused_with: []

- word: "orange"
  reason: "'oranje' 는 네덜란드어 철자다. '오렌지색은 oranje 라고 발음해요' 는 영어 설명으로 거짓이다."
  removed: ["oranje"]
  meaning_ko: "오렌지(과일), 주황색"
  pattern: "orange + 명사"
  usage_note: "과일 하나를 말할 때는 셀 수 있어요 — 'an orange', 'two oranges'. 색이나 맛을 말할 때는 뒤에 명사를 붙여 'orange juice' 처럼 써요."
  confused_with: ["lemon"]

- word: "harbor"
  reason: "'habor' 는 존재하지 않는다. 게다가 그것이 '구두'를 뜻한다는 설명까지 붙어 있었다. confused_with 에도 같은 단어가 들어가 있었다."
  removed: ["habor"]
  meaning_ko: "항구"
  pattern: "a/the + harbor"
  usage_note: "harbor 는 배가 머무는 항구예요. 영국식 철자는 'harbour' 예요. 도착했다고 말할 때는 'arrive at the harbor' 처럼 at 을 써요."
  confused_with: ["port"]

- word: "breathe"
  reason: "'respirate' 는 표준 영어가 아니다(표준형은 respire, 그나마 의학 문맥). 왕초보에게 비교 대상으로 제시할 단어가 아니다. 대신 실제로 헷갈리는 breath 를 넣는다."
  removed: ["respirate"]
  meaning_ko: "숨 쉬다"
  pattern: "breathe + in/out"
  usage_note: "breathe 는 '숨 쉬다' 라는 동사예요. 'breathe in' 은 들이마시고, 'breathe out' 은 내쉬는 거예요. 명사 '숨' 은 'breath' 라서 철자가 달라요."
  confused_with: ["breath"]

- word: "air"
  reason: "'ayer' 는 스페인어로 '어제' 다. 영어 단어가 아니다. 같은 칸의 heir 는 실제 동음이의 혼동이라 남긴다. 문형의 'air + 목적어' 도 air 를 타동사로 만드는 표기라 고친다."
  removed: ["ayer"]
  meaning_ko: "공기"
  pattern: "air + 명사"
  usage_note: "air 는 셀 수 없어요. 'an air' 라고 하지 않고 'fresh air', 'some air' 처럼 써요. 공기 관련 물건은 'air conditioner' 처럼 air 를 명사 앞에 붙여 만들어요."
  confused_with: ["heir"]

- word: "cultural"
  reason: "'culturalist' 는 표준 영어가 아니다. 문형 'adjective: -한' 은 영어가 하나도 없는 품사 라벨이라 문형 칸의 용도에 맞지 않는다."
  removed: ["culturalist"]
  meaning_ko: "문화적인"
  pattern: "cultural + 명사"
  usage_note: "cultural 은 형용사라서 명사 앞에 써요 — 'cultural festival', 'cultural difference'. 명사 '문화' 는 'culture' 예요."
  confused_with: ["culture"]

- word: "increasingly"
  reason: "'growingly' 는 표준 영어가 아니다."
  removed: ["growingly"]
  meaning_ko: "점점 더"
  pattern: "increasingly + 형용사"
  usage_note: "increasingly 는 '점점 더' 라는 뜻의 부사예요. 'increasingly popular' 처럼 형용사 앞에 자주 붙어요. 일상 대화에서는 'more and more' 가 더 편해요."
  confused_with: ["more and more"]

- word: "root"
  reason: "'luft' 는 독일어로 '공기' 다. root 와 아무 관계가 없다. 문형 'root + 의 (소유격)' 은 한국어 조사를 문형으로 적은 것이다."
  removed: ["luft"]
  meaning_ko: "뿌리"
  pattern: "a/the + root"
  usage_note: "root 는 식물의 뿌리예요. 보통 여러 개라서 'roots' 처럼 복수로 자주 써요. 길을 뜻하는 'route' 와 발음이 비슷하니 헷갈리지 마세요."
  confused_with: ["route"]

- word: "salt"
  reason: "'sault', 'solt' 둘 다 영어 단어가 아니다. 그리고 설명은 '소금은 불가산명사라 a salt 는 틀리다' 로 맞는 말을 하는데 문형은 'a/the + salt' 여서 자기모순이었다."
  removed: ["sault", "solt"]
  meaning_ko: "소금"
  pattern: "some/any + salt"
  usage_note: "salt 는 셀 수 없어요. 'a salt' 는 안 되고 'some salt', 'any salt' 처럼 써요."
  confused_with: ["sugar"]

- word: "coleslaw"
  reason: "뜻이 'coleslaw (샐러드 종류)' — 한국어로 옮기지 않고 영어를 그대로 뒀다. 게다가 불가산인데 문형이 'a/the + coleslaw' 였고 예문도 'a coleslaw' 를 쓰고 있었다."
  meaning_ko: "코울슬로 (양배추 샐러드)"
  pattern: "some/the + coleslaw (불가산명사)"
  example: "I'll have coleslaw with my burger."
  usage_note: "코울슬로는 양배추를 잘게 썰어 마요네즈에 무친 샐러드예요. 셀 수 없어서 'a coleslaw' 대신 그냥 'coleslaw' 나 'some coleslaw' 라고 해요. 줄여서 'slaw' 라고도 해요."
  confused_with: ["slaw"]

- word: "outlet"
  reason: "뜻이 '전원 공급 장치, 플러그' 였다. 플러그는 꽂는 쪽이고 outlet 은 벽에 있는 구멍이라 정반대다. 해석도 '전원 어댑터' 로 따라가 있었다."
  meaning_ko: "콘센트 (벽에 있는 전기 구멍)"
  pattern: "an/the + outlet"
  usage_note: "벽에 붙어서 전기를 주는 구멍이 outlet 이에요. 우리가 '콘센트' 라고 부르지만 영어에 concent 라는 말은 없어요. 거기 꽂는 쪽은 plug 고, 영국에서는 outlet 을 socket 이라고 해요."
  confused_with: ["plug", "socket"]

- word: "sushi"
  reason: "뜻이 '회' 였다. 회는 sashimi 다. 문형도 불가산인데 'a/the + sushi' 였다."
  meaning_ko: "초밥"
  pattern: "some/the + sushi (불가산명사)"
  usage_note: "sushi 는 식초로 간한 밥 위에 생선을 얹은 초밥이에요. 밥 없이 생선만 썬 회는 sashimi 라고 해요. 셀 수 없어서 'a sushi' 대신 'some sushi' 라고 해요."
  confused_with: ["sashimi"]

- word: "squid"
  reason: "뜻이 '감자전(물고기 종류)' 이었고 설명은 '감자전은 squid 고 감자는 potato 예요' 로 그 거짓을 두 번 말했다. confused_with 에도 potato 가 들어가 있었다."
  meaning_ko: "오징어"
  pattern: "some/the + squid (불가산명사)"
  usage_note: "squid 는 오징어예요. 음식으로 말할 때는 셀 수 없어서 'I don't like squid.' 처럼 그냥 써요. 튀긴 오징어는 메뉴에 calamari 라고 적혀 있을 때가 많아요."
  confused_with: ["octopus", "calamari"]

- word: "chewy"
  reason: "뜻이 '물이 잘 안 빠지는' 이었다 — chewy 와 아무 상관이 없다. 설명에는 일본어 '嚼りごこちが良い' 가 섞여 있어 왕초보가 읽을 수 없었다."
  meaning_ko: "쫄깃한, 질긴"
  pattern: "be동사 + chewy / chewy + 명사"
  usage_note: "chewy 는 오래 씹게 되는 식감이에요. 떡이나 젤리처럼 쫄깃할 때도 쓰고, 고기가 질길 때도 써요. 반대로 바삭한 것은 crispy 예요."
  confused_with: ["crispy", "tough"]

- word: "straw"
  reason: "'styro' 는 영어 단어가 아니다(포장재는 styrofoam). 뜻도 '스티로 소프트한 줄기 (종이로 만든 줄기)' 로 말이 되지 않았다."
  removed: ["styro"]
  meaning_ko: "빨대"
  pattern: "a/the + straw"
  usage_note: "음료를 마실 때 쓰는 빨대예요. 'Can I get a straw?' 처럼 셀 수 있어요. 포장재로 쓰는 스티로폼은 styrofoam 이라서 straw 와 관계없어요. straw 에는 '짚' 이라는 뜻도 있어서 straw hat 은 밀짚모자예요."
  confused_with: []

- word: "tuna"
  reason: "뜻이 '타우나, 생선 종류' 였다. '타우나' 는 한국어에 없는 말이라 뜻 자리에 아무것도 없는 것과 같았고, 해석에도 그대로 옮겨져 있었다."
  meaning_ko: "참치"
  pattern: "some/the + tuna (불가산명사)"
  usage_note: "tuna 는 참치예요. 셀 수 없게 써서 'some tuna', 'tuna sandwich' 처럼 말해요. 연어는 salmon 이에요."
  confused_with: ["salmon"]

- word: "need"
  reason: "설명에 'to 인фин잇브' — infinitive 를 키릴 문자로 반쯤 옮기다 만 말이다."
  pattern: "need + 목적어 / need to + 동사원형"
  usage_note: "'I need to go.' 처럼 뒤에 'to + 동사원형' 이 오는 경우가 많아요. 'I need you.' 처럼 사람을 목적어로 써도 자연스러워요."

- word: "eligible"
  reason: "설명의 'have资格' 는 영어도 한국어도 아니다. / 문형 자리에 영어가 들어가 있었다: be eligible + for + something"
  pattern: "be eligible + for + 명사"
  usage_note: "자격이 되는지 물을 때 써요. 사람 뒤에 바로 붙이지 않고 for 를 넣어요 — 'Are you eligible for the scholarship?' 는 '이 장학금에 지원할 수 있나요?' 예요."

- word: "briefcase"
  reason: "뜻이 '공文가방' 이었다."
  meaning_ko: "서류가방"
  usage_note: "서류를 넣고 다니는 납작한 가방이에요. 손가방은 handbag, 배낭은 backpack 이에요. 격식 있는 자리에서 자주 들어요."

- word: "innovative"
  reason: "설명의 '신颖한' 은 중국어 新颖(참신한)이다."
  usage_note: "새롭고 기발한 것에 써요. 기술이나 아이디어에 특히 자주 붙어요. 그냥 '새로운' 은 new 예요."

- word: "cartridge"
  reason: "뜻이 '匣子, 총알 탄창' 이었는데 예문은 프린터 카트리지다. 문형도 명사인데 목적어를 받는다고 적혀 있었다."
  meaning_ko: "카트리지 (프린터 잉크통처럼 갈아 끼우는 통)"
  pattern: "a/the + cartridge"
  usage_note: "프린터에 끼우는 잉크통을 말할 때 가장 많이 써요. 총알을 재는 탄창도 cartridge 라고 해요."

- word: "remember"
  reason: "설명에 'ключи'(러시아어 '열쇠')가 들어 있었다."
  usage_note: "기억할 일은 'remember to + 동사' 로 써요. 'Remember your keys.' 는 '열쇠 챙겨' 라는 뜻이에요."

- word: "opportunity"
  reason: "설명의 '抓住機會' 는 중국어이고, '동사로는 抓住처럼 쓰여요' 는 말이 되지 않는다."
  usage_note: "'기회를 잡다' 는 seize an opportunity 나 take an opportunity 라고 해요. opportunity 는 명사라서 동사로는 쓰지 않아요."

- word: "steadily"
  reason: "설명의 '慢慢地' 는 중국어 '천천히' 다."
  usage_note: "일정한 속도로 계속 이어질 때 써요. 느리다는 뜻은 아니에요 — 느린 것은 slowly 예요."

- word: "recently"
  reason: "문형이 'recently + 동사过去形' 이었다. 화면에 그대로 나가는 칸이다."
  pattern: "recently + 동사 (현재완료·과거형)"

- word: "character"
  reason: "설명이 '인물(人物)은' 으로 한자를 달고 있었다."
  usage_note: "'인물' 은 사람을 가리키고 '성격' 은 그 사람의 특성을 말해요. character 는 둘 다 뜻해서 영화나 소설의 등장인물에도 써요."

- word: "parcel"
  reason: "뜻이 '包裹, 택배' 였다."
  meaning_ko: "소포 (포장해서 부치는 물건)"

- word: "pull"
  reason: "설명이 '拽 the door 는 문을 끌어당기다' 라며 중국어와 영어를 섞어 없는 문장을 만들었다."
  usage_note: "'Pull the door.' 는 문을 몸쪽으로 당기는 거예요. 바닥에 끌고 가는 것은 drag 라서 달라요. 반대는 push 예요."

- word: "sticker"
  reason: "뜻과 문형에 '贴'(붙이다)이 남아 있었다. sticker 는 명사인데 문형이 목적어를 받는다고 적혀 있었다."
  meaning_ko: "스티커 (붙이는 작은 종이)"
  pattern: "a/the + sticker"

- word: "obviously"
  reason: "설명의 '顯然' 은 중국어다."
  usage_note: "누가 봐도 분명할 때 써요. 상대에게 '그것도 모르냐' 처럼 들릴 수 있어서, 부드럽게 말하려면 Clearly 가 나아요."

- word: "earn"
  reason: "설명에 'работать'(러시아어 '일하다')가 두 번 들어 있었다."
  usage_note: "일해서 돈을 버는 것이 earn 이에요. 그냥 받는 것은 get 이고, 월급을 받는다고 할 때도 earn 을 써요."

- word: "ward"
  reason: "설명이 '病房과 혼동하지 마세요' 였다 — 病房이 곧 병실이라 구별할 말이 되지 않는다."
  usage_note: "병원 안에서 환자들이 함께 머무는 구역이에요. 방 하나를 가리킬 때는 room 을 써요."

- word: "desperate"
  reason: "뜻이 '절망적인,办理할 수 없는' 이었다. 办理는 중국어 '처리하다' 다. / 문형 자리에 영어가 들어가 있었다: desperate + about/for + something"
  meaning_ko: "절박한, 어떻게든 해야 하는"
  pattern: "desperate + about/for + 명사"
  usage_note: "정말 급하고 절박할 때만 써요. 그냥 걱정되는 정도면 worried 나 concerned 를 써요."

- word: "surround"
  reason: "뜻이 '둘러싸다, 둘러抱住하다' 였다. 抱住는 중국어 '끌어안다' 다."
  meaning_ko: "둘러싸다"

- word: "strength"
  reason: "설명이 '내 힘은很强해요' 였고, 'My strength is very good.' 이라는 어색한 영어를 예로 들고 있었다."
  meaning_ko: "힘; 강점 (잘하는 점)"
  usage_note: "몸의 힘도 되고 잘하는 점도 돼요. 'My strength is running.' 은 '제 강점은 달리기예요' 라는 뜻이에요. 형용사는 strong 이에요."

- word: "label"
