  pattern: "what + 동사 / what + 명사"
  usage_note: "무엇인지 물을 때 써요 — What is your name? 뒤에 명사를 붙여 what time(몇 시), what color(무슨 색)처럼도 써요. 정해진 것 중에서 고르라고 물을 때는 which 를 써요."

- word: "up"
  reason: "'up 은 방향을 나타내는 접속사예요' 가 거짓이다 — 접속사가 아니다. ''go up' 은 'go up to the store' 처럼 목적지가 필요해요' 도 거짓이다. go up 만으로 쓴다."
