  meaning_ko: "~하는 게 좋다, ~해야 한다"
  usage_note: "그러는 게 좋겠다고 말할 때 써요 — You should see a doctor. must 나 have to 보다 부드러워요. 하지 말라고 할 때는 shouldn't 예요."

- word: "right"
  reason: "문형이 'right + 형용사' 였는데 right 는 형용사라 뒤에 명사가 온다. 혼동 목록의 'right side' 도 낱말이 아니라 구이고, '오른쪽' 의 짝인 left 가 빠져 있었다."
  pattern: "the right + 명사"
