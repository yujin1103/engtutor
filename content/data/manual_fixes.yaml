  usage_note: "아래쪽으로 움직이는 것이에요 — go down, sit down, put it down. 반대는 up 이에요. 아래에 있는 상태를 말할 때는 under 를 써요: under the table."

- word: "man"
  reason: "''man' 은 'woman' 과 달리 성별이 불분명한 경우에도 쓸 수 있어요' 는 요즘 영어에서 권하지 않는 쓰임이라 왕초보에게 가르칠 것이 아니다. 성별을 가리지 않는 '사람' 은 person 이다. 혼동 목록의 men 도 헷갈리는 낱말이 아니라 같은 낱말의 복수형이다. / 설명이 예문을 그대로 옮겨 적고 있었다 — 'a man in the park' 는 '어른 남자' 라는 설명에 아무것도 더하지 않는 되풀이라, 다른 짝으로 바꿨어요."
  meaning_ko: "남자"
  usage_note: "어른 남자예요 — a tall man. 어른 여자는 woman 이에요. 여럿이면 men 으로 모양이 바뀌어요. 성별을 가리지 않고 '사람' 을 말할 때는 person 이나 people 을 써요."
  confused_with: ["woman", "person", "boy"]

- word: "change"
  reason: "뜻에 '달리다' 가 있었다 — change 는 뛰는 것이 아니다('달라지다' 를 잘못 쓴 것으로 보인다). 설명도 ''달리다' 는 상태 변화를 말하지만' 이라며 그 잘못을 그대로 되풀이했다."
  meaning_ko: "바꾸다, 달라지다"
  usage_note: "물건을 바꾸는 데도 쓰고(change the channel) 마음이나 상태가 달라지는 데도 써요(I changed my mind). 가게에서 받는 '거스름돈' 도 change 예요."

- word: "place"
  reason: "뜻은 명사('장소, 위치')인데 예문은 동사였다 — Can I place my bag here? 배우는 뜻과 예문이 서로 다른 낱말을 보여주고 있었다. ''Where is the place?' 는 '어디에요?'' 도 영어에서 그렇게 말하지 않는다."
