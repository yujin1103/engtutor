- word: "even"
  reason: "뜻의 '오히려' 는 even 의 뜻이 아니다. 그리고 예문 해석에서 even 이 통째로 사라져 있었다."
  meaning_ko: "심지어, ~까지도"
  usage_note: "뜻밖이라는 느낌을 얹어요 — She even tried(시도까지 했다). 꾸미고 싶은 말 바로 앞에 놓아요. even though 는 '~인데도' 라는 다른 뜻이에요."

