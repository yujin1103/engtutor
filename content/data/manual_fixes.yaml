  usage_note: "어디서 왔는지, 어디서 시작하는지를 말해요. 짝이 되는 말은 to 예요 — from Seoul to Busan(서울에서 부산까지). 누구에게 받았는지에도 써요: a letter from my friend."

- word: "by"
  reason: "설명이 'by 는 장소나 시간을 말할 때도 쓰입니다' 라고 해 놓고 예시로 행위자 문장(painted by my brother)을 들었다 — 예시가 설명을 반박한다."
  usage_note: "'~ 옆에' 라는 뜻이 있어요 — sit by the window. 누가 했는지 말할 때도 써요: The picture was painted by my brother. 교통수단에도 붙여요: by bus, by subway."

- word: "will"
  reason: "'want 은 원기를 표현할 때 쓰예요' — '원기' 는 뜻을 알 수 없는 말이고 '쓰예요' 는 오타다."
  usage_note: "앞으로 할 일을 말해요. 뒤에는 늘 동사원형이 와요 — I will go. 말하는 자리에서 막 정한 일에 자주 써요. 줄여서 I'll go 라고 해요."

- word: "or"
  reason: "예시 '와이프 혹은 남편' 이 부자연스럽고 외래어가 섞였다. 뜻 칸의 '... 혹은 ...' 은 뜻이 아니다."
  meaning_ko: "또는, 아니면"
  usage_note: "둘 중 하나를 고르게 할 때 써요 — Coffee or tea? 아니라고 말할 때는 and 자리에 or 를 써요: I don't like coffee or tea."

- word: "go"
  reason: "문형과 예문 해석이 **비어 있었다** — 빈도 30위의 기본 동사인데 연습장에 단서 없이 나갔다. 혼동 목록에도 낱말이 아니라 구(go to, go on)가 들어 있었다."
  pattern: "go to + 장소"
  usage_note: "말하는 자리에서 멀어지는 쪽이 go 예요. 상대가 있는 쪽으로 갈 때는 come 을 써요 — 부르면 I'm coming 이라고 답해요(I'm going 이 아니에요)."
  confused_with: ["come", "walk", "leave"]

- word: "so"
  reason: "문형이 '문장 맨 앞' 으로만 못 박혀 있었다. so 는 보통 앞 절 뒤에 온다 — It was late, so I went home. 예문도 앞 절 없이 So 로 시작해 결과만 남아 있었다."
