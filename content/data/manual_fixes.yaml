- word: "also"
  reason: "예문이 'I like apples, also oranges.' 였는데 영어에서 그렇게 쓰지 않는다. also 는 보통 동사 앞에 들어간다."
  example: "I also like oranges."
  usage_note: "'~도' 예요. 보통 동사 앞에 넣어요 — I also like oranges. be 동사일 때는 뒤에 와요: She is also a student. 문장 끝에 붙일 때는 also 말고 too 를 써요."

- word: "only"
