  example: "This is a good place to eat."
  usage_note: "'곳·장소' 라는 뜻의 명사예요 — a good place to eat. 물건을 놓는다는 동사로도 쓰지만 그 자리에는 put 이 더 흔해요: Put your bag here."
  confused_with: ["put", "spot", "area"]

- word: "long"
  reason: "'시간에 대해 쓸 때는 long 이 아니라 long time 을 써요' 가 거짓이다 — How long does it take? 처럼 그대로 쓴다. 혼동 목록의 'long time' 도 낱말이 아니라 구다."
  meaning_ko: "긴, 오래"
  pattern: "long + 명사 / be + long"
  usage_note: "길이가 길다는 뜻이에요 — a long pencil. 시간이 길 때도 그대로 써요: How long does it take?(얼마나 걸려요?) 키가 크다고 할 때는 long 이 아니라 tall 이에요."
  confused_with: ["tall", "short", "high"]

- word: "between"
  reason: "뜻이 '두 개 이상의 것들 사이에' 였는데 between 은 둘 사이다. 셋 이상 가운데라면 among 이다."
  meaning_ko: "(둘) 사이에"
  usage_note: "둘 사이를 가리켜요 — between the school and the library. 사이에 놓인 둘은 and 로 이어요. 셋 이상 가운데라면 among 을 써요."

- word: "too"
  reason: "''too much' 는 '너무 많다' 고 하되, 'much' 가 명사 뒤에 오는 경우에만 써요' 는 문장이 되지 않고, ''too many' 는 가산명사 뒤에 써요' 는 거짓이다 — 앞에 온다. 게다가 그 문장 때문에 가산성 단정 검사에 걸려 빈도 117위가 연습장에 나가지 못하고 있었다."
  meaning_ko: "너무; ~도"
  usage_note: "'너무' 라는 뜻이에요 — The coffee is too hot. 지나치다는 느낌이라 반가운 말에는 잘 안 붙어요(그냥 정도가 세다는 뜻은 very 예요). 문장 끝에 붙이면 '~도' 라는 다른 뜻이에요: Me too."
  confused_with: ["very", "also", "so"]

- word: "still"
  reason: "예문이 'Still hungry?' 라는 조각이었다 — 빈칸 문제로 내면 문장이 되지 않는다. ''already' 는 상태가 변했을 때 쓰는 거예요' 도 뜻을 알기 어렵다."
  example: "I am still hungry."
