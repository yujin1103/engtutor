# ── 장면 팩 299개를 읽고 고친 뜻·문형·설명 (2026-08-27) ────────────
#
# 해석을 읽다 보면 같은 항목의 뜻이 같이 드러난다. `bruise` 의 뜻은 '이끼'
# (moss)였고 `seventeen` 은 '일곱 번째 열', `zipper` 는 '자물쇠' 였다.

- word: aisle
  reason: "번호를 붙이면 'the'를 쓰지 않는데(예문도 'in aisle 3') pattern 이 'the + aisle + number'라 예문과 어긋나요. usage_note 의 \"'row'와 혼동하지만\"도 문장이 끊겨 뜻이 통하지 않아요. (검증: pattern·usage_note 교정은 맞지만 해석의 '3번 코너'는 학습자를 corner 라는 콩글리시로 이끄니 aisle 의 뜻인 '3번 통로'로 함께 고쳐야 해요.)"
  pattern: "in aisle + 숫자 (관사 없이)"
  usage_note: "물건이 놓인 진열대 사이의 통로예요. 극장이나 버스 좌석 줄은 row 라고 해요."

- word: ambulance
  reason: "pattern 칸이 'ambulance: 명사 (구급차)'라고 뜻풀이를 되풀이할 뿐 문장에서의 형태를 하나도 알려 주지 못해요. 예문이 'I called an ambulance.'니 'call + an ambulance'가 그 자리에 들어갈 말이에요."
  pattern: "call/need + an ambulance"

- word: ankle
  reason: "meaning_ko가 '종아리'로 틀렸고 usage_note가 그 거짓을 두 번 반복해요. 해석의 '내'도 문체에 어긋나요."
  meaning_ko: "발목"
  usage_note: "ankle은 발목이에요. 종아리는 calf, 다리 전체는 leg, 발은 foot이니 구분해서 말해요."

- word: app
  reason: "usage_note 가 '쓰입니다'로 끝나 이 앱의 해요체를 벗어나요. \"앱은 프로그램을 뜻하지만 앱은 전용 단어\"라는 설명도 뜻이 잡히지 않아요."
  usage_note: "app 은 application 의 줄임말이에요. 한국어 '어플'은 영어로 app 이라고 해야 통해요."

- word: apple
  reason: "usage_note 가 영어 낱말 이야기는 하나도 없이 한국어 '사과(과일)'와 '사과하다(잘못을 빌다)'의 동음이의어만 설명해요. 앞사람이 pear 의 '배는 사람 이름도 있어요'를 같은 이유로 고쳤으니 여기도 같은 자리예요."
  usage_note: "사과 하나는 'an apple'이에요. 모음 소리로 시작해서 'a apple'이 아니라 'an'을 써요."

- word: april
  reason: "usage_note에 \"'April 5th'는 4월 5일을 말하나요?\"라는 깨진 물음이 섞여 있어요. pattern의 'April + 일 (일, 월, 년)'도 무슨 형태를 말하는지 알 수 없어요."
  meaning_ko: "4월 (한 해의 넷째 달)"
  pattern: "in + April"
