  meaning_ko: "어떻게"
  usage_note: "방법을 물을 때 써요 — How do you go to school? 형용사 앞에 붙여 정도를 묻기도 해요: How old are you?(몇 살이에요?), How much is it?(얼마예요?)"

- word: "back"
