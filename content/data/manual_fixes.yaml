  meaning_ko: "바꾸다, 달라지다"
  usage_note: "물건을 바꾸는 데도 쓰고(change the channel) 마음이나 상태가 달라지는 데도 써요(I changed my mind). 가게에서 받는 '거스름돈' 도 change 예요."

- word: "place"
