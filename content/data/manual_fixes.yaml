- word: "before"
  reason: "'한국어 이전에보다 더 구체적인 시간이나 사건을 언급할 때 써요' 는 뜻을 알 수 없는 말이다."
  usage_note: "어떤 일보다 먼저라는 뜻이에요 — before dinner(저녁 먹기 전에). 반대는 after 예요. 뒤에 문장이 통째로 올 수도 있어요: before you go."

- word: "through"
  reason: "한국어 문장 사이에 영어 낱말 whereas 가 끼어 있었다 — 'through 는 공간을 지나는 것, whereas across 는 반대편으로 가는 걸 의미해요'."
  usage_note: "안을 지나 반대편으로 나오는 것이에요 — go through the door, walk through the park. 위로 건너가는 것은 over, 가로질러 건너는 것은 across 예요."

- word: "down"
  reason: "문형 'go down + 방향' 은 down 이 방향인데 뒤에 또 방향을 받는 것처럼 읽힌다. up 항목과 짝을 맞춘다."
