  usage_note: "둘을 견줄 때 뒤에 붙여요 — bigger than this, more expensive than that. 앞에는 -er 이 붙은 형용사나 more 가 와요. 소리가 비슷한 then(그 다음에)과 헷갈리지 마세요."

- word: "now"
