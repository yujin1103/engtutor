  usage_note: "앞으로 할 일을 말해요. 뒤에는 늘 동사원형이 와요 — I will go. 말하는 자리에서 막 정한 일에 자주 써요. 줄여서 I'll go 라고 해요."

- word: "or"
  reason: "예시 '와이프 혹은 남편' 이 부자연스럽고 외래어가 섞였다. 뜻 칸의 '... 혹은 ...' 은 뜻이 아니다."
  meaning_ko: "또는, 아니면"
  usage_note: "둘 중 하나를 고르게 할 때 써요 — Coffee or tea? 아니라고 말할 때는 and 자리에 or 를 써요: I don't like coffee or tea."

- word: "go"
  reason: "문형과 예문 해석이 **비어 있었다** — 빈도 30위의 기본 동사인데 연습장에 단서 없이 나갔다. 혼동 목록에도 낱말이 아니라 구(go to, go on)가 들어 있었다."
  pattern: "go to + 장소"
  usage_note: "말하는 자리에서 멀어지는 쪽이 go 예요. 상대가 있는 쪽으로 갈 때는 come 을 써요 — 부르면 I'm coming 이라고 답해요(I'm going 이 아니에요)."
  confused_with: [come, walk, leave]

- word: "so"
  reason: "문형이 '문장 맨 앞' 으로만 못 박혀 있었다. so 는 보통 앞 절 뒤에 온다 — It was late, so I went home. 예문도 앞 절 없이 So 로 시작해 결과만 남아 있었다."
  pattern: "..., so + 문장"
  example: "It was late, so I went home."
  usage_note: "앞말의 결과를 말해요. 보통 앞 문장 뒤에 쉼표와 함께 붙여요 — It was late, so I went home. 원인 쪽을 말하려면 because 로 뒤집어요: I went home because it was late."

- word: "all"
  reason: "'all 은 명사 앞에 쓰고, every 는 형용사처럼 쓰세요' 는 말이 안 된다. 실제 차이는 뒤에 오는 명사의 수다 — all + 복수/불가산, every + 단수."
  usage_note: "'모두' 예요. 뒤에 복수 명사가 와요 — all the apples, all my friends. 하나하나를 짚을 때는 every 를 쓰고, 그때는 단수 명사가 와요: every apple."

- word: "one"
  reason: "'하나의는 one 의 형용사 형태예요' 는 한국어를 영어 낱말의 형태라고 하는 말이라 성립하지 않는다. 'one book 은 하나의 책, a book 은 한 권의 책' 도 구분이 되지 않는다."
  usage_note: "숫자 하나예요. a book 은 그냥 책 한 권이고, one book 은 '두 권이 아니라 한 권' 처럼 개수를 짚어 말해요. 앞에 나온 명사를 대신하기도 해요 — Which one do you want?"

- word: "would"
  reason: "뜻이 동어반복이었다 — '했으면 좋겠다 또는 했으면 하는 것을 나타내는 표현'. 왕초보가 실제로 쓰는 would 는 거의 would like 하나인데 그게 뜻 칸에 없었다."
  meaning_ko: "~하고 싶다 (would like), ~할 텐데"
  pattern: "would + 동사원형"
  usage_note: "왕초보가 쓰는 would 는 거의 would like 예요 — I would like some coffee 는 I want some coffee 와 뜻이 같지만 훨씬 공손해요. 주문할 때 자주 써요. 줄여서 I'd like 라고 해요."

- word: "which"
  reason: "'쓰예요' 오타."
  usage_note: "여럿 중에서 고르라고 물을 때 써요 — Which color do you like? 범위가 정해지지 않았으면 what 을 써요: What is your name?"

- word: "there"
  reason: "문형이 'there + be + 목적어' 였는데 그건 주어다. 설명은 'There is 는 있습니다, There are 는 있습니다' 로 같은 말을 두 번 해서 정작 단수·복수 차이를 말하지 않았다."
  pattern: "there is/are + 주어"
  usage_note: "'~가 있어요' 라고 할 때 문장 앞에 놓는 there 예요. 뒤에 오는 것이 하나면 There is, 둘 이상이면 There are 로 바뀌어요. 장소를 가리키는 there(저기)와는 다른 쓰임이에요."

- word: "more"
  reason: "예문이 'This coffee is more hot than that one.' 이었다 — hot 은 짧은 형용사라 more 를 안 쓰고 hotter 가 맞다. **틀린 영어를 예문으로 가르치고 있었다.** 설명의 ''더' 는 형용사 뒤에 쓰는 경우도 있으니 주의하세요' 도 영어와 상관없는 말이다."
  pattern: "more + 긴 형용사/부사"
  example: "This bag is more expensive than that one."
  usage_note: "긴 형용사·부사 앞에 붙여 '더' 를 만들어요 — more expensive, more slowly. 짧은 형용사에는 more 를 안 쓰고 뒤에 -er 을 붙여요: hot → hotter, big → bigger."
  confused_with: [most, much, many]

- word: "who"
  reason: "문형이 'who + 목적어' 였는데 의문사 who 는 주어 자리라 뒤에 동사가 온다. ''who' 는 주로 'is' 와 함께 쓰인답니다' 도 근거가 없고 문체도 튄다."
  pattern: "who + 동사"
  usage_note: "사람을 물을 때 써요. 뒤에 바로 동사가 와요 — Who is that? Who made this? 물건은 what, 이유는 why 로 물어요."

- word: "like"
  reason: "''look like' 는 '보기처럼' 이라는 의미' — '보기처럼' 은 한국어가 아니다. '~처럼 보이다' 다."
  usage_note: "'좋아하다' 라는 동사예요 — I like apples. '~처럼' 이라는 뜻으로도 써요: She looks like her mother(엄마를 닮았어요), It tastes like chicken(닭고기 같은 맛이에요)."

- word: "when"
  reason: "설명 첫 문장이 동어반복이었다 — '한국어 언제는 시간을 물을 때 쓰지만, when 은 시간에 대해 물을 때 사용해요'."
  usage_note: "시간을 물을 때 써요 — When do you go to school? 몇 시인지 콕 집어 물을 때는 What time 을 써요. 물음이 아니라 '~할 때' 라는 뜻으로도 써요: When I was young."

- word: "think"
  reason: "뜻의 '생각하다고 말하다' 는 비문이다('생각한다고'). 그리고 think 의 가장 흔한 쓰임인 I think (that) ~ 이 문형에서 빠져 있었다."
  meaning_ko: "생각하다"
  pattern: "think about + 명사 / think (that) + 문장"
  usage_note: "'~라고 생각해요' 는 I think (that) ~ 처럼 뒤에 문장을 붙여요 — I think it's good. 무엇을 떠올린다고 할 때는 think about 을 써요: I think about my family."

- word: "time"
  pattern: "What time ~? / at + 시각"
  reason: "설명이 ''What time?' 은 '언제?' 가 아니라 '언제 시간이야?' 처럼 쓰여요' 였다 — '언제 시간이야?' 는 한국어가 아니고, what time 은 '몇 시' 다. 같은 것을 what 항목에서 또 다르게 틀렸다."
  usage_note: "What time is it? 은 '몇 시예요?' 예요. time 은 시각(세 시)과 걸리는 시간(두 시간)을 다 가리켜요. 횟수를 셀 때도 써요: three times(세 번)."

- word: "what"
  reason: "설명이 ''what time' 은 '언제' 가 아니라 '언제인가요?' 처럼 시간을 물을 때 써요' 였다 — 말이 되지 않고, 같은 것을 time 항목에서 또 다르게 틀렸다. what time 은 '몇 시' 다."
  pattern: "what + 동사 / what + 명사"
  usage_note: "무엇인지 물을 때 써요 — What is your name? 뒤에 명사를 붙여 what time(몇 시), what color(무슨 색)처럼도 써요. 정해진 것 중에서 고르라고 물을 때는 which 를 써요."

# ── 기능어 구간 이어서(빈도 51~99위) — 40개 중 34개 ──────────────────────
#
# 앞 40개가 65% 였는데 이 40개는 85% 다. 같은 자리에서 같은 방식으로 틀린다 —
# 품사를 잘못 부르고(up 은 '접속사', out 은 '접미사'), 한국어와 없는 대조를 만들고
# ('한국어 하루는 시간을 의미하지만, 날은 날짜를 의미해요'), 예문이 설명을 반박한다
# (come 은 '말하는 사람이 움직일 때' 라면서 예문이 When will you come to Korea?).

- word: "up"
  reason: "'up 은 방향을 나타내는 접속사예요' 가 거짓이다 — 접속사가 아니다. ''go up' 은 'go up to the store' 처럼 목적지가 필요해요' 도 거짓이다. go up 만으로 쓴다."
  meaning_ko: "위로, 위에"
  pattern: "up + 명사 / 동사 + up"
  usage_note: "위쪽을 가리켜요 — go up, look up. 뒤에 명사가 오기도 하고(up the stairs) 동사에 붙어 뜻을 바꾸기도 해요: stand up(일어서다), give up(포기하다). 반대는 down 이에요."

- word: "some"
  reason: "''any' 와는 다르게 문장 중간에 쓸 수 있어요' 는 뜻을 알 수 없는 말이고, some 과 any 의 진짜 차이(그렇다고 하는 문장 / 아니라고 하거나 묻는 문장)를 말하지 않았다."
  usage_note: "'조금·몇 개' 라는 뜻으로 명사 앞에 붙여요 — some water, some apples. 그렇다고 말하는 문장에 쓰고, 아니라고 하거나 물을 때는 any 로 바꿔요: I don't have any money. 다만 권할 때는 물음에도 some 을 써요: Would you like some coffee?"

- word: "out"
  reason: "''out' 은 방향이나 상태를 나타내는 접미사로 쓰일 수 있어요' 가 거짓이다 — 접미사가 아니다."
  usage_note: "'밖으로' 예요 — go out(나가다), take it out(꺼내다). 동사 뒤에 붙어 뜻을 바꾸기도 해요: run out of(다 떨어지다). 반대는 in 이에요."

- word: "good"
  reason: "뜻에 '잘 가는' 이 들어 있었는데 good 의 뜻이 아니다. ''good' 은 형용사로, '좋다' 는 동사예요' 도 성립하지 않는 대조다 — 한국어 '좋다' 는 형용사다. 혼동 목록의 'good at' 도 낱말이 아니라 구다."
  meaning_ko: "좋은, 잘하는"
  usage_note: "명사 앞에 붙여 '좋은' 이라는 뜻이에요 — a good book. 잘한다고 할 때는 good at 을 쓰고 뒤에 -ing 가 와요: I'm good at cooking. 동사를 꾸밀 때는 good 이 아니라 well 이에요: She sings well."
  confused_with: [well, better, best]

- word: "people"
  reason: "문형이 'a/the + people' 이었다. a people 은 '민족' 이라는 다른 뜻이라 왕초보 화면에 그대로 나가면 안 된다."
  pattern: "people + 복수 동사"
  usage_note: "'사람들' 이에요 — 이미 여럿이라 -s 를 붙이지 않아요. 한 사람은 person 이에요. 뒤에 오는 동사도 복수로 받아요: People are waiting."

- word: "take"
  reason: "문형 한 칸에 설명이 통째로 들어가 예순 자를 넘겼다. 설명의 '가져가다와 take 는 방향이 중요해요' 도 문장이 되지 않는다."
  pattern: "take + 목적어"
  usage_note: "손에 들고 가는 쪽이 take 예요. 이쪽으로 가져오는 것은 bring 이에요 — I'll take this to school(가져가다) / Bring it here(가져오다). 시간이 얼마나 걸리는지에도 써요: It takes ten minutes."

- word: "no"
  reason: "'영어에서는 문장의 맨 앞에만 쓰고, 뒤에 다른 말을 이어줘야 해요' 가 거짓이다 — No. 하나로 끝내는 말이다. 그리고 no + 명사(no money)라는 흔한 쓰임이 빠져 있었다."
  usage_note: "'아니요' 라는 대답이에요 — No, thank you. 혼자서도 쓰고, 명사 앞에 붙여 '하나도 없다' 는 뜻도 돼요: I have no money. 동사를 부정할 때는 no 가 아니라 not 을 써요."
  confused_with: [not, none, "yes"]

- word: "well"
  reason: "뜻에 '건강하다 (명사로 쓸 때)' 가 있었는데 그때 well 은 형용사다. 명사 well 은 '우물' 이라 아예 다른 말이다."
  meaning_ko: "잘, 건강한"
  usage_note: "동사를 꾸며 '잘' 이라는 뜻이에요 — She sings well. 명사를 꾸미는 '좋은' 은 good 이에요. 몸이 괜찮다고 할 때도 써요: I'm well, thank you."

- word: "because"
  reason: "설명이 'why 를 대답할 때는 because of + 명사가 자연스러워요' 라고 해서 because 와 because of 의 진짜 차이(뒤에 문장이 오는가 명사가 오는가)를 흐려 놓았다."
  usage_note: "이유를 말해요. 뒤에 문장이 통째로 와요 — I stayed home because it rained. 명사 하나만 올 때는 because of 로 바꿔요: because of the rain."

- word: "just"
  reason: "''I just ate' 는 '방금 먹었어요' 보다 더 강하게 '지금 먹었어요' 라는 뉘앙스' 는 근거가 없다. just 는 그냥 '방금' 이다."
  usage_note: "'방금' 이라는 뜻으로 제일 많이 써요 — I just arrived. '그냥·조금' 이라는 뜻도 있어요: Just a moment(잠깐만요), I just want water(그냥 물만 주세요)."

- word: "come"
  reason: "''come' 은 움직이는 주체가 말하는 사람일 때 쓰는 거예요' 가 거짓이고, 같은 항목의 예문이 그것을 반박한다 — When will you come to Korea? 에서 움직이는 사람은 you 다."
  usage_note: "듣는 사람이나 말하는 사람 쪽으로 오는 것이 come 이에요 — Come here! 그 자리에서 멀어지면 go 예요. 그래서 부르면 I'm coming 이라고 답해요."

- word: "could"
  reason: "'Could은' 은 조사가 틀렸고 '쓰죠' 는 다른 항목들과 말투가 어긋난다. can 의 과거라는, 왕초보가 실제로 막히는 지점도 빠져 있었다."
  usage_note: "can 의 과거예요 — When I was young, I could run fast. 부탁할 때도 써요: Could you help me? Can you 보다 부드럽고 공손해요."

- word: "than"
  reason: "설명이 '보다는 than 을 써야 해요. 보다와 혼동하지 말고' 로 동어반복이었다. 정보가 없다."
  usage_note: "둘을 견줄 때 뒤에 붙여요 — bigger than this, more expensive than that. 앞에는 -er 이 붙은 형용사나 more 가 와요. 소리가 비슷한 then(그 다음에)과 헷갈리지 마세요."

- word: "now"
  reason: "문형과 설명이 '문장 맨 앞' 으로 못 박혀 있었다. now 는 문장 끝에 더 자주 온다 — I'm going home now."
  pattern: "now + 문장 / 문장 + now"
  usage_note: "'지금' 이에요. 문장 앞에도 뒤에도 올 수 있어요 — Now I'm going home. / I'm going home now. right now 라고 하면 '당장' 이라는 뜻이 세져요."

- word: "then"
  reason: "'then 은 주로 문장 시작에 써요' 라고 못 박아 놓고, 같은 항목의 예문에서는 then 이 문장 중간에 있다."
  usage_note: "'그 다음에' 예요. 문장 앞에도 오고 쉼표 뒤에도 와요 — I went to the store, then I came home. 소리가 비슷한 than(~보다)과 헷갈리지 마세요."

- word: "also"
  reason: "예문이 'I like apples, also oranges.' 였는데 영어에서 그렇게 쓰지 않는다. also 는 보통 동사 앞에 들어간다."
  example: "I also like oranges."
  usage_note: "'~도' 예요. 보통 동사 앞에 넣어요 — I also like oranges. be 동사일 때는 뒤에 와요: She is also a student. 문장 끝에 붙일 때는 also 말고 too 를 써요."

- word: "only"
  reason: "뜻에 '다만만' 이라는 없는 말이 있었다. ''I eat only vegetables' 는 'I only eat vegetables' 보다 덜 자연스러워요' 도 근거가 없다 — only 는 꾸밀 말 바로 앞에 놓는 것이 원칙이다."
  meaning_ko: "오직, ~만"
  usage_note: "'~만' 이에요. 꾸미고 싶은 말 바로 앞에 놓는 게 원칙이에요 — I eat only vegetables(채소만 먹어요). 말할 때는 동사 앞에 놓는 일이 많아요: I only eat vegetables."

- word: "look"
  reason: "'보기만 하면 look, 실제로 사용하면 see 를 써요' 는 뜻을 알 수 없는 말이다. 둘의 차이는 일부러 보는가 저절로 보이는가다."
  usage_note: "일부러 눈을 돌려 보는 것이 look 이에요 — Look at that dog! 눈에 저절로 들어오는 것은 see, 한동안 지켜보는 것은 watch 예요: I see a dog / I watch TV."

- word: "give"
  reason: "''give' 는 주는 사람, 'borrow' 는 빌리는 사람이예요' 는 문장이 성립하지 않고 '이예요' 오타까지 있다. give 의 짝은 borrow 가 아니라 get 이다."
  usage_note: "누구에게 무엇을 주는 것이에요. 사람과 물건을 나란히 놓거나(give me some water) to 를 붙여요(give it to me). 반대로 받는 것은 get 이에요."
  confused_with: [get, lend, take]

- word: "new"
  reason: "''new bread' 는 '새로 구운 빵' 이지, '신선한 빵' 은 아니에요' 는 영어에서 잘 쓰지 않는 말을 예로 든 것이다. 갓 구운 빵은 fresh bread 라고 한다."
  usage_note: "처음 나온 것, 산 지 얼마 안 된 것에 써요 — a new phone. 반대는 old 예요. 음식이 상하지 않았다고 할 때는 new 가 아니라 fresh 를 써요: fresh bread."

- word: "way"
  reason: "설명이 '길을 가리킬 때는 the way to + 장소, 방법을 말할 때는 the way to + 목적' 이라 둘을 구분하지 못했다 — 형태가 같으니 예로 갈라 보여야 한다."
  usage_note: "'길' 이면서 '방법' 이에요 — the way to the station(역 가는 길), a good way to learn(배우는 좋은 방법). 길을 물을 때는 How do I get to ~? 도 많이 써요."

- word: "find"
  reason: "설명에 반말('친구를 찾아냈어')이 섞여 다른 항목들과 말투가 어긋났다. 그리고 과거형이 found 라는, 왕초보가 실제로 막히는 지점이 빠져 있었다."
  usage_note: "찾던 것을 찾아냈을 때 써요 — I found my keys. 사람을 만나는 것은 meet 이에요. 과거형은 found 로 모양이 바뀌어요."

- word: "any"
  reason: "'any 는 부정문이나 질문에서만 써요' 가 거짓이다 — Any color is fine 처럼 그렇다고 하는 문장에도 쓴다."
  usage_note: "아니라고 하거나 물어볼 때 some 대신 써요 — I don't have any money. Do you have any questions? '아무거나' 라는 뜻으로 그렇다고 하는 문장에도 써요: Any color is fine."

- word: "day"
  reason: "'한국어 하루는 시간을 의미하지만, 날은 날짜를 의미해요. 오늘 날은 오늘과 같아요' 는 뜻을 알 수 없는 말이다. 게다가 'What day is it?' 을 '오늘 몇일이에요?' 라고 옮겼는데 그건 요일을 묻는 말이고, '몇일' 은 '며칠' 의 잘못이다."
  usage_note: "'하루' 이면서 '날' 이에요 — a day off(쉬는 날), three days(사흘). What day is it? 은 무슨 요일인지 묻는 말이에요. 날짜를 물을 때는 What's the date? 예요."

- word: "where"
  reason: "문형이 'where + be + 목적어' 였는데 그건 주어다. ''where do you live?' 처럼 문장에서 목적어가 필요해요' 도 문장이 되지 않는다."
  pattern: "where + be + 주어"
  usage_note: "장소를 물을 때 써요 — Where is the bathroom? 뒤에 문장을 붙일 때는 do 를 빌려 와요: Where do you live?"

- word: "should"
  reason: "뜻이 '해야 할 것, 하지 말아야 할 것' 이었다 — '하지 말아야 할 것' 은 should 가 아니라 shouldn't 다."
  meaning_ko: "~하는 게 좋다, ~해야 한다"
  usage_note: "그러는 게 좋겠다고 말할 때 써요 — You should eat more vegetables. must 나 have to 보다 부드러워요. 하지 말라고 할 때는 shouldn't 예요."

- word: "right"
  reason: "문형이 'right + 형용사' 였는데 right 는 형용사라 뒤에 명사가 온다. 혼동 목록의 'right side' 도 낱말이 아니라 구이고, '오른쪽' 의 짝인 left 가 빠져 있었다."
  pattern: "the right + 명사"
  usage_note: "'맞는' 이라는 뜻이에요 — the right way, You're right. '오른쪽' 이라는 뜻도 있어요: Turn right. 어느 쪽 뜻인지는 문장이 정해 줘요."
  confused_with: [correct, left, wrong]

- word: "how"
  reason: "뜻의 '어떻게 되다' 는 how 의 뜻이 아니다. 설명도 '한국어 어떻게는 문장에서 위치가 자유로워요' 라고 한국어만 말하고 how 에 대해서는 말하지 않았다."
  meaning_ko: "어떻게"
  usage_note: "방법을 물을 때 써요 — How do you go to school? 형용사 앞에 붙여 정도를 묻기도 해요: How old are you?(몇 살이에요?), How much is it?(얼마예요?)"

- word: "back"
  reason: "''back' 은 시간이나 순서를 나타낼 때 더 자주 쓰여요' 는 근거가 없다. back 의 중심 뜻은 '되돌아' 이고 같은 항목의 예문(I'll be back)도 그 뜻이다."
  meaning_ko: "되돌아, 다시; 뒤"
  pattern: "동사 + back"
  usage_note: "'되돌아' 라는 뜻으로 동사 뒤에 붙여요 — come back(돌아오다), go back(돌아가다), I'll be back(다시 올게요). 몸의 '등' 이나 '뒤쪽' 을 가리키기도 해요: the back of the room."

- word: "mean"
  reason: "문형이 'mean to + 목적어' 였는데 뒤에 오는 것은 동사원형이다. 설명 속 해석 '(의도적으로 당신을 상처주려고 하지 않았어요.)' 도 한국어로 잘 쓰지 않는 말이다."
  pattern: "mean + 목적어 / mean to + 동사원형"
  usage_note: "'무슨 뜻이다' 라는 말이에요 — What does this word mean? 일부러 그랬다고 할 때는 mean to 를 쓰고 뒤에 동사원형이 와요: I didn't mean to hurt you(일부러 그런 건 아니에요)."

- word: "even"
  reason: "뜻의 '오히려' 는 even 의 뜻이 아니다. 그리고 예문 해석에서 even 이 통째로 사라져 있었다."
  meaning_ko: "심지어, ~까지도"
  usage_note: "뜻밖이라는 느낌을 얹어요 — She even tried(시도까지 했다). 꾸미고 싶은 말 바로 앞에 놓아요. even though 는 '~인데도' 라는 다른 뜻이에요."

- word: "here"
  reason: "문형이 'here + 예/아니요 (현재 위치를 묻는 질문에)' 로 뜻을 알 수 없었고, '한국어 여기는 여기에 있는 사람을 가리킨다' 도 거짓이다. 예문 'Are we here yet?' 도 영어에서는 there 를 쓴다(Are we there yet?). 혼동 목록의 here's 는 낱말이 아니다."
  pattern: "동사 + here"
  example: "Sit here, please."
  usage_note: "'여기' 예요. 동사 뒤에 붙여 자리를 가리켜요 — Sit here. Come here. 저쪽은 there 예요. Here you are 는 물건을 건네며 '여기 있어요' 라고 할 때 써요."
  confused_with: [there, this]

- word: "many"
  reason: "'많은 (불가산명사)는 much 예요' 는 문장이 되다 만 말이다."
  usage_note: "여러 개를 말할 때 써요 — many people, many books. 물이나 시간처럼 개수로 세지 않는 것에는 much 를 써요: much water."

- word: "such"
  reason: "예로 든 'so big a problem' 은 왕초보가 쓸 말이 아니고, '(둘 다 가능하지만 such이 더 자연스러워요)' 는 조사도 틀렸다."
  usage_note: "'정말 ~한' 이라는 느낌을 명사에 얹어요 — such a beautiful day, such good news. 형용사나 부사에는 such 대신 so 를 써요: so beautiful."

- word: "much"
  reason: "내용은 맞았지만 '불가산명사'·'가산명사'는 왕초보가 못 읽는 문법 용어다. 게다가 가산성을 단정한 설명은 선별기가 '사람이 봐 주세요'로 잡아 두기 때문에, 미검수인 채로는 연습장에 나가지도 못했다 — 빈도 90위가 그렇게 막혀 있었다."
  meaning_ko: "많은, 많이"
  pattern: "much + 명사 (money, time, water 등)"
  usage_note: "물·시간·돈처럼 개수로 세지 않는 것에 써요 — much water, much time. 하나둘 세는 것에는 many 를 써요: many books. 보통 아니라고 하거나 물을 때 써요: I don't have much time."

# ── 빈도 100~127위 — 24개 중 20개 ────────────────────────────────────
#
# 이 구간에서 처음 보는 유형이 하나 나왔다. **뜻과 예문이 서로 다른 낱말을 보여준다.**
# `place` 의 뜻은 명사('장소, 위치')인데 예문은 동사였다(Can I place my bag here?).
# 연습장은 예문으로 빈칸을 내고 뜻을 단서로 보여주므로, 이러면 단서가 문제를 가리킨다.

- word: "last"
  reason: "'내주' 는 요즘 잘 쓰지 않는 말이라 왕초보가 못 읽는다. last 의 다른 뜻('마지막')도 빠져 있었다."
  usage_note: "지난 것에 써요 — last week(지난주), last year(작년). 앞으로 올 것은 next 예요: next week(다음 주). '마지막' 이라는 뜻도 있어요: the last bus."

- word: "call"
  reason: "문형 'call + 목적어 (+ someone)' 에 영어 someone 이 한국어 자리에 들어가 있었다. 설명은 call 을 말하지 않고 answer 만 말했다."
  pattern: "call + 사람"
  usage_note: "전화를 건다는 뜻이에요 — Can I call you later? 이름을 부르는 데도 써요: They call me Jun. 전화를 받는 것은 answer 예요."

- word: "before"
  reason: "'한국어 이전에보다 더 구체적인 시간이나 사건을 언급할 때 써요' 는 뜻을 알 수 없는 말이다."
  usage_note: "어떤 일보다 먼저라는 뜻이에요 — before dinner(저녁 먹기 전에). 반대는 after 예요. 뒤에 문장이 통째로 올 수도 있어요: before you go."

- word: "through"
  reason: "한국어 문장 사이에 영어 낱말 whereas 가 끼어 있었다 — 'through 는 공간을 지나는 것, whereas across 는 반대편으로 가는 걸 의미해요'."
  usage_note: "안을 지나 반대편으로 나오는 것이에요 — go through the door, walk through the park. 위로 건너가는 것은 over, 가로질러 건너는 것은 across 예요."

- word: "down"
  reason: "문형 'go down + 방향' 은 down 이 방향인데 뒤에 또 방향을 받는 것처럼 읽힌다. up 항목과 짝을 맞춘다."
  pattern: "동사 + down"
  usage_note: "아래쪽으로 움직이는 것이에요 — go down, sit down, put it down. 반대는 up 이에요. 아래에 있는 상태를 말할 때는 under 를 써요: under the table."

- word: "man"
  reason: "''man' 은 'woman' 과 달리 성별이 불분명한 경우에도 쓸 수 있어요' 는 요즘 영어에서 권하지 않는 쓰임이라 왕초보에게 가르칠 것이 아니다. 성별을 가리지 않는 '사람' 은 person 이다. 혼동 목록의 men 도 헷갈리는 낱말이 아니라 같은 낱말의 복수형이다."
  meaning_ko: "남자"
  usage_note: "어른 남자예요 — a man in the park. 어른 여자는 woman 이에요. 여럿이면 men 으로 모양이 바뀌어요. 성별을 가리지 않고 '사람' 을 말할 때는 person 이나 people 을 써요."
  confused_with: [woman, person, boy]

- word: "change"
  reason: "뜻에 '달리다' 가 있었다 — change 는 뛰는 것이 아니다('달라지다' 를 잘못 쓴 것으로 보인다). 설명도 ''달리다' 는 상태 변화를 말하지만' 이라며 그 잘못을 그대로 되풀이했다."
  meaning_ko: "바꾸다, 달라지다"
  usage_note: "물건을 바꾸는 데도 쓰고(change the channel) 마음이나 상태가 달라지는 데도 써요(I changed my mind). 가게에서 받는 '거스름돈' 도 change 예요."

- word: "place"
  reason: "뜻은 명사('장소, 위치')인데 예문은 동사였다 — Can I place my bag here? 배우는 뜻과 예문이 서로 다른 낱말을 보여주고 있었다. ''Where is the place?' 는 '어디에요?'' 도 영어에서 그렇게 말하지 않는다."
  pattern: "a/the + place"
  example: "This is a good place to eat."
  usage_note: "'곳·장소' 라는 뜻의 명사예요 — a good place to eat. 물건을 놓는다는 동사로도 쓰지만 그 자리에는 put 이 더 흔해요: Put your bag here."
  confused_with: [put, spot, area]

- word: "long"
  reason: "'시간에 대해 쓸 때는 long 이 아니라 long time 을 써요' 가 거짓이다 — How long does it take? 처럼 그대로 쓴다. 혼동 목록의 'long time' 도 낱말이 아니라 구다."
  meaning_ko: "긴, 오래"
  pattern: "long + 명사 / be + long"
  usage_note: "길이가 길다는 뜻이에요 — a long pencil. 시간이 길 때도 그대로 써요: How long does it take?(얼마나 걸려요?) 키가 크다고 할 때는 long 이 아니라 tall 이에요."
  confused_with: [tall, short, high]

- word: "between"
  reason: "뜻이 '두 개 이상의 것들 사이에' 였는데 between 은 둘 사이다. 셋 이상 가운데라면 among 이다."
  meaning_ko: "(둘) 사이에"
  usage_note: "둘 사이를 가리켜요 — between the school and the library. 사이에 놓인 둘은 and 로 이어요. 셋 이상 가운데라면 among 을 써요."

- word: "too"
  reason: "''too much' 는 '너무 많다' 고 하되, 'much' 가 명사 뒤에 오는 경우에만 써요' 는 문장이 되지 않고, ''too many' 는 가산명사 뒤에 써요' 는 거짓이다 — 앞에 온다. 게다가 그 문장 때문에 가산성 단정 검사에 걸려 빈도 117위가 연습장에 나가지 못하고 있었다."
  meaning_ko: "너무; ~도"
  usage_note: "'너무' 라는 뜻이에요 — The coffee is too hot. 지나치다는 느낌이라 반가운 말에는 잘 안 붙어요(그냥 정도가 세다는 뜻은 very 예요). 문장 끝에 붙이면 '~도' 라는 다른 뜻이에요: Me too."
  confused_with: [very, also, so]

- word: "still"
  reason: "예문이 'Still hungry?' 라는 조각이었다 — 빈칸 문제로 내면 문장이 되지 않는다. ''already' 는 상태가 변했을 때 쓰는 거예요' 도 뜻을 알기 어렵다."
  example: "I am still hungry."
  usage_note: "그대로 이어지고 있다는 뜻이에요 — I am still hungry. 이미 끝났으면 already 를 써요: I already ate. 아직 안 했다고 할 때는 yet 이에요: I haven't eaten yet."

- word: "write"
  reason: "'한국어 작성하다보다 더 일반적으로 써요' 는 영어에 대해 아무것도 말하지 않는다. 과거형이 wrote 라는, 왕초보가 실제로 막히는 지점도 빠져 있었다."
  usage_note: "글자를 적는 것이에요 — write your name, write a letter. 손으로 쓰는 것이고 자판으로 치는 것은 type 이에요. 과거형은 wrote 로 모양이 바뀌어요."

- word: "same"
  reason: "''same' 은 명사나 형용사와 함께 쓰고, '같다' 는 동사로 쓰입니다' 는 성립하지 않는 대조이고, 붙은 예('I am the same' → '나는 변함없어')도 앞뒤가 맞지 않는다. 정작 same 앞에 the 를 반드시 붙인다는 것이 빠져 있었다. 혼동 목록의 'same as' 도 낱말이 아니라 구다."
  usage_note: "앞에 the 를 꼭 붙여요 — the same book. 'a same book' 이라고는 하지 않아요. 무엇과 같은지 말할 때는 as 를 붙여요: the same as that one."
  confused_with: [different, similar, as]

- word: "lot"
  reason: "''a lot' 만 쓸 때는 'a lot' 은 수량을 나타내는 부사어예요' 는 같은 말을 되풀이할 뿐 쓰는 법을 알려주지 않는다."
  usage_note: "'많이' 라는 뜻으로 a lot of 를 통째로 외워 쓰면 돼요 — a lot of food, a lot of friends. 뒤에 무슨 명사가 와도 모양이 안 바뀌어서 many·much 보다 쉬워요. 동사 뒤에 a lot 만 붙이면 '많이' 예요: I eat a lot."

- word: "great"
  reason: "''Great' 은 명사 앞에 쓰고, '좋다' 는 동사로 쓰여요' 는 good 항목과 똑같이 성립하지 않는 대조다 — 한국어 '좋다' 는 형용사다."
  usage_note: "good 보다 센 말이에요 — a great restaurant. 맞장구칠 때도 자주 써요: That's great! 크기가 크다는 뜻으로는 요즘 잘 안 쓰고 big 을 써요."

- word: "leave"
  reason: "문형과 설명의 'leave somewhere' 는 없는 형태다 — leave 뒤에는 장소가 바로 온다(leave home). 과거형 left 도 빠져 있었다."
  pattern: "leave + 목적어 / leave + 장소"
  usage_note: "두고 가는 것이에요 — Don't leave your bag here. 그 자리를 떠난다는 뜻도 돼요: I leave home at eight. 과거형은 left 로 모양이 바뀌어요."

- word: "number"
  reason: "''number' 는 명사와 형용사 모두 쓸 수 있어요' 가 거짓이다 — number 는 명사다. 붙은 예 'a number of people (많은 사람들의)' 도 해석이 어긋난다."
  usage_note: "'번호' 예요 — a phone number, room number. 세어서 나온 '수' 라는 뜻도 있어요: the number of students(학생 수). 사람에게 물을 때는 What's your number? 라고 해요."
  confused_with: [figure, amount]

- word: "both"
  reason: "''both' 는 명사 뒤에만 붙어요' 가 거짓이고, 바로 뒤에 붙은 예문(Both books are interesting)이 그것을 반박한다."
  usage_note: "둘 다라는 뜻으로 명사 앞에 놓아요 — Both books are interesting. both of them 처럼 of 를 붙이기도 해요. 셋 이상이면 all 을 써요."

# ── 빈도 128~155위 — 24개 중 20개 ────────────────────────────────────
#
# 이 구간에서 제일 나쁜 것은 `old` 다. 뜻 칸 맨 앞이 '노래' 였고, 설명이 그 위에
# "노래는 'old' 가 아니라 'old song' 처럼 명사와 함께 써야 해요" 를 얹었다.
# 틀린 전제 위에 설명을 쌓으면 이렇게 된다.
#
# 그리고 설명이 같은 항목의 예문을 반박하는 것이 또 나왔다 — while 은 "-ing 형식만
# 쓴다" 면서 예문이 while I worked 이고, become 은 "형용사로는 못 쓴다" 면서 문형이
# become + 명사/형용사 다.

- word: "own"
  reason: "설명 말투가 다른 항목들과 달리 반말이었다 — '가진다', '붙는다'."
  usage_note: "'자기 것' 이라는 뜻으로 my·your 뒤에 붙여요 — my own book(내 책), her own room. 갖고 있다는 동사로도 써요: I own a car."

- word: "point"
  reason: "'지수(point)는 수치나 의견을 말할 때 쓰는 거예요' 에서 '지수' 는 point 의 뜻이 아니다. 혼동 목록의 'point of view' 도 낱말이 아니라 구다."
  usage_note: "손가락으로 가리키는 것이에요 — point at the station. 명사로는 '점' 이나 '점수' 예요: five points. 말하려는 요지도 point 라고 해요: My point is..."
  confused_with: [tip, spot, aim]

- word: "little"
  reason: "''조금' 은 much 와 함께 쓰일 수 있지만, little 은 only 와 함께 쓰일 수 있어요' 는 문장이 되지 않는다. 정작 little 과 a little 이 뜻이 뒤집힌다는, 이 낱말에서 제일 중요한 것이 빠져 있었다."
  usage_note: "'거의 없다' 는 뜻이에요 — I have little time(시간이 거의 없어요). a 를 붙이면 뜻이 뒤집혀 '조금 있다' 가 돼요: I have a little time. 크기가 작다는 뜻으로도 써요: a little box."
  confused_with: [few, small, less]

- word: "help"
  reason: "'도와주는 사람을 나타낼 때 help 를 쓰고, 도움을 받는 사람은 help 와 함께 나타내야 해요' 는 같은 말을 두 번 하면서 아무것도 알려주지 않는다."
  usage_note: "도와준다는 뜻이에요 — Can you help me? 무엇을 도와주는지는 뒤에 동사를 붙여 말해요: help me carry this. 명사로 '도움' 도 돼요: I need help."

- word: "ask"
  reason: "문형에 영어 someone 이 한국어 자리에 들어가 있었다."
  pattern: "ask + 사람 + to + 동사원형"

- word: "something"
  reason: "'something 은 존재하는 것을, anything 은 존재하지 않는 것을 말할 때 쓰는 경우가 많아요' 가 거짓이다. 둘의 차이는 존재가 아니라 some 과 any 의 규칙과 같다."
  usage_note: "'무언가' 예요 — something to eat. 아니라고 하거나 물어볼 때는 anything 으로 바꿔요: I don't have anything. 다만 권할 때는 물음에도 something 을 써요: Would you like something to drink?"

- word: "become"
  reason: "''I became happy' 는 자연스럽지 않아요. 'I became a happy person' 처럼 명사로 표현해야 해요' 가 거짓이다 — become 뒤에는 형용사가 바로 온다(become cold, become famous). 같은 항목의 문형('become + 명사/형용사')이 그것을 반박한다."
  usage_note: "무엇이 되거나 어떤 상태로 바뀌는 것이에요 — I became a teacher. 뒤에 형용사도 바로 올 수 있어요: It became cold. 과거형은 became 이에요."

- word: "interest"
  reason: "뜻이 '관심이 되다' 였는데 한국어로 성립하지 않는 말이고, 설명도 그것을 그대로 되풀이했다. interest·interested·interesting 세 모양을 가르는 것이 이 낱말의 요점이다."
  meaning_ko: "관심, 흥미"
  pattern: "interest in + 명사"
  usage_note: "명사로 '관심' 이에요 — an interest in music. 사람이 관심 있다고 할 때는 interested 로 바꿔 써요: I'm interested in cooking. 무엇이 재미있다고 할 때는 interesting 이에요."
  confused_with: [interested, interesting, hobby]

- word: "country"
  reason: "''country' 는 'nation' 보다 더 넓은 의미로 쓰이기도 해요' 는 근거가 없다. countryside 와의 대조는 쓸모가 있어 살렸다."
  usage_note: "나라예요 — I'm from a small country. 도시 밖의 시골을 가리킬 때도 쓰는데, 그때는 the country 나 countryside 라고 해요."

- word: "old"
  reason: "뜻 칸 맨 앞에 '노래' 가 들어 있었다 — old 는 노래가 아니다. 설명도 '노래는 old 가 아니라 old song 처럼 명사와 함께 써야 해요' 라며 그 잘못 위에 다시 말을 얹었다."
  meaning_ko: "오래된, 나이 든"
  usage_note: "생긴 지 오래됐다는 뜻이에요 — an old house. 사람에게 쓰면 '나이 든' 이에요: an old man. 나이를 말할 때도 써요: I'm twenty years old. 반대는 물건이면 new, 사람이면 young 이에요."
  confused_with: [new, young, ancient]

- word: "school"
  reason: "문형이 'school +에서' 로 한글 조사가 영어 문형 자리에 들어가 있었다. 설명도 '학교에 다니는 곳은 school, 학교에 관련된 곳은 school 예요' 로 같은 말을 두 번 했다."
  pattern: "go to + school"
  usage_note: "학교예요 — I go to school every day. 건물이 아니라 '공부하러 간다' 는 뜻일 때는 the 를 붙이지 않아요: go to school. 대학은 university 나 college 라고 해요."

- word: "high"
  reason: "''high' 은' 은 조사가 틀렸다. tall 과의 차이도 더 또렷하게 적는다."
  usage_note: "위로 많이 올라간 것에 써요 — a high mountain, a high building. 사람이나 나무처럼 가늘고 긴 것에는 tall 을 써요. 수준이 높다는 뜻도 있어요: high quality."

- word: "different"
  reason: "''이건 다른 거야' 는 'This is different' 만으로 표현할 수 없어요' 가 거짓이다 — 그것만으로 완전한 문장이다."
  usage_note: "다르다는 뜻이에요 — This is different. 무엇과 다른지 말할 때는 from 을 붙여요: different from that one. 반대는 same 이고 그때는 as 를 붙여요."

- word: "off"
  reason: "'한국어 꺼다와 유사하지만' 의 '꺼다' 는 없는 말이다 — '끄다' 다."
  usage_note: "무언가에서 떨어진다는 느낌이에요 — turn off the light(끄다), take off your coat(벗다), get off the bus(내리다). 반대는 on 이에요."

- word: "next"
  reason: "설명이 '다음에 할 일은 next에요. 다음에는 next에, 다음은 next에 쓰지만' 으로 같은 말을 세 번 되풀이하다 무너졌고, 'next에요' 는 오타다."
  usage_note: "다음 차례라는 뜻이에요 — next week(다음 주), Who's next?(다음은 누구예요?) 지난 것은 last 예요. 바로 옆이라는 뜻으로는 next to 를 써요: next to the bank."

- word: "end"
  reason: "''end' 는 목적어가 사물일 때만 써요' 가 거짓이다. 같은 항목의 예문(The movie ends at 10 PM)부터 목적어가 없다."
  pattern: "end + at/in + 시간 / end up + -ing"
  usage_note: "끝난다는 뜻이에요 — The movie ends at 10. 명사로 '끝' 도 돼요: the end of the movie. 하다 보니 그렇게 됐다고 할 때는 end up 을 써요: I ended up crying."

- word: "live"
  reason: "'한국어 살다는 목적어가 필요하지만' 이 거짓이다 — 한국어 '살다' 도 목적어를 받지 않는다. 뒤에 붙은 지적(I live Seoul 은 틀렸다)은 맞아서 살렸다."
  usage_note: "어디에 산다고 할 때 in 이나 at 을 붙여요 — I live in Seoul. 'I live Seoul' 이라고는 하지 않아요. 사람이 살아 있다는 뜻으로도 써요."

- word: "why"
  reason: "문형이 'why + 목적어' 였는데 why 뒤에 오는 것은 목적어가 아니라 be 동사나 do 다."
  pattern: "why + be/do + 주어"
  usage_note: "이유를 물을 때 써요 — Why are you late? 뒤에 be 동사나 do 가 먼저 오고 그다음에 주어가 와요. 'Why you are late?' 라고 하지 않아요. 대답은 because 로 해요."

- word: "while"
  reason: "''while' 은 -ing 형식만 쓰고' 가 거짓이고, 같은 항목의 예문(I listened to music while I worked)이 그것을 반박한다."
  usage_note: "'~하는 동안' 이라는 뜻이에요. 뒤에 문장이 통째로 와요 — while I worked. -ing 를 바로 붙이기도 해요: while working. when 은 한 시점을, while 은 이어지는 동안을 가리켜요."

- word: "world"
  reason: "설명이 한국어 '세상' 과 '세계' 만 견주고 world 에 대해서는 아무것도 말하지 않았다. 예문 'What's the world like?' 도 왕초보가 쓸 말이 아니다."
  example: "I want to see the world."
  usage_note: "'세상·세계' 예요. 앞에 the 를 붙여 the world 로 써요 — the biggest city in the world. 지구라는 덩어리를 가리킬 때는 the earth 라고 해요."

# ── 빈도 156~179위 — 22개 중 16개 (상위 150개 검수 끝) ──────────────────
#
# 예문이 영어로 어색한 것이 이 구간에 몰려 있다. woman 의 예문은 "This is my
# mother, a woman." 이었고 — 사람을 소개하며 '여성입니다' 를 덧붙이지 않는다 —
# system 은 "This computer has a good system.", group 은 수동태였다.

- word: "might"
  reason: "설명 안에 '~게 좋을 거예요. 라는 뜻이에요' 처럼 마침표가 문장 가운데 끼어 문장이 끊겼다."
  usage_note: "아마 그럴 수도 있다는 뜻이에요 — I might come tomorrow. may 와 뜻이 거의 같은데 might 가 조금 더 자신 없는 느낌이에요. 뒤에는 동사원형이 와요."

- word: "must"
  reason: "'You must wear a helmet' 을 '보호대를 꼭 써야 해요' 라고 옮겼다. helmet 은 헬멧이지 보호대가 아니다."
  usage_note: "꼭 그래야 한다는 뜻이에요 — I must go now. should 보다 세고 규칙이나 명령에 가까워요: You must wear a helmet(헬멧을 꼭 써야 해요). 일상에서는 have to 를 더 많이 써요."

- word: "include"
  reason: "'한국어 포함하다와 비슷하지만, 영어에서는 include 가 더 자주 쓰여요' 는 무엇보다 더 자주 쓰인다는 것인지 알 수 없다."
  usage_note: "안에 들어 있다는 뜻이에요 — The price includes breakfast(가격에 아침이 들어 있어요). 상자나 그릇에 물건이 들어 있을 때는 contain 을 써요."

- word: "course"
  reason: "''course' 는 'meal' 과는 다르게 식사와는 관련이 없어요' 가 거짓이다 — 코스 요리의 그 코스가 course 다(the main course)."
  meaning_ko: "강좌, 과정"
  pattern: "a course in + 과목"
  usage_note: "배우는 강좌예요 — a course in English. 식사의 '코스' 도 course 라고 해요: the main course. of course 는 '물론이죠' 라는 다른 말이에요."
  confused_with: [class, subject, lesson]

- word: "house"
  reason: "'한국어 집은 복수형이 없지만' 은 영어를 배우는 데 쓸모가 없다. house 와 home 의 차이는 살렸다."
  usage_note: "사람이 사는 건물이에요 — This is my house. 건물 자체를 가리키고, '우리 집' 이라는 따뜻한 느낌은 home 이에요. 여럿이면 houses 예요."

- word: "group"
  reason: "'한국어 그룹은 ... 집단보다 더 구체적인 의미예요' 는 한국어 낱말끼리만 견주고 영어에 대해서는 말하지 않는다. 예문 'We are divided into groups.' 도 수동태라 왕초보가 읽을 문장이 아니다."
  pattern: "a group of + 명사"
  example: "A group of students is waiting."
  usage_note: "사람이나 물건이 모인 한 무리예요 — a group of students. 앞에 a, 뒤에 of 를 붙이는 꼴로 많이 써요. 함께 일하거나 겨루는 무리는 team 이라고 해요."

- word: "woman"
  reason: "예문이 'This is my mother, a woman.' 이었다 — 영어에서 사람을 소개하며 '여성입니다' 를 덧붙이지 않는다. 혼동 목록에 girl 하나뿐이라 man 과의 짝도 보이지 않았다."
  example: "That woman is my teacher."
  usage_note: "어른 여자예요 — That woman is my teacher. 어른 남자는 man 이에요. 여럿이면 women 으로 모양이 바뀌고 소리도 달라져요. 어린 여자아이는 girl 이에요."
  confused_with: [man, girl, lady]

- word: "around"
  reason: "''near' 보다 더 멀리 있지만, 'far away' 보다는 가까워요' 는 근거가 없다. 정작 around 가 '둘레를 돌아' 라는 뜻이라는 것과 '대략' 이라는 흔한 쓰임이 빠져 있었다."
  usage_note: "둘레나 근처를 가리켜요 — around the corner(모퉁이를 돌면), walk around the park(공원을 한 바퀴 돌다). 숫자 앞에 붙이면 '대략' 이라는 뜻이에요: around ten o'clock."

- word: "family"
  reason: "설명이 한국어 '가족' 의 범위만 말하고 family 를 쓰는 법에 대해서는 아무것도 말하지 않았다."
  usage_note: "가족이에요 — This is my family. 한 덩어리로 볼 때는 단수로 받아요. 친척까지 말하려면 relatives 라고 해요."

- word: "let"
  reason: "뜻에 '잠시 빌려주다' 가 있었는데 그건 lend 다. 혼동 목록의 let's 도 헷갈리는 다른 낱말이 아니라 let us 의 준말이다."
  meaning_ko: "~하게 해 주다, 허락하다"
  usage_note: "누가 무엇을 하게 해 준다는 뜻이에요 — Let me help you(제가 도울게요). 뒤에 사람과 동사원형이 차례로 와요: let him go. Let's 는 '~하자' 라는 다른 말이에요."
  confused_with: [allow, make, permit]

- word: "again"
  reason: "문형 'again + 문장 (문장 맨 앞 or 뒤)' 에 영어 or 가 한국어 자리에 들어가 있었고, again 은 보통 문장 끝에 온다. 설명도 ''다시' 는 주로 문장 중간에 쓰입니다' 로 한국어만 말했다."
  pattern: "문장 + again"
  usage_note: "한 번 더라는 뜻이에요. 보통 문장 끝에 붙여요 — Can we try again? Say it again, please. 두 번이라고 딱 짚어 말할 때는 twice 를 써요."

- word: "kind"
  reason: "설명이 'kind of' 를 '어느 정도' 라고 옮겼는데 한국어로 어색하다 — '좀·약간' 이다. 그리고 문형이 'kind + of + 명사' 뿐이라 예문(a kind person)이 문형을 보여주지 못했다."
  pattern: "kind + 명사 / kind of + 명사"
  usage_note: "마음이 따뜻하다는 뜻이에요 — She is a kind person. kind of 는 아주 다른 말이라 '좀·약간' 이라는 뜻이에요: This is kind of expensive(이거 좀 비싸요). '종류' 라는 뜻도 있어요: What kind of coffee?"

- word: "keep"
