  pattern: "동사 + back"
  usage_note: "'되돌아' 라는 뜻으로 동사 뒤에 붙여요 — come back(돌아오다), go back(돌아가다), I'll be back(다시 올게요). 몸의 '등' 이나 '뒤쪽' 을 가리키기도 해요: the back of the room."

- word: "mean"
