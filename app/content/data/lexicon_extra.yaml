# WordNet 이 모르는데 실재하는 말. **조회해서 적은 것이지 지어낸 것이 아니다.**
#
# WordNet 은 2006년 판이라 그 뒤 자리 잡은 일상어를 모른다 — americano, latte,
# smoothie, wifi. 이 앱의 첫 시나리오가 카페 주문인데 americano 를 '없는 단어'로
# 판정하면 빈칸 채점이 학습자에게 '그런 단어가 없어요'라고 말한다.
#
# 항목마다 Wiktionary 뜻풀이와 주소를 남긴다. 손으로 늘리지 말고
# `scripts/verify_words.py` 로 다시 만든다.
#
# pos 는 품사 대조에 쓰는 태그(n/v/a/r)이고, pos_raw 는 Wiktionary 가 적은 그대로다.
