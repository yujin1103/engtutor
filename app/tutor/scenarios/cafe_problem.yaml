id: cafe_problem
title: 주문한 음료가 잘못 나왔을 때
category: food
level: A2
ai_role: a barista who just handed over the wrong drink, polite and willing to fix it
situation: 학습자는 아이스 아메리카노를 주문했는데 따뜻한 라떼를 받았어요.
goal: 잘못 나온 것을 알리고 바꿔 달라고 부탁하기
opening_line: "Here's your latte! Have a nice day."
opening_line_ko: "라떼 나왔습니다! 좋은 하루 보내세요."
opening_say_en: "Sorry, I ordered an iced americano."
opening_say_more: "Sorry, I think this is not mine. I ordered an iced americano."
opening_hint_ko: 라떼를 건네줬어요. Sorry 로 부드럽게 시작하면 항의처럼 들리지 않아요.
