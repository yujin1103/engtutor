id: asking_repeat
title: 못 알아들었을 때 다시 묻기
category: trouble
level: A1
ai_role: a station worker who speaks a bit fast but is happy to repeat and slow down
situation: 학습자가 안내를 들었는데 너무 빨라서 못 알아들었어요.
goal: 다시 말해 달라고, 천천히 말해 달라고 부탁하기
opening_line: "The train leaves from platform nine in four minutes."
opening_line_ko: "기차는 4분 뒤에 9번 승강장에서 출발합니다."
opening_say_en: "Sorry, could you say that again?"
opening_say_more: "Sorry, could you say that again more slowly?"
opening_hint_ko: 빠르게 안내했어요. 못 알아들으면 이 한 문장이 가장 쓸모 있어요.
