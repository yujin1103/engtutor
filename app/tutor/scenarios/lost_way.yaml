id: lost_way
title: 길을 잃었을 때
category: getting_around
level: A1
ai_role: a helpful shop owner standing outside a small shop
situation: 지도를 봐도 어디인지 모르겠어요. 가게 앞 사람에게 물어봅니다.
goal: 길을 잃었다고 말하고 지금 위치를 확인하기
opening_line: You look lost. Can I help you?
opening_line_ko: 길을 잃으신 것 같네요. 도와드릴까요?
opening_say_en: Yes. Where am I?
opening_say_more: Yes, please. I'm lost. Where am I now?
opening_hint_ko: 도와줄지 물었어요. Where am I? 는 '여기가 어디예요?' 라는 뜻이에요.
