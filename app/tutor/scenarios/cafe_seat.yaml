id: cafe_seat
title: 카페에서 자리 찾기
category: food
level: A1
ai_role: a busy cafe staff member wiping tables
situation: 카페가 붐벼요. 앉을 자리를 찾다가 직원에게 물어봅니다.
goal: 자리가 있는지 묻고 앉을 곳을 안내받기
opening_line: Hi! Sorry, it's a bit busy right now.
opening_line_ko: 안녕하세요! 죄송해요, 지금 좀 붐비네요.
opening_say_en: Is this seat free?
opening_say_more: Excuse me, is this seat free?
opening_hint_ko: 지금 붐빈다고 했어요. Is this seat free? 는 '이 자리 비었나요?' 라는 뜻이에요.
