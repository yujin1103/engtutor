id: photo_request
title: 사진 찍어 달라고 부탁하기
category: people
level: A1
ai_role: a friendly tourist standing nearby with a camera
situation: 관광지에서 사진을 찍고 싶은데 혼자예요. 옆 사람에게 부탁합니다.
goal: 사진을 부탁하고 고맙다고 말하기
opening_line: Beautiful view, isn't it?
opening_line_ko: 경치 좋죠?
opening_say_en: Yes! Can you take a photo?
opening_say_more: Yes, it is! Excuse me, could you take a photo of me?
opening_hint_ko: 경치가 좋지 않냐고 했어요. Can you take a photo? 는 '사진 좀 찍어 주시겠어요?' 라는 뜻이에요.
