id: directions
title: 길 묻기
level: A2
ai_role: a helpful stranger waiting at a bus stop
situation: 학습자는 낯선 동네에서 지하철역을 찾고 있어요. 버스 정류장에 사람이 한 명 서 있어요.
goal: 지하철역까지 가는 길을 묻고, 걸리는 시간까지 확인하기
opening_line: "Are you looking for something?"
opening_hint_ko: 먼저 실례한다고 말하고 물어보세요. "Excuse me, how do I get to ~ ?" 가 자연스러워요.
