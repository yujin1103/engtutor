# 동사 하나가 가지는 다른 모양들. **손으로 골라 검수했다.**
#
# 왜 코드가 만들지 않고 여기 적어 두는가
# --------------------------------------
# 만들려고 해 봤고, 안전하게는 안 된다. WordNet 은 **표면 철자를 검사하지 못한다** —
# `morphy('builded')` 도 `known('attachs')` 도 참을 돌려준다. 접미사를 떼어 원형에
# 닿기만 하면 통과시키기 때문이다(그게 원형 찾기의 일이지 철자 검사의 일이 아니다).
# 색인 원본(`all_lemma_names`)은 반대로 너무 좁다 — `announcing`·`canceling` 같은
# 멀쩡한 형태가 표제어에 없다. 완전한 표면형 사전은 이 환경에 없다.
#
# 그리고 -ing 의 자음 겹치기는 **강세**에 달려 있어 규칙으로 정할 수 없다.
# prefer→preferring 인데 offer→offering 이고, open→opening 이지 openning 이 아니다.
#
# 그래서 이 프로젝트의 원칙 그대로 한다 — 미리 만들고, 사람이 보고, 서빙은 조회.
# `openning`·`builded` 같은 것이 학습자 앞에 놓일 길이 아예 없다.
#
# 고를 때 걷어낸 것들: `extensor`(해부학 용어), `solvent`(다른 뜻), `annunciatory`·
# `obtention`·`jointure`·`servitor`(왕초보가 평생 안 볼 말), `decor`(뜻이 잘렸다).
#
# 칸 이름이 곧 학습자에게 보여줄 이름이다 — ing=동명사, noun=명사, adj=형용사,
# past=과거형, s=3인칭 단수. 오답 셋은 이 중에서 고른다.

verbs:
  adjust:    {ing: adjusting,     noun: adjustment,     adj: adjustable}
  amend:     {ing: amending,      noun: amendment,      past: amended}
  announce:  {ing: announcing,    noun: announcement,   past: announced}
